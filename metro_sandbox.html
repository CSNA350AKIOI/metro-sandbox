    // =======================================================================
    // Canvas Rendering (Theme-Aware)
    // =======================================================================
    drawGrid(ctx, pal) {
      const tl = this.screenToWorld(0, 0);
      const br = this.screenToWorld(this.width, this.height);
      const step = this.cam.zoom < 0.45 ? GRID_SIZE * 4 : GRID_SIZE;
      const major = step * 5;

      ctx.lineWidth = 1 / this.cam.zoom;
      ctx.beginPath();
      ctx.strokeStyle = pal.gridMinor;
      for (let x = Math.floor(tl.x / step) * step; x <= br.x; x += step) {
        if (Math.abs(x % major) < 1e-3) continue;
        ctx.moveTo(x, tl.y);
        ctx.lineTo(x, br.y);
      }
      for (let y = Math.floor(tl.y / step) * step; y <= br.y; y += step) {
        if (Math.abs(y % major) < 1e-3) continue;
        ctx.moveTo(tl.x, y);
        ctx.lineTo(br.x, y);
      }
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = pal.gridMajor;
      for (let x = Math.floor(tl.x / major) * major; x <= br.x; x += major) {
        ctx.moveTo(x, tl.y);
        ctx.lineTo(x, br.y);
      }
      for (let y = Math.floor(tl.y / major) * major; y <= br.y; y += major) {
        ctx.moveTo(tl.x, y);
        ctx.lineTo(br.x, y);
      }
      ctx.stroke();
    }

    drawSinglePlatform(ctx, pal, p, forceTop = false) {
      const zl = p.zLayer || 0;
      const isPlatSel = this.selectedEntity && this.selectedEntity.type === 'platform' && this.selectedEntity.id === p.id;
      ctx.save();
      ctx.translate(p.cx, p.cy);
      ctx.rotate(p.rad);
      const halfL = p.length / 2;
      const halfW = p.width / 2;

      if (forceTop) {
        ctx.shadowColor = 'rgba(245, 158, 11, 0.36)';
        ctx.shadowBlur = 10;
      } else if (zl > 0) {
        ctx.shadowColor = 'rgba(15, 23, 42, 0.28)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;
      } else if (zl < 0) {
        ctx.globalAlpha = 0.82;
      }
      ctx.fillStyle = pal.platformFill;
      ctx.strokeStyle = isPlatSel ? '#f59e0b' : pal.platformStroke;
      ctx.lineWidth = isPlatSel ? 2.8 : (zl > 0 ? 1.9 : 1.4);
      ctx.beginPath();
      ctx.roundRect(-halfL, -halfW, p.length, p.width, 4);
      ctx.fill();
      ctx.stroke();

      [-1, 1].forEach(side => {
        const info = p.sides[String(side)];
        if (info.type === 'track') {
          ctx.strokeStyle = pal.tactileLine;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-halfL + 4, side * (halfW - 2.6));
          ctx.lineTo(halfL - 4, side * (halfW - 2.6));
          ctx.stroke();
        } else if (info.type === 'platform') {
          ctx.strokeStyle = pal.islandSeam;
          ctx.lineWidth = 1.2;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.moveTo(-halfL + 6, side * halfW);
          ctx.lineTo(halfL - 6, side * halfW);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      ctx.fillStyle = pal.platformText;
      ctx.font = '600 10.5px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (Math.cos(p.rad) < -0.01) ctx.rotate(Math.PI);
      ctx.fillText(`${p.name} (${p.length}m)`, 0, 0.5);
      ctx.restore();

      // Show snap points ONLY in platform mode OR on the selected platform in select mode (NEVER in track mode!)
      const showSnapPts = this.mode === 'platform' || (this.mode === 'select' && isPlatSel);
      if (showSnapPts) {
        for (const sp of this.platforms.getSnapPoints(p)) {
          if (sp.occupied) continue;
          const isHover = this.hoveredSnapPoint &&
            this.hoveredSnapPoint.platformId === sp.platformId &&
            this.hoveredSnapPoint.side === sp.side;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, isHover ? 7 : 5, 0, Math.PI * 2);
          ctx.fillStyle = isHover ? '#0ea5e9' : 'rgba(14, 165, 233, 0.28)';
          ctx.fill();
          ctx.strokeStyle = '#0ea5e9';
          ctx.lineWidth = 1.6;
          ctx.stroke();
        }
      }
    }

    drawPlatforms(ctx, pal, layerFilter = null) {
      const selPlatId = (this.selectedEntity && this.selectedEntity.type === 'platform') ? this.selectedEntity.id : null;
      for (const p of this.platforms.platforms.values()) {
        if (selPlatId && p.id === selPlatId) continue; // Drawn on very top by drawSelectedOverlay()
        const zl = p.zLayer || 0;
        if (layerFilter !== null && zl !== layerFilter) continue;
        this.drawSinglePlatform(ctx, pal, p, false);
      }
    }

    // Temporarily render the currently selected entity (platform / edge / node) on the very top layer for easy interaction
    drawSelectedOverlay(ctx, pal) {
      if (!this.selectedEntity) return;
      const { type, id } = this.selectedEntity;
      if (type === 'platform') {
        const p = this.platforms.platforms.get(id);
        if (p) this.drawSinglePlatform(ctx, pal, p, true);
      } else if (type === 'edge') {
        const e = this.graph.edges.get(id);
        if (!e) return;
        const a = this.graph.getNode(e.from), b = this.graph.getNode(e.to);
        if (!a || !b) return;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      } else if (type === 'node') {
        const n = this.graph.getNode(id);
        if (!n) return;
        ctx.save();
        ctx.beginPath();
        ctx.arc(n.x, n.y, 7.2, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.restore();
      }
    }

    drawTracks(ctx, pal) {
      const { trims, curves } = this.graph.computeTrackFilletData();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const strokeNet = (color, width, filterFn = null) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        for (const e of this.graph.edges.values()) {
          if (filterFn && !filterFn(e)) continue;
          const a = this.graph.getNode(e.from);
          const b = this.graph.getNode(e.to);
          if (!a || !b) continue;
          const t = trims.get(e.id) || { startTrim: 0, endTrim: 0 };
          const vx = (b.x - a.x) / e.length;
          const vy = (b.y - a.y) / e.length;
          ctx.moveTo(a.x + vx * t.startTrim, a.y + vy * t.startTrim);
          ctx.lineTo(b.x - vx * t.endTrim, b.y - vy * t.endTrim);
        }
        for (const c of curves) {
          if (filterFn && !filterFn(c.edgeA) && !filterFn(c.edgeB)) continue;
          ctx.moveTo(c.p0.x, c.p0.y);
          ctx.quadraticCurveTo(c.ctrl.x, c.ctrl.y, c.p1.x, c.p1.y);
        }
        ctx.stroke();
      };

      strokeNet(pal.trackBed, 9);
      strokeNet(pal.trackRail, 3.2);
      strokeNet(pal.stationRail, 2.2, e => e.isStationTrack);

      if (this.showBlocks && !this.routeDraft) {
        // Draw live Moving-Block Safety Envelope ahead of every train (stretches/shrinks directly with blockDistance!)
        ctx.save();
        ctx.lineCap = 'round';
        for (const train of this.dispatcher.trains.values()) {
          const route = this.routes.routes.get(train.routeId);
          if (!route || route.segments.length === 0) continue;
          const envLen = this.dispatcher.blockDistance;
          const segs = Math.max(4, Math.ceil(envLen / 12));
          ctx.strokeStyle = train.state === 'WAITING' ? 'rgba(244, 63, 94, 0.55)' : 'rgba(245, 158, 11, 0.34)';
          ctx.lineWidth = 10;
          ctx.beginPath();
          let started = false;
          for (let k = 0; k <= segs; k++) {
            const pt = route.sampleAt(train.headS + (envLen * k) / segs);
            if (!pt) continue;
            if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();

          // End-of-authority (EOA) marker dot at exact blockDistance ahead of nose
          const endPt = route.sampleAt(train.headS + envLen);
          if (endPt) {
            ctx.beginPath();
            ctx.arc(endPt.x, endPt.y, 3.2, 0, Math.PI * 2);
            ctx.fillStyle = train.state === 'WAITING' ? '#f43f5e' : '#f59e0b';
            ctx.fill();
          }
        }
        ctx.restore();
      }
      if (this.selectedEntity && this.selectedEntity.type === 'edge') {
        strokeNet('#f59e0b', 7, e => e.id === this.selectedEntity.id);
      }

      const soloRouteId = (this.inspectedRouteId && (this.mode === 'route' || this.mode === 'simulate') && this.routes.routes.has(this.inspectedRouteId)) ? this.inspectedRouteId : null;
      if ((this.showRoutes || soloRouteId) && !this.routeDraft) {
        const coMap = this._frameCoMap || this.routes.getEdgeCoRunningMap();
        // Deduplicate co-running highlight lines on each edge by effective color so same-color lines merge into ONE!
        const edgeColorSlots = new Map();
        const getSlotsForEdge = (edgeId, fallbackRoute) => {
          if (edgeColorSlots.has(edgeId)) return edgeColorSlots.get(edgeId);
          const rawList = soloRouteId ? [this.routes.routes.get(soloRouteId)].filter(Boolean) : (coMap.get(edgeId) || [fallbackRoute]);
          const uniq = [];
          const seen = new Set();
          for (const rt of rawList) {
            if (!rt) continue;
            const c = (soloRouteId ? rt.color : this.getEffectiveRouteColor(rt)).toLowerCase();
            if (!seen.has(c)) { seen.add(c); uniq.push(c); }
          }
          edgeColorSlots.set(edgeId, uniq);
          return uniq;
        };
        const drawnSegColors = new Set();
        for (const route of this.routes.routes.values()) {
          if (soloRouteId && route.id !== soloRouteId) continue;
          if (!soloRouteId && !this.routes.isRouteVisible(route)) continue;
          if (route.segments.length === 0) continue;
          const isSel = Boolean(soloRouteId);
          const effColor = soloRouteId ? route.color : this.getEffectiveRouteColor(route);
          const effKey = effColor.toLowerCase();
          ctx.save();
          ctx.globalAlpha = 0.94;
          ctx.strokeStyle = effColor;
          ctx.lineWidth = isSel ? 4.2 : 3.0;
          for (const seg of route.segments) {
            const slots = getSlotsForEdge(seg.edgeId, route);
            const k = slots.length;
            const idx = Math.max(0, slots.indexOf(effKey));
            const edge = this.graph.edges.get(seg.edgeId);
            let nx = -seg.ty, ny = seg.tx;
            if (edge) {
              const a = this.graph.getNode(edge.from);
              const b = this.graph.getNode(edge.to);
              if (a && b) {
                // Globally canonical direction (+x right, or +y down if vertical) so parallel co-running lines NEVER twist (不拧麻花)!
                let dx = b.x - a.x, dy = b.y - a.y;
                if (dx < -1e-3 || (Math.abs(dx) <= 1e-3 && dy < 0)) { dx = -dx; dy = -dy; }
                const elen = Math.hypot(dx, dy) || 1;
                nx = -dy / elen;
                ny = dx / elen;
              }
            }
            const offset = k > 1 ? (idx - (k - 1) / 2) * 5.2 : 0;
            const x1 = seg.ax + nx * offset, y1 = seg.ay + ny * offset;
            const x2 = seg.bx + nx * offset, y2 = seg.by + ny * offset;
            const pA = `${Math.round(x1)},${Math.round(y1)}`;
            const pB = `${Math.round(x2)},${Math.round(y2)}`;
            const segDedupKey = (pA <= pB ? `${pA}|${pB}` : `${pB}|${pA}`) + `|${effKey}`;
            if (!isSel && drawnSegColors.has(segDedupKey)) continue;
            drawnSegColors.add(segDedupKey);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      if (this.routeDraft && this.routeDraft.nodeIds.length > 0) {
        const GAP = '__GAP__';
        const ids = this.routeDraft.nodeIds;
        const n = ids.length;
        const RIGHT_OFFSET = 6; // Offset strictly to the RIGHT of travel direction so A->B and B->A separate cleanly!
        ctx.save();
        ctx.lineCap = 'round';
        const hasWrap = n >= 3 && ids[0] !== GAP && ids[n - 1] !== GAP && (this.routeDraft.editingRouteId || !!this.graph.getEdgeBetween(ids[n - 1], ids[0]));
        const segCount = (hasWrap || ids[n - 1] === GAP) ? n : n - 1;
        for (let i = 0; i < segCount; i++) {
          if (ids[i] === GAP) continue;
          const nextRawIdx = (i + 1) % n;
          const isGap = ids[nextRawIdx] === GAP;
          const targetIdx = isGap ? (nextRawIdx + 1) % n : nextRawIdx;
          if (ids[targetIdx] === GAP) continue;
          const a = this.graph.getNode(ids[i]);
          const b = this.graph.getNode(ids[targetIdx]);
          if (!a || !b) continue;
          const segLen = dist(a.x, a.y, b.x, b.y);
          if (segLen < 1e-3) continue;
          const tx = (b.x - a.x) / segLen;
          const ty = (b.y - a.y) / segLen;
          // In canvas (+x right, +y down), right-hand normal of (tx, ty) is (-ty, tx)
          const rx = -ty;
          const ry = tx;
          const ax = a.x + rx * RIGHT_OFFSET;
          const ay = a.y + ry * RIGHT_OFFSET;
          const bx = b.x + rx * RIGHT_OFFSET;
          const by = b.y + ry * RIGHT_OFFSET;
          const connected = !isGap && !!this.graph.getEdgeBetween(ids[i], ids[targetIdx]);

          const isSegSel = this.routeDraft.selectedSegIdx === i;
          if (isSegSel) {
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
            ctx.lineWidth = 10;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(bx, by);
            ctx.stroke();
          }
          ctx.strokeStyle = isSegSel ? '#f59e0b' : (connected ? this.routeDraft.color : '#f43f5e');
          ctx.lineWidth = isSegSel ? 5.2 : 4.2;
          ctx.setLineDash(connected ? [] : [7, 5]);
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();

          if (segLen >= 24) {
            ctx.setLineDash([]);
            const mx = (ax + bx) / 2;
            const my = (ay + by) / 2;
            const ang = Math.atan2(ty, tx);
            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(ang);
            ctx.fillStyle = connected ? '#ffffff' : '#fecdd3';
            ctx.beginPath();
            ctx.moveTo(5, 0);
            ctx.lineTo(-3.5, -3.5);
            ctx.lineTo(-1.5, 0);
            ctx.lineTo(-3.5, 3.5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();
      }

      const drawnBad = new Set();
      for (const r of this.routes.routes.values()) {
        if (!this.routes.isRouteVisible(r)) continue;
        for (const bad of (r.invalidUturns || [])) {
          if (drawnBad.has(bad.nodeId)) continue;
          drawnBad.add(bad.nodeId);
          const n = this.graph.getNode(bad.nodeId);
          if (!n) continue;
          ctx.save();
          ctx.translate(n.x, n.y - 20);
          ctx.fillStyle = 'rgba(244, 63, 94, 0.92)';
          ctx.beginPath();
          ctx.roundRect(-26, -9, 52, 18, 5);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '700 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('非法折返', 0, 0.5);
          ctx.restore();
        }
      }

      if (this.routeDraft) {
        const drawnTb = new Set();
        for (const r of this.routes.routes.values()) {
          if (this.routeDraft.editingRouteId && r.id !== this.routeDraft.editingRouteId) continue;
          if (!this.routeDraft.editingRouteId && !this.routes.isRouteVisible(r)) continue;
          for (const tb of r.turnbackPoints) {
            if (drawnTb.has(tb.nodeId)) continue;
            drawnTb.add(tb.nodeId);
            const n = this.graph.getNode(tb.nodeId);
            if (!n) continue;
            ctx.save();
            ctx.translate(n.x, n.y - 16);
            ctx.fillStyle = pal.tbBg;
            ctx.strokeStyle = pal.tbBorder;
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.roundRect(-16, -9, 32, 18, 5);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = pal.tbText;
            ctx.font = '700 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('折返', 0, 0.5);
            ctx.restore();
          }
        }
      }

      const showNodes = this.mode !== 'simulate';
      const showNodeIds = Boolean(this.routeDraft || this.pendingRouteInsert);
      const validNextIds = new Set();
      if (this.routeDraft && this.routeDraft.nodeIds.length > 0) {
        const tipId = this.routeDraft.nodeIds[this.routeDraft.nodeIds.length - 1];
        for (const nb of this.graph.getNeighbors(tipId)) validNextIds.add(nb.nodeId);
      }
      if (this.pendingRouteInsert) {
        validNextIds.add(this.pendingRouteInsert.fromId);
        validNextIds.add(this.pendingRouteInsert.toId);
      }

      const bridgeBendNodeIds = new Set();
      for (const cr of this.graph.crossings.values()) {
        if (cr.bendNodeId && (cr.type === 'overpass' || cr.type === 'underpass')) bridgeBendNodeIds.add(cr.bendNodeId);
      }
      for (const n of this.graph.nodes.values()) {
        if (n.isImplicit || bridgeBendNodeIds.has(n.id)) continue;
        const isHover = this.hoveredNodeId === n.id;
        const isNodeSel = this.selectedEntity && this.selectedEntity.type === 'node' && this.selectedEntity.id === n.id;
        const isFocused = this.focusedNodeId === n.id;
        const isDraftStart = this.routeDraft && this.routeDraft.nodeIds[0] === n.id;
        const isChainStart = this.trackChainStartNode && this.trackChainStartNode.id === n.id;
        const isValidNext = validNextIds.has(n.id);
        const isJunction = this.graph.getIncidentEdges(n.id).length >= 3;

        if (isFocused) {
          const pulse = 12 + Math.sin(performance.now() * 0.008) * 3.5;
          ctx.save();
          ctx.beginPath();
          ctx.arc(n.x, n.y, pulse, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(245, 158, 11, 0.22)';
          ctx.fill();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2.4;
          ctx.stroke();
          ctx.restore();
        }

        if (showNodes || isHover || isNodeSel || isFocused || isDraftStart || isJunction) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, isFocused || isNodeSel || isHover || isDraftStart || isChainStart ? 6.5 : (isValidNext ? 5.2 : (isJunction ? 4 : 3.4)), 0, Math.PI * 2);
          ctx.fillStyle = isFocused || isNodeSel ? '#f59e0b' : (isDraftStart ? '#10b981' : (isValidNext ? 'rgba(16, 185, 129, 0.85)' : (isHover || isChainStart ? '#0ea5e9' : pal.nodeFill)));
          ctx.fill();
          ctx.strokeStyle = isFocused || isNodeSel ? '#fff' : (isHover ? '#0ea5e9' : (n.isStationEnd ? pal.tactileLine : pal.nodeStroke));
          ctx.lineWidth = isFocused || isNodeSel ? 2.2 : 1.6;
          ctx.stroke();
        }

        if (showNodeIds || isFocused) {
          ctx.save();
          ctx.font = isFocused ? '700 11px -apple-system, sans-serif' : '600 9.5px -apple-system, sans-serif';
          const tw = ctx.measureText(n.id).width + 6;
          const lx = n.x + 8;
          const ly = n.y - 11;
          ctx.fillStyle = isFocused ? '#f59e0b' : pal.hudBg;
          ctx.beginPath();
          ctx.roundRect(lx, ly - 7, tw, 14, 3.5);
          ctx.fill();
          ctx.fillStyle = isFocused ? '#fff' : pal.hudText;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(n.id, lx + 3, ly);
          ctx.restore();
        }

        const nodeKind = this.graph.classifyNode(n.id);
        if (nodeKind === 'switch' && n.isSwitch) {
          ctx.save();
          ctx.translate(n.x, n.y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = n.lockedBy ? '#f43f5e' : '#10b981';
          ctx.strokeStyle = pal.nodeFill;
          ctx.lineWidth = 1.4;
          ctx.fillRect(-4.2, -4.2, 8.4, 8.4);
          ctx.strokeRect(-4.2, -4.2, 8.4, 8.4);
          ctx.restore();
        } else if (nodeKind === 'switch' && !n.isSwitch) {
          ctx.save();
          ctx.translate(n.x, n.y);
          ctx.fillStyle = '#64748b';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(0, 0, 5.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-2.5, -2.5); ctx.lineTo(2.5, 2.5);
          ctx.moveTo(2.5, -2.5); ctx.lineTo(-2.5, 2.5);
          ctx.stroke();
          ctx.restore();
        } else if (this.showBlocks && isJunction) {
          ctx.beginPath();
          ctx.arc(n.x, n.y - 9, 3.2, 0, Math.PI * 2);
          ctx.fillStyle = n.lockedBy ? '#f43f5e' : '#10b981';
          ctx.fill();
        }
      }

      // 7. Render Level Crossings (Overpass bridges are drawn after base trains so underpass trains pass underneath!)
      for (const c of this.graph.crossings.values()) {
        if (c.type === 'overpass' || c.type === 'underpass') continue;
        ctx.save();
        ctx.fillStyle = 'rgba(245, 158, 11, 0.24)';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 7.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(c.x - 4, c.y - 4); ctx.lineTo(c.x + 4, c.y + 4);
        ctx.moveTo(c.x + 4, c.y - 4); ctx.lineTo(c.x - 4, c.y + 4);
        ctx.stroke();
        ctx.restore();
      }
    }

    drawTrainCar(ctx, pal, train, route, sample, c, numCars, carLen, carWidth, isSel) {
      ctx.save();
      ctx.translate(sample.x, sample.y);
      ctx.rotate(sample.angle);
      const rColor = this.getEffectiveRouteColor(route);
      if (isSel) {
        ctx.shadowColor = rColor;
        ctx.shadowBlur = 10;
      }
      ctx.fillStyle = pal.trainBody;
      ctx.strokeStyle = rColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-carLen / 2, -carWidth / 2, carLen, carWidth, c === 0 || c === numCars - 1 ? 4 : 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = rColor;
      ctx.fillRect(-carLen / 2 + 2, -2, carLen - 4, 4);

      if (c === 0) {
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(carLen / 2 - 2.2, -4, 2.2, 2.4);
        ctx.fillRect(carLen / 2 - 2.2, 1.6, 2.2, 2.4);
      }
      if (c === numCars - 1) {
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(-carLen / 2, -4, 2, 2.4);
        ctx.fillRect(-carLen / 2, 1.6, 2, 2.4);
      }
      const isStationTbDwell = train.state === 'TURNBACK' &&
        route.turnbackPoints.some(t => t.isStationTurnback && (t.nodeId + '@' + t.nodeIndex) === train.lastHandledTbKey);
      if (train.state === 'DWELL' || isStationTbDwell) {
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(-carLen * 0.25, -carWidth / 2 - 1.5, carLen * 0.5, 1.8);
        ctx.fillRect(-carLen * 0.25, carWidth / 2 - 0.3, carLen * 0.5, 1.8);
      }
      ctx.restore();
    }

    drawTrains(ctx, pal, filterEdgeIds = null) {
      if (this.routeDraft) return;
      for (const train of this.dispatcher.trains.values()) {
        const route = this.routes.routes.get(train.routeId);
        if (!route || route.segments.length === 0) continue;

        const numCars = Math.max(2, Math.round(train.length / 30));
        const carPitch = train.length / numCars;
        const carLen = carPitch - 3.2;
        const carWidth = 11.5;
        const isSel = train.id === this.selectedTrainId;

        for (let c = 0; c < numCars; c++) {
          const sample = route.sampleAt(train.headS - (c + 0.5) * carPitch);
          if (!sample) continue;
          if (filterEdgeIds && !filterEdgeIds.has(sample.edgeId)) continue;
          this.drawTrainCar(ctx, pal, train, route, sample, c, numCars, carLen, carWidth, isSel);
        }
      }
    }

    drawOverpassesAndUpperTrains(ctx, pal) {
      const soloRouteId = (this.inspectedRouteId && (this.mode === 'route' || this.mode === 'simulate') && this.routes.routes.has(this.inspectedRouteId)) ? this.inspectedRouteId : null;
      const coMapForBridge = ((this.showRoutes || soloRouteId) && !this.routeDraft) ? (this._frameCoMap || this.routes.getEdgeCoRunningMap()) : new Map();
      const overEdgeIds = new Set();

      // 1. Draw overpass bridge decks & upper tracks/routes OVER underpass train cars
      const drawnBendBridges = new Set();
      const collectDedupRoutes = (edgeIdsList) => {
        const res = [];
        const seenColors = new Set();
        for (const eid of edgeIdsList) {
          const raw = (coMapForBridge.get(eid) || []).filter(rt => !soloRouteId || rt.id === soloRouteId);
          for (const rt of raw) {
            const ck = (soloRouteId ? rt.color : this.getEffectiveRouteColor(rt)).toLowerCase();
            if (!seenColors.has(ck)) { seenColors.add(ck); res.push(rt); }
          }
        }
        return res;
      };

      for (const c of this.graph.crossings.values()) {
        if (c.type !== 'overpass' && c.type !== 'underpass') continue;
        const overEdge = this.graph.edges.get(c.overEdgeId || c.edgeA);
        if (!overEdge) continue;
        overEdgeIds.add(overEdge.id);

        // Special handling for bend-node-on-edge crossings:
        // - If carrier (straight) edge is ON TOP: draw once (skip duplicate pair entry)
        // - If bent track (2 edges meeting at bendNode) is ON TOP: draw ONE smooth curved viaduct bridge (no protruding X stubs!)
        if (c.bendNodeId) {
          const bn = this.graph.getNode(c.bendNodeId);
          const isOverAttachedToBend = (overEdge.from === c.bendNodeId || overEdge.to === c.bendNodeId);
          if (bn && isOverAttachedToBend) {
            const bendKey = 'BEND_OVER|' + bn.id;
            if (drawnBendBridges.has(bendKey)) continue;
            drawnBendBridges.add(bendKey);
            const inc = this.graph.getIncidentEdges(bn.id);
            if (inc.length === 2) {
              const [e1, e2] = inc;
              overEdgeIds.add(e1.id);
              overEdgeIds.add(e2.id);
              const n1 = this.graph.getNode(e1.from === bn.id ? e1.to : e1.from);
              const n2 = this.graph.getNode(e2.from === bn.id ? e2.to : e2.from);
              if (n1 && n2) {
                const l1 = dist(bn.x, bn.y, n1.x, n1.y) || 1;
                const l2 = dist(bn.x, bn.y, n2.x, n2.y) || 1;
                const u1x = (n1.x - bn.x) / l1, u1y = (n1.y - bn.y) / l1;
                const u2x = (n2.x - bn.x) / l2, u2y = (n2.y - bn.y) / l2;
                // Consistent left normals along P1 -> bn -> P2
                const n1x = u1y, n1y = -u1x;
                const n2x = -u2y, n2y = u2x;
                const bx = n1x + n2x, by = n1y + n2y;
                const miterDenom = Math.max(0.4, n1x * bx + n1y * by);

                const routesOnOver = collectDedupRoutes([e1.id, e2.id]);
                const bridgeHalfW = Math.max(11, routesOnOver.length * 5.2 + 7);
                const s1 = Math.min(18, l1 * 0.65);
                const s2 = Math.min(18, l2 * 0.65);
                const f1 = Math.min(FILLET_DIST, s1 * 0.78, l1 * 0.34);
                const f2 = Math.min(FILLET_DIST, s2 * 0.78, l2 * 0.34);

                const traceBent = (off, extra = 0) => {
                  const ext1 = Math.min(l1 * 0.85, s1 + extra);
                  const ext2 = Math.min(l2 * 0.85, s2 + extra);
                  const p1x = bn.x + u1x * ext1 + n1x * off, p1y = bn.y + u1y * ext1 + n1y * off;
                  const q1x = bn.x + u1x * f1 + n1x * off, q1y = bn.y + u1y * f1 + n1y * off;
                  const mx = bn.x + bx * (off / miterDenom), my = bn.y + by * (off / miterDenom);
                  const q2x = bn.x + u2x * f2 + n2x * off, q2y = bn.y + u2y * f2 + n2y * off;
                  const p2x = bn.x + u2x * ext2 + n2x * off, p2y = bn.y + u2y * ext2 + n2y * off;
                  ctx.beginPath();
                  ctx.moveTo(p1x, p1y);
                  ctx.lineTo(q1x, q1y);
                  ctx.quadraticCurveTo(mx, my, q2x, q2y);
                  ctx.lineTo(p2x, p2y);
                };

                ctx.save();
                ctx.lineJoin = 'round';
                // Mask underpass cleanly along the curved bridge deck
                ctx.strokeStyle = pal.canvasBg;
                ctx.lineWidth = bridgeHalfW + 4;
                ctx.lineCap = 'butt';
                traceBent(0, 0);
                ctx.stroke();

                // Curved bridge guardrails on both sides
                ctx.strokeStyle = pal.platformStroke;
                ctx.lineWidth = 1.2;
                traceBent(-bridgeHalfW / 2, 0); ctx.stroke();
                traceBent(bridgeHalfW / 2, 0); ctx.stroke();

                // Continuous upper track bed + rail + route lines
                ctx.lineCap = 'round';
                ctx.strokeStyle = pal.trackBed;
                ctx.lineWidth = 9;
                traceBent(0, 2); ctx.stroke();

                ctx.strokeStyle = pal.trackRail;
                ctx.lineWidth = 3;
                traceBent(0, 2); ctx.stroke();

                routesOnOver.forEach((rt, idx) => {
                  const offset = (!soloRouteId && routesOnOver.length > 1) ? (idx - (routesOnOver.length - 1) / 2) * 5.2 : 0;
                  ctx.strokeStyle = soloRouteId ? rt.color : this.getEffectiveRouteColor(rt);
                  ctx.lineWidth = soloRouteId ? 4.2 : 3.0;
                  traceBent(offset, 2);
                  ctx.stroke();
                });
                ctx.restore();
                continue;
              }
            }
          } else if (bn && !isOverAttachedToBend) {
            const straightKey = 'CARRIER_OVER|' + bn.id + '|' + overEdge.id;
            if (drawnBendBridges.has(straightKey)) continue;
            drawnBendBridges.add(straightKey);
          }
        }

        const a = this.graph.getNode(overEdge.from);
        const b = this.graph.getNode(overEdge.to);
        if (!a || !b) continue;

        ctx.save();
        let dx = b.x - a.x, dy = b.y - a.y;
        if (dx < -1e-3 || (Math.abs(dx) <= 1e-3 && dy < 0)) { dx = -dx; dy = -dy; }
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const nx = -uy, ny = ux;
        const routesOnOver = collectDedupRoutes([overEdge.id]);
        const bridgeHalfW = Math.max(11, routesOnOver.length * 5.2 + 7);
        const span = 15;

        // Mask underpass track & underpass train cars cleanly with canvas background
        ctx.strokeStyle = pal.canvasBg;
        ctx.lineWidth = bridgeHalfW + 4;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(c.x - ux * span, c.y - uy * span);
        ctx.lineTo(c.x + ux * span, c.y + uy * span);
        ctx.stroke();

        // Bridge deck guardrails along both sides of upper track
        ctx.strokeStyle = pal.platformStroke;
        ctx.lineWidth = 1.2;
        for (const side of [-1, 1]) {
          const off = side * (bridgeHalfW / 2);
          ctx.beginPath();
          ctx.moveTo(c.x - ux * span + nx * off, c.y - uy * span + ny * off);
          ctx.lineTo(c.x + ux * span + nx * off, c.y + uy * span + ny * off);
          ctx.stroke();
        }

        // Re-draw upper track bed + rails + actual co-running route lines cleanly on top
        ctx.lineCap = 'round';
        ctx.strokeStyle = pal.trackBed;
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(c.x - ux * (span + 2), c.y - uy * (span + 2));
        ctx.lineTo(c.x + ux * (span + 2), c.y + uy * (span + 2));
        ctx.stroke();

        ctx.strokeStyle = pal.trackRail;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(c.x - ux * (span + 2), c.y - uy * (span + 2));
        ctx.lineTo(c.x + ux * (span + 2), c.y + uy * (span + 2));
        ctx.stroke();

        routesOnOver.forEach((rt, idx) => {
          if (soloRouteId && rt.id !== soloRouteId) return;
          const offset = (!soloRouteId && routesOnOver.length > 1) ? (idx - (routesOnOver.length - 1) / 2) * 5.2 : 0;
          ctx.strokeStyle = soloRouteId ? rt.color : this.getEffectiveRouteColor(rt);
          ctx.lineWidth = soloRouteId ? 4.2 : 3.0;
          ctx.beginPath();
          ctx.moveTo(c.x - ux * (span + 2) + nx * offset, c.y - uy * (span + 2) + ny * offset);
          ctx.lineTo(c.x + ux * (span + 2) + nx * offset, c.y + uy * (span + 2) + ny * offset);
          ctx.stroke();
        });
        ctx.restore();
      }

      // 2. Draw train cars running on upper bridge edges ON TOP of the bridge decks
      if (overEdgeIds.size > 0) {
        this.drawTrains(ctx, pal, overEdgeIds);
      }

      // 3. Draw train status badges on top for readability
      if (this.routeDraft) return;
      for (const train of this.dispatcher.trains.values()) {
        if (train.state !== 'TURNBACK' && train.state !== 'WAITING') continue;
        const route = this.routes.routes.get(train.routeId);
        if (!route || route.segments.length === 0) continue;
        const mid = route.sampleAt(train.headS - train.length / 2);
        if (!mid) continue;
        ctx.save();
        ctx.translate(mid.x, mid.y - 16);
        const isTb = train.state === 'TURNBACK';
        const text = isTb ? `换端 ${train.stateTimer.toFixed(1)}s` : '闭塞等待';
        ctx.font = '700 10px -apple-system, sans-serif';
        const tw = ctx.measureText(text).width + 12;
        ctx.fillStyle = isTb ? 'rgba(245, 158, 11, 0.94)' : 'rgba(244, 63, 94, 0.94)';
        ctx.beginPath();
        ctx.roundRect(-tw / 2, -9, tw, 18, 5);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 0, 0.5);
        ctx.restore();
      }

    }

    drawToolPreview(ctx, pal) {
      if (this.activeInlinePrompt) {
        const { x, y, title } = this.activeInlinePrompt;
        const pulse = 15 + Math.sin(performance.now() * 0.009) * 4.5;
        ctx.save();
        // Outer pulsing amber halo
        ctx.beginPath();
        ctx.arc(x, y, pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.22)';
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.6;
        ctx.stroke();

        // Crisp crosshair & center beacon
        ctx.beginPath();
        ctx.moveTo(x - pulse - 6, y); ctx.lineTo(x - 6, y);
        ctx.moveTo(x + 6, y); ctx.lineTo(x + pulse + 6, y);
        ctx.moveTo(x, y - pulse - 6); ctx.lineTo(x, y - 6);
        ctx.moveTo(x, y + 6); ctx.lineTo(x, y + pulse + 6);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        if (title) {
          ctx.font = '700 11px -apple-system, sans-serif';
          const tw = ctx.measureText(title).width + 12;
          ctx.fillStyle = 'rgba(217, 119, 6, 0.94)';
          ctx.beginPath();
          ctx.roundRect(x - tw / 2, y - pulse - 24, tw, 18, 5);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(title, x, y - pulse - 15);
        }
        ctx.restore();
      }
      if (this.pendingTrackSnap) {
        const { platformId, side, targetLength } = this.pendingTrackSnap;
        const p = this.platforms.getPlatform(platformId);
        // Highlight all edges with matching length
        ctx.save();
        ctx.lineCap = 'round';
        for (const e of this.graph.edges.values()) {
          if (!this.platforms.isEdgeEligibleForSnap(p, e)) continue;
          const a = this.graph.getNode(e.from);
          const b = this.graph.getNode(e.to);
          if (!a || !b) continue;
          const isHov = this.hoveredCandidateEdge && this.hoveredCandidateEdge.id === e.id;
          ctx.strokeStyle = isHov ? '#f59e0b' : 'rgba(56, 189, 248, 0.72)';
          ctx.lineWidth = isHov ? 12 : 9;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        // Ghost preview of platform sliding beside hovered matching edge (red if overlaps another platform)
        if (p && this.hoveredCandidateEdge) {
          const pose = this.platforms.computeSnapToEdgePose(p, side, this.hoveredCandidateEdge, this.mouseWorld);
          if (pose) {
            ctx.translate(pose.cx, pose.cy);
            ctx.rotate(pose.rad);
            ctx.fillStyle = pose.overlap ? 'rgba(244, 63, 94, 0.28)' : 'rgba(245, 158, 11, 0.25)';
            ctx.strokeStyle = pose.overlap ? '#f43f5e' : '#f59e0b';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.roundRect(-p.length / 2, -PLATFORM_WIDTH / 2, p.length, PLATFORM_WIDTH, 4);
            ctx.fill();
            ctx.stroke();
          }
        }
        ctx.restore();
        return;
      }
      if (this.mode === 'platform' && !this.activeSnapPopover && !this.hoveredSnapPoint) {
        const cx = snapToGrid(this.mouseWorld.x);
        const cy = snapToGrid(this.mouseWorld.y);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((this.platformConfig.angleDeg * Math.PI) / 180);
        ctx.fillStyle = 'rgba(14, 165, 233, 0.16)';
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.roundRect(-this.platformConfig.length / 2, -PLATFORM_WIDTH / 2, this.platformConfig.length, PLATFORM_WIDTH, 4);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (this.pendingPlacement && this.pendingPlacement.plan) {
        const plan = this.pendingPlacement.plan;
        ctx.save();
        // Outer casing so the pending new line stands out cleanly over existing tracks
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 8;
        for (const seg of plan.newSegs) {
          ctx.beginPath();
          ctx.moveTo(seg.ax, seg.ay);
          ctx.lineTo(seg.bx, seg.by);
          ctx.stroke();
        }
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 5]);
        for (const seg of plan.newSegs) {
          ctx.beginPath();
          ctx.moveTo(seg.ax, seg.ay);
          ctx.lineTo(seg.bx, seg.by);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        for (const seg of plan.newSegs) {
          for (const pt of [{ x: seg.ax, y: seg.ay }, { x: seg.bx, y: seg.by }]) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#0ea5e9';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
        ctx.restore();
      } else if (this.mode === 'track' && this.trackChainStartNode) {
        const start = this.trackChainStartNode;
        const endX = snapToGrid(this.mouseWorld.x);
        const endY = snapToGrid(this.mouseWorld.y);
        const pts = buildOctilinearPoints(start.x, start.y, endX, endY, this.trackDrawStyle, this.trackFlipL);
        let hitSwitch = null;
        let totalLen = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          totalLen += dist(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
          const sw = this.graph.wouldIntersectSwitch(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
          if (sw) hitSwitch = sw;
        }
        ctx.save();
        ctx.strokeStyle = hitSwitch ? '#f43f5e' : '#0ea5e9';
        ctx.lineWidth = 3.2;
        ctx.setLineDash([7, 5]);
        ctx.beginPath();
        pts.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        // Preview corner nodes on grid
        for (const p of pts) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = hitSwitch ? '#f43f5e' : '#38bdf8';
          ctx.fill();
        }

        const label = hitSwitch
          ? `不可与道岔 ${hitSwitch.id} 相交`
          : `${this.trackDrawStyle === 's-bend' ? 'S形' : 'L形135°'} · ${Math.round(totalLen)}m`;
        const midPt = pts[Math.floor(pts.length / 2)];
        ctx.font = '600 11px -apple-system, sans-serif';
        const tw = ctx.measureText(label).width + 12;
        ctx.fillStyle = hitSwitch ? 'rgba(244, 63, 94, 0.92)' : pal.hudBg;
        ctx.beginPath();
        ctx.roundRect(midPt.x - tw / 2, midPt.y - 26, tw, 20, 5);
        ctx.fill();
        ctx.fillStyle = hitSwitch ? '#fff' : pal.hudText;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, midPt.x, midPt.y - 16);
        ctx.restore();
      } else if (this.mode === 'track' && !this.trackChainStartNode && !this.pendingPlacement) {
        const gx = snapToGrid(this.mouseWorld.x);
        const gy = snapToGrid(this.mouseWorld.y);
        const hitNode = this.graph.findNodeAt(gx, gy, 6);
        const blockedSwitch = !!(hitNode && this.graph.classifyNode(hitNode.id) === 'switch');
        const col = blockedSwitch ? '#f43f5e' : '#0ea5e9';
        ctx.save();
        // Subtle crosshair + snapped grid locator dot
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.4;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.moveTo(gx - 10, gy); ctx.lineTo(gx - 5, gy);
        ctx.moveTo(gx + 5, gy); ctx.lineTo(gx + 10, gy);
        ctx.moveTo(gx, gy - 10); ctx.lineTo(gx, gy - 5);
        ctx.moveTo(gx, gy + 5); ctx.lineTo(gx, gy + 10);
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(gx, gy, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
      }
    }

    render() {
      const ctx = this.ctx;
      const pal = this.getPalette();
      ctx.save();
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.fillStyle = pal.canvasBg;
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.translate(this.cam.x, this.cam.y);
      ctx.scale(this.cam.zoom, this.cam.zoom);

      this._frameCoMap = (this.showRoutes || this.inspectedRouteId) && !this.routeDraft ? this.routes.getEdgeCoRunningMap() : null;
      this.drawGrid(ctx, pal);
      this.drawPlatforms(ctx, pal, -1);
      this.drawPlatforms(ctx, pal, 0);
      this.drawTracks(ctx, pal);
      this.drawTrains(ctx, pal);
      this.drawOverpassesAndUpperTrains(ctx, pal);
      this.drawPlatforms(ctx, pal, 1);
      this.drawSelectedOverlay(ctx, pal);
      this.drawToolPreview(ctx, pal);
      ctx.restore();
    }

    loop(now) {
      const dt = (now - this.lastFrameTime) / 1000;
      this.lastFrameTime = now;
      this.dispatcher.step(dt);
      this.render();
      this.updateLivePanelStats();
      requestAnimationFrame(t => this.loop(t));
    }

    // Prompt strictly Overpass / Underpass (NEVER level crossing!) whenever a platform overlaps a track or another platform
    promptPlatformOverlap(p, beforeSnap, cancelLabel = '取消', onDone = null) {
      if (!p) { if (onDone) onDone(); return; }
      const ov = this.platforms.findPlatformOverlaps(p);
      if (ov.platforms.length === 0 && ov.edges.length === 0) {
        if (onDone) onDone();
        return;
      }
      const targetDesc = ov.platforms.length > 0 && ov.edges.length > 0
        ? '轨道与其他站台'
        : (ov.platforms.length > 0 ? `站台「${ov.platforms[0].name}」` : '既有轨道');
      this.showInlinePromptAt(p.cx, p.cy, `站台与${targetDesc}穿插`, '仅支持立体上下穿', [
        {
          label: '站台上跨（高架层）',
          cls: 'btn-primary',
          onClick: () => {
            p.zLayer = 1;
            this.hideInlinePrompt();
            this.showToast(`「${p.name}」已设为上跨高架层`);
            if (onDone) onDone();
          }
        },
        {
          label: '站台下穿（地下层）',
          onClick: () => {
            p.zLayer = -1;
            this.hideInlinePrompt();
            this.showToast(`「${p.name}」已设为下穿地下层`);
            if (onDone) onDone();
          }
        },
        {
          label: cancelLabel,
          cls: 'btn-danger',
          onClick: () => {
            this.hideInlinePrompt();
            if (beforeSnap) {
              if (this.undoStack.length > 0) this.undoStack.pop();
              this.restoreSnapshot(beforeSnap, false);
              this.updateHistoryButtons();
              this.refreshDiagnostics();
            }
          }
        }
      ]);
    }

    hideInlinePrompt() {
      this.activeInlinePrompt = null;
      this.pendingPlacement = null;
      const box = document.getElementById('sideChoicePrompt');
      if (box) box.classList.remove('visible');
    }

    showInlinePromptAt(wx, wy, title, stepText, options) {
      this.activeInlinePrompt = { x: wx, y: wy, title };
      const sidebar = document.getElementById('sidebar');
      if (sidebar && sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('collapsed');
        setTimeout(() => this.resizeCanvas(), 210);
      }
      const box = document.getElementById('sideChoicePrompt');
      document.getElementById('sidePromptTitle').textContent = title;
      const stepEl = document.getElementById('sidePromptStep');
      stepEl.textContent = stepText || '';
      stepEl.style.display = stepText ? '' : 'none';
      const optsEl = document.getElementById('sidePromptOpts');
      optsEl.innerHTML = options.map((o, idx) =>
        `<button class="btn btn-xs ${o.cls || ''}" data-inline-opt="${idx}" ${o.title ? `title="${o.title}"` : ''} style="justify-content:center;">${o.label}</button>`
      ).join('');
      optsEl.querySelectorAll('[data-inline-opt]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const opt = options[Number(btn.dataset.inlineOpt)];
          if (opt && opt.onClick) opt.onClick();
        });
      });
      const focusBtn = document.getElementById('sidePromptFocusBtn');
      if (focusBtn) {
        focusBtn.onclick = () => {
          this.cam.x = this.width / 2 - wx * this.cam.zoom;
          this.cam.y = this.height / 2 - wy * this.cam.zoom;
        };
      }
      // Gently pan into view if the highlighted point is outside the visible canvas viewport
      const sx = wx * this.cam.zoom + this.cam.x;
      const sy = wy * this.cam.zoom + this.cam.y;
      if (sx < 40 || sx > this.width - 40 || sy < 40 || sy > this.height - 40) {
        this.cam.x = this.width / 2 - wx * this.cam.zoom;
        this.cam.y = this.height / 2 - wy * this.cam.zoom;
      }
      box.classList.add('visible');
    }

    advancePendingPlacement() {
      const p = this.pendingPlacement;
      if (!p) return;
      const totalSteps = p.hits.length + p.switchCandidates.length;
      if (p.stepIndex < p.hits.length) {
        const h = p.hits[p.stepIndex];
        this.showInlinePromptAt(h.x, h.y, '轨道交叉', `${p.stepIndex + 1}/${totalSteps}`, [
          { label: '平面相交', cls: 'btn-primary', title: '共用闭塞区段', onClick: () => { p.crossingChoices.push('level'); p.stepIndex++; this.advancePendingPlacement(); } },
          { label: '新线上跨', title: '立体交叉，新线位于上方', onClick: () => { p.crossingChoices.push('overpass'); p.stepIndex++; this.advancePendingPlacement(); } },
          { label: '新线下跨', title: '立体交叉，新线位于下方', onClick: () => { p.crossingChoices.push('underpass'); p.stepIndex++; this.advancePendingPlacement(); } },
          { label: '取消', cls: 'btn-danger', onClick: () => { this.hideInlinePrompt(); this.trackChainStartNode = null; this.renderSubbar(); } }
        ]);
      } else if (p.stepIndex < totalSteps) {
        const swIdx = p.stepIndex - p.hits.length;
        const n = p.switchCandidates[swIdx];
        this.showInlinePromptAt(n.x, n.y, n.id ? `节点 ${n.id}` : '道岔设置', `${p.stepIndex + 1}/${totalSteps}`, [
          { label: '开启道岔', cls: 'btn-primary', title: '允许列车经此分岔运行', onClick: () => { p.switchChoices.push({ x: n.x, y: n.y, isSwitch: true }); p.stepIndex++; this.advancePendingPlacement(); } },
          { label: '关闭道岔', title: '作为断头路，仅允许直行或折返', onClick: () => { p.switchChoices.push({ x: n.x, y: n.y, isSwitch: false }); p.stepIndex++; this.advancePendingPlacement(); } },
          { label: '取消', cls: 'btn-danger', onClick: () => { this.hideInlinePrompt(); this.trackChainStartNode = null; this.renderSubbar(); } }
        ]);
      } else {
        const finalP = p;
        this.hideInlinePrompt();
        this.commitOctilinearTrack(finalP.plan, finalP.crossingChoices, finalP.switchChoices);
      }
    }

    cleanupAndRenumberGraph() {
      // 1. Delete all collinear intermediate (180°, degree 2) non-station nodes and merge their two edges
      let changed = true;
      while (changed) {
        changed = false;
        for (const n of Array.from(this.graph.nodes.values())) {
          if (n.isStationEnd || n.platformId) continue;
          const inc = this.graph.getIncidentEdges(n.id);
          if (inc.length !== 2) continue;
          const [e1, e2] = inc;
          if (e1.isStationTrack || e2.isStationTrack) continue;
          const aId = e1.from === n.id ? e1.to : e1.from;
          const bId = e2.from === n.id ? e2.to : e2.from;
          if (aId === bId || this.graph.getEdgeBetween(aId, bId)) continue;
          const a = this.graph.getNode(aId), b = this.graph.getNode(bId);
          if (!a || !b) continue;
          const d1 = dist(n.x, n.y, a.x, a.y), d2 = dist(n.x, n.y, b.x, b.y);
          if (d1 < 1e-4 || d2 < 1e-4) continue;
          const dot = ((a.x - n.x) * (b.x - n.x) + (a.y - n.y) * (b.y - n.y)) / (d1 * d2);
          if (dot > -0.9985) continue; // has a real bend corner (<177°), keep!

          // Preserve if any route explicitly reverses (physical turnback) at this exact node
          let isRouteTurnback = false;
          for (const r of this.routes.routes.values()) {
            const m = r.nodeIds.length;
            for (let i = 0; i < m; i++) {
              if (r.nodeIds[i] === n.id && r.nodeIds[(i - 1 + m) % m] === r.nodeIds[(i + 1) % m]) {
                isRouteTurnback = true;
                break;
              }
            }
            if (isRouteTurnback) break;
          }
          if (isRouteTurnback) continue;

          // Merge e1 + e2 -> eNew(aId, bId)
          const eNew = this.graph.addEdge(aId, bId);
          for (const c of this.graph.crossings.values()) {
            if (c.edgeA === e1.id || c.edgeA === e2.id) c.edgeA = eNew.id;
            if (c.edgeB === e1.id || c.edgeB === e2.id) c.edgeB = eNew.id;
            if (c.overEdgeId === e1.id || c.overEdgeId === e2.id) c.overEdgeId = eNew.id;
            if (c.underEdgeId === e1.id || c.underEdgeId === e2.id) c.underEdgeId = eNew.id;
          }
          const stripFromRoute = (ids) => ids.filter(nid => nid !== n.id);
          for (const r of this.routes.routes.values()) {
            if (r.nodeIds.includes(n.id)) r.nodeIds = stripFromRoute(r.nodeIds);
          }
          if (this.routeDraft && this.routeDraft.nodeIds.includes(n.id)) {
            this.routeDraft.nodeIds = stripFromRoute(this.routeDraft.nodeIds);
          }
          this.graph.edges.delete(e1.id);
          this.graph.edges.delete(e2.id);
          this.graph.nodes.delete(n.id);
          if (this.selectedEntity && this.selectedEntity.type === 'node' && this.selectedEntity.id === n.id) {
            this.selectedEntity = null;
          }
          changed = true;
          break;
        }
      }

      // 2. Renumber all remaining nodes cleanly as N1..Nk
      const sortedNodes = Array.from(this.graph.nodes.values()).sort((a, b) => {
        const na = parseInt(String(a.id).replace(/\D/g, ''), 10) || 0;
        const nb = parseInt(String(b.id).replace(/\D/g, ''), 10) || 0;
        return na - nb;
      });
      const idMap = new Map();
      const newNodesMap = new Map();
      sortedNodes.forEach((n, idx) => {
        const newId = 'N' + (idx + 1);
        idMap.set(n.id, newId);
        n.id = newId;
        newNodesMap.set(newId, n);
      });
      this.graph.nodes = newNodesMap;
      this.graph.nextNodeId = sortedNodes.length + 1;

      for (const e of this.graph.edges.values()) {
        if (idMap.has(e.from)) e.from = idMap.get(e.from);
        if (idMap.has(e.to)) e.to = idMap.get(e.to);
      }
      for (const cr of this.graph.crossings.values()) {
        if (cr.bendNodeId && idMap.has(cr.bendNodeId)) cr.bendNodeId = idMap.get(cr.bendNodeId);
      }
      for (const r of this.routes.routes.values()) {
        r.nodeIds = r.nodeIds.map(nid => idMap.get(nid) || nid);
      }
      if (this.routeDraft) {
        this.routeDraft.nodeIds = this.routeDraft.nodeIds.map(nid => nid === '__GAP__' ? '__GAP__' : (idMap.get(nid) || nid));
      }
      if (this.selectedEntity && this.selectedEntity.type === 'node' && idMap.has(this.selectedEntity.id)) {
        this.selectedEntity.id = idMap.get(this.selectedEntity.id);
      }
      if (this.focusedNodeId && idMap.has(this.focusedNodeId)) this.focusedNodeId = idMap.get(this.focusedNodeId);
      if (this.hoveredNodeId && idMap.has(this.hoveredNodeId)) this.hoveredNodeId = idMap.get(this.hoveredNodeId);
      if (this.trackChainStartNode && this.trackChainStartNode.id && idMap.has(this.trackChainStartNode.id)) {
        this.trackChainStartNode = this.graph.getNode(idMap.get(this.trackChainStartNode.id)) || null;
      }
    }

    reconnectMovedNodesOctilinear(movedNodeIds, incidentRecords) {
      const lockedIds = new Set(movedNodeIds);
      const isRouteTurnbackNode = (nid) => {
        for (const r of this.routes.routes.values()) {
          const m = r.nodeIds.length;
          for (let i = 0; i < m; i++) {
            if (r.nodeIds[i] === nid && r.nodeIds[(i - 1 + m) % m] === r.nodeIds[(i + 1) % m]) return true;
          }
        }
        return false;
      };
      const lineIntersect = (p1, d1, p2, d2) => {
        const det = d1.x * d2.y - d1.y * d2.x;
        if (Math.abs(det) < 0.15) return null;
        const rx = p2.x - p1.x, ry = p2.y - p1.y;
        const t = (rx * d2.y - ry * d2.x) / det;
        return { x: p1.x + d1.x * t, y: p1.y + d1.y * t, t };
      };
      const isOctilinearPair = (ax, ay, bx, by) => {
        const dx = Math.abs(bx - ax), dy = Math.abs(by - ay);
        return dx < 1.5 || dy < 1.5 || Math.abs(dx - dy) < 1.5;
      };
      const normDir = (ax, ay, bx, by) => {
        const len = dist(ax, ay, bx, by);
        if (len < 1e-4) return null;
        return { x: (bx - ax) / len, y: (by - ay) / len };
      };

      for (const inc of incidentRecords) {
        const dragNode = this.graph.getNode(inc.movedId);
        const other = this.graph.getNode(inc.otherId);
        const origEdge = this.graph.getEdgeBetween(inc.movedId, inc.otherId);
        if (!dragNode || !other || !origEdge || origEdge.isStationTrack) continue;

        // Already 0° / 45° / 90° straight -> keep single edge with zero extra bend nodes!
        if (isOctilinearPair(dragNode.x, dragNode.y, other.x, other.y)) {
          origEdge.bendStyle = 'l-bend';
          continue;
        }

        // Try sliding `other` cleanly if it is a 3-way switch on a straight through-track OR a degree-2 bend corner
        let slidOther = false;
        if (!lockedIds.has(other.id) && !other.isStationEnd && !other.isImplicit && inc.origDirFromDrag) {
          const otherInc = this.graph.getIncidentEdges(other.id).filter(e => e.id !== origEdge.id);
          // Subcase A: 3-way switch on a straight through-track U — other — V (directly move switch position, no prompt!)
          if (otherInc.length === 2 && !otherInc[0].isStationTrack && !otherInc[1].isStationTrack) {
            const uId = otherInc[0].from === other.id ? otherInc[0].to : otherInc[0].from;
            const vId = otherInc[1].from === other.id ? otherInc[1].to : otherInc[1].from;
            const uNode = this.graph.getNode(uId);
            const vNode = this.graph.getNode(vId);
            if (uNode && vNode) {
              const dU = normDir(other.x, other.y, uNode.x, uNode.y);
              const dV = normDir(other.x, other.y, vNode.x, vNode.y);
              if (dU && dV && (dU.x * dV.x + dU.y * dV.y) < -0.985) {
                const segUV = { x: vNode.x - uNode.x, y: vNode.y - uNode.y };
                const lenUV = Math.hypot(segUV.x, segUV.y);
                const dirUV = { x: segUV.x / lenUV, y: segUV.y / lenUV };
                const hit = lineIntersect(uNode, dirUV, dragNode, inc.origDirFromDrag);
                if (hit && hit.t > 12 && hit.t < lenUV - 12 && dist(dragNode.x, dragNode.y, hit.x, hit.y) > 12 && !this.graph.findBridgeNear(hit.x, hit.y, 20)) {
                  this.graph.updateNodePosition(other.id, hit.x, hit.y);
                  lockedIds.add(other.id);
                  origEdge.bendStyle = 'l-bend';
                  slidOther = true;
                }
              }
            }
          }
          // Subcase B: degree-2 bend corner U — other — dragNode
          // Treat U -> other -> dragNode as ONE single 135° L-bend and reposition `other` directly (NEVER spawn a 3rd segment!)
          if (!slidOther && otherInc.length === 1 && !otherInc[0].isStationTrack && !isRouteTurnbackNode(other.id)) {
            const uId = otherInc[0].from === other.id ? otherInc[0].to : otherInc[0].from;
            const uNode = this.graph.getNode(uId);
            if (uNode && uId !== dragNode.id) {
              const origDirFromU = normDir(uNode.x, uNode.y, other.x, other.y);
              if (isOctilinearPair(uNode.x, uNode.y, dragNode.x, dragNode.y) && dist(uNode.x, uNode.y, dragNode.x, dragNode.y) > 4) {
                // U and dragNode are now directly 0°/45°/90° collinear -> place `other` on the straight segment (merged on mouseup)
                this.graph.updateNodePosition(other.id, (uNode.x + dragNode.x) / 2, (uNode.y + dragNode.y) / 2);
                lockedIds.add(other.id);
                origEdge.bendStyle = 'l-bend';
                otherInc[0].bendStyle = 'l-bend';
                slidOther = true;
              } else {
                const uPeerDirs = this.graph.getIncidentEdges(uNode.id)
                  .filter(e => e.id !== otherInc[0].id)
                  .map(e => {
                    const pid = e.from === uNode.id ? e.to : e.from;
                    const pn = this.graph.getNode(pid);
                    return pn ? normDir(uNode.x, uNode.y, pn.x, pn.y) : null;
                  }).filter(Boolean);
                const dPeerDirs = this.graph.getIncidentEdges(dragNode.id)
                  .filter(e => e.id !== origEdge.id)
                  .map(e => {
                    const pid = e.from === dragNode.id ? e.to : e.from;
                    const pn = this.graph.getNode(pid);
                    return pn ? normDir(dragNode.x, dragNode.y, pn.x, pn.y) : null;
                  }).filter(Boolean);
                const pen = (dir, peers) => {
                  let s = 0;
                  for (const pd of peers) {
                    const dot = dir.x * pd.x + dir.y * pd.y;
                    const ang = Math.acos(clamp(dot, -1, 1)) * 180 / Math.PI;
                    if (dot > 0.985) s -= 2000;
                    else if (ang > 75 && ang < 105) s -= 1000;
                    else if (ang < 35) s -= 1000;
                  }
                  return s;
                };
                const scoreL = (pts, fl) => {
                  if (pts.length !== 3) return -1e9;
                  const dU = normDir(pts[0].x, pts[0].y, pts[1].x, pts[1].y);
                  const dD = normDir(pts[2].x, pts[2].y, pts[1].x, pts[1].y);
                  let s = 0;
                  if (dU) {
                    s += pen(dU, uPeerDirs);
                    if (origDirFromU) s += (dU.x * origDirFromU.x + dU.y * origDirFromU.y) * 120;
                  }
                  if (dD) {
                    s += pen(dD, dPeerDirs);
                    if (inc.origDirFromDrag) s += (dD.x * inc.origDirFromDrag.x + dD.y * inc.origDirFromDrag.y) * 80;
                  }
                  if (fl === !!inc.flipL) s += 10;
                  return s;
                };
                const lF = buildOctilinearPoints(uNode.x, uNode.y, dragNode.x, dragNode.y, 'l-bend', false);
                const lT = buildOctilinearPoints(uNode.x, uNode.y, dragNode.x, dragNode.y, 'l-bend', true);
                const winL = scoreL(lT, true) > scoreL(lF, false) ? lT : lF;
                if (winL.length === 3) {
                  this.graph.updateNodePosition(other.id, winL[1].x, winL[1].y);
                  lockedIds.add(other.id);
                  origEdge.bendStyle = 'l-bend';
                  otherInc[0].bendStyle = 'l-bend';
                  slidOther = true;
                }
              }
            }
          }
        }
        if (slidOther) continue;

        // Fallback: strictly 135° L-bend (never legacy s-bend!), picking flipL that preserves original tangents & avoids <135° / overlaps
        const otherPeerDirs = this.graph.getIncidentEdges(other.id)
          .filter(e => e.id !== origEdge.id)
          .map(e => {
            const pid = e.from === other.id ? e.to : e.from;
            const pn = this.graph.getNode(pid);
            return pn ? normDir(other.x, other.y, pn.x, pn.y) : null;
          }).filter(Boolean);
        const dragPeerDirs = this.graph.getIncidentEdges(dragNode.id)
          .filter(e => e.id !== origEdge.id)
          .map(e => {
            const pid = e.from === dragNode.id ? e.to : e.from;
            const pn = this.graph.getNode(pid);
            return pn ? normDir(dragNode.x, dragNode.y, pn.x, pn.y) : null;
          }).filter(Boolean);

        const scoreCand = (pts, flipFlag) => {
          if (pts.length < 2) return -1e9;
          const dDrag = normDir(pts[0].x, pts[0].y, pts[1].x, pts[1].y);
          const dOther = normDir(pts[pts.length - 1].x, pts[pts.length - 1].y, pts[pts.length - 2].x, pts[pts.length - 2].y);
          let sc = 0;
          const peerPenalty = (dir, peers) => {
            let pen = 0;
            for (const pd of peers) {
              const dot = dir.x * pd.x + dir.y * pd.y;
              const ang = Math.acos(clamp(dot, -1, 1)) * 180 / Math.PI;
              if (dot > 0.985) pen -= 2000;            // forbidden overlap on existing track
              else if (ang > 75 && ang < 105) pen -= 1000; // forbidden 90° T-junction
              else if (ang < 35) pen -= 1000;          // forbidden ultra-acute angle
            }
            return pen;
          };
          if (dOther) {
            sc += peerPenalty(dOther, otherPeerDirs);
            if (inc.origDirFromOther) {
              sc += (dOther.x * inc.origDirFromOther.x + dOther.y * inc.origDirFromOther.y) * 120;
            }
          }
          if (dDrag) {
            sc += peerPenalty(dDrag, dragPeerDirs);
            if (inc.origDirFromDrag) {
              sc += (dDrag.x * inc.origDirFromDrag.x + dDrag.y * inc.origDirFromDrag.y) * 80;
            }
          }
          if (flipFlag === !!inc.flipL) sc += 10;
          return sc;
        };

        const ptsF = buildOctilinearPoints(dragNode.x, dragNode.y, other.x, other.y, 'l-bend', false);
        const ptsT = buildOctilinearPoints(dragNode.x, dragNode.y, other.x, other.y, 'l-bend', true);
        const useTrue = scoreCand(ptsT, true) > scoreCand(ptsF, false);
        const pts = useTrue ? ptsT : ptsF;
        const chosenFlip = useTrue;

        if (pts.length > 2) {
          const fromId = origEdge.from, toId = origEdge.to;
          const orderedPts = (fromId === dragNode.id) ? pts : [...pts].reverse();
          this.graph.edges.delete(origEdge.id);
          let prevId = fromId;
          const midIds = [];
          for (let k = 1; k < orderedPts.length - 1; k++) {
            const mx = orderedPts[k].x, my = orderedPts[k].y;
            // Keep bend node independent from any crossed track so syncAllCrossings creates a clean overpass/underpass bridge!
            const midNode = this.graph.addNode(mx, my, { forceNew: true });
            midIds.push(midNode.id);
            this.graph.addEdge(prevId, midNode.id, { bendStyle: 'l-bend', flipL: chosenFlip });
            prevId = midNode.id;
          }
          this.graph.addEdge(prevId, toId, { bendStyle: 'l-bend', flipL: chosenFlip });
          for (const rt of this.routes.routes.values()) {
            const m = rt.nodeIds.length;
            if (m < 2) continue;
            const nextIds = [];
            for (let i = 0; i < m; i++) {
              const a = rt.nodeIds[i], b = rt.nodeIds[(i + 1) % m];
              nextIds.push(a);
              if (a === fromId && b === toId) nextIds.push(...midIds);
              else if (a === toId && b === fromId) nextIds.push(...[...midIds].reverse());
            }
            rt.nodeIds = nextIds;
          }
        }
      }
    }

    commitOctilinearTrack(plan, crossingChoices = [], switchChoices = []) {
      this.pushHistory('铺设轨道');
      // 1. Apply mid-edge splits (updating routes & crossings cleanly)
      const splitsByEdge = new Map();
      for (const sp of (plan.pendingSplits || [])) {
        if (!splitsByEdge.has(sp.edgeId)) splitsByEdge.set(sp.edgeId, []);
        splitsByEdge.get(sp.edgeId).push(sp);
      }
      for (const [origEdgeId, list] of splitsByEdge.entries()) {
        list.sort((a, b) => a.t - b.t);
        let currEdgeId = origEdgeId;
        for (const sp of list) {
          const split = this.graph.splitEdgeAt(currEdgeId, sp.x, sp.y);
          if (split) {
            this.routes.handleEdgeSplit(split.oldFrom, split.oldTo, split.node.id);
            currEdgeId = split.e2.id;
          }
        }
      }

      // 2. Add only genuinely new non-overlapping segments (creating implicit non-interactive nodes for bend-on-edge crossings)
      const ptKey = (x, y) => `${Math.round(x)},${Math.round(y)}`;
      const implicitSet = plan.implicitBendPts || new Set();
      const implicitNodesCreated = new Map();
      const getOrCreateSegNode = (x, y) => {
        const k = ptKey(x, y);
        if (implicitSet.has(k)) {
          if (!implicitNodesCreated.has(k)) {
            implicitNodesCreated.set(k, this.graph.addNode(x, y, { isImplicit: true, forceNew: true }));
          }
          return implicitNodesCreated.get(k);
        }
        return this.graph.addNode(x, y);
      };
      const createdEdges = [];
      for (const seg of plan.newSegs) {
        const nA = getOrCreateSegNode(seg.ax, seg.ay);
        const nB = getOrCreateSegNode(seg.bx, seg.by);
        const edge = this.graph.addEdge(nA.id, nB.id, {
          bendStyle: this.trackDrawStyle,
          flipL: this.trackFlipL
        });
        createdEdges.push(edge);
      }

      // 3. Apply user switch choices (开启道岔 / 关闭道岔)
      for (const sc of switchChoices) {
        const n = this.graph.findNodeAt(sc.x, sc.y, 4);
        if (n) n.isSwitch = !!sc.isSwitch;
      }

      // 4. Apply user crossing choices (both normal interior crossings AND implicit bend-on-edge crossings)
      for (let i = 0; i < (plan.hits || []).length; i++) {
        const h = plan.hits[i];
        const choice = crossingChoices[i] || 'level';
        const targetSegIdxs = h.isBendCrossing ? (h.segIndices || []) : [h.segIdx];
        const bendNode = h.isBendCrossing ? implicitNodesCreated.get(h.bendKey) : null;
        for (const sIdx of targetSegIdxs) {
          const newEdge = createdEdges[sIdx];
          if (!newEdge) continue;
          let oldEdge = this.graph.edges.get(h.edge.id);
          if (!oldEdge) {
            for (const e of this.graph.edges.values()) {
              if (e.id === newEdge.id) continue;
              const u = this.graph.getNode(e.from), v = this.graph.getNode(e.to);
              if (u && v && pointToSegmentDist(h.x, h.y, u.x, u.y, v.x, v.y).dist < 3) {
                oldEdge = e;
                break;
              }
            }
          }
          if (!oldEdge) continue;
          let cr;
          if (choice === 'overpass') {
            cr = this.graph.addCrossing(newEdge.id, oldEdge.id, h.x, h.y, 'overpass', newEdge.id, oldEdge.id);
          } else if (choice === 'underpass') {
            cr = this.graph.addCrossing(newEdge.id, oldEdge.id, h.x, h.y, 'underpass', oldEdge.id, newEdge.id);
          } else {
            cr = this.graph.addCrossing(newEdge.id, oldEdge.id, h.x, h.y, 'level', null, null);
          }
          if (cr && bendNode) cr.bendNodeId = bendNode.id;
        }
      }

      // 5. Remove redundant collinear intermediate nodes (keep station endpoints), renumber N1..Nk, & sync crossings
      const endPt = (plan.pts && plan.pts.length > 0)
        ? plan.pts[plan.pts.length - 1]
        : (plan.newSegs && plan.newSegs.length > 0 ? { x: plan.newSegs[plan.newSegs.length - 1].bx, y: plan.newSegs[plan.newSegs.length - 1].by } : null);
      this.cleanupAndRenumberGraph();
      this.graph.syncAllCrossings('level');
      if (this.trackContinuousMode && endPt) {
        const endNode = this.graph.findNodeAt(endPt.x, endPt.y, 4);
        this.trackChainStartNode = endNode || { id: null, x: endPt.x, y: endPt.y };
      } else {
        this.trackChainStartNode = null;
      }
      this.routes.rebuildAll();
      this.dispatcher.syncTrainsWithRoutes();
      this.renderSubbar();
      this.renderLineTree();
      this.refreshDiagnostics();

      // Check if any newly drawn track edge crosses through an existing platform (strictly over/under, no level crossing!)
      const crossedPlats = [];
      for (const pl of this.platforms.platforms.values()) {
        const ov = this.platforms.findPlatformOverlaps(pl);
        if (ov.edges.some(ed => createdEdges.some(ce => ce && ce.id === ed.id))) {
          crossedPlats.push(pl);
        }
      }
      if (crossedPlats.length > 0) {
        const promptCrossedPlats = (idx) => {
          if (idx >= crossedPlats.length) return;
          const pl = crossedPlats[idx];
          this.showInlinePromptAt(pl.cx, pl.cy, `轨道穿过「${pl.name}」`, '仅支持立体上下穿', [
            {
              label: '轨道上跨（站台下穿）',
              cls: 'btn-primary',
              onClick: () => {
                pl.zLayer = -1;
                this.hideInlinePrompt();
                promptCrossedPlats(idx + 1);
              }
            },
            {
              label: '轨道下穿（站台上跨）',
              onClick: () => {
                pl.zLayer = 1;
                this.hideInlinePrompt();
                promptCrossedPlats(idx + 1);
              }
            }
          ]);
        };
        promptCrossedPlats(0);
      }
    }

    findTrainAt(wx, wy) {
      if (this.routeDraft) return null;
      for (const train of this.dispatcher.trains.values()) {
        const route = this.routes.routes.get(train.routeId);
        if (!route) continue;
        const samples = Math.max(4, Math.round(train.length / 24));
        for (let i = 0; i <= samples; i++) {
          const pt = route.sampleAt(train.headS - (train.length * i) / samples);
          if (pt && dist(pt.x, pt.y, wx, wy) < 15) return train;
        }
      }
      return null;
    }

      document.querySelectorAll('#snapPopover [data-snap-len]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!this.activeSnapPopover) return;
          const len = Number(btn.dataset.snapLen);

          this.pushHistory('拼接换乘站台');
          const created = this.platforms.snapPlatform(this.activeSnapPopover.platformId, this.activeSnapPopover.side, len);
          this.hideSnapPopover();
          if (created) {
            this.showToast(`已拼接换乘站台「${created.name}」(${len}m)`);
