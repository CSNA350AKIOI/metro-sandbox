      document.getElementById('popGenTrackBtn').addEventListener('click', () => {
        if (!this.activeSnapPopover) return;
        const beforeSnap = this.captureSnapshot();
        const res = this.platforms.generateStationTrack(this.activeSnapPopover.platformId, this.activeSnapPopover.side);
        this.hideSnapPopover();
        if (!res) return;

        // Check if the newly generated station track crosses any existing bridge (forbid 3-track bridge stack)
        const newCrossings = this.graph.syncAllCrossings('overpass') || [];
        const preBridges = (beforeSnap.graph.crossings || []).filter(c => c.type === 'overpass' || c.type === 'underpass');
        const hitsExistingBridge = newCrossings.some(nc => preBridges.some(pb => dist(nc.x, nc.y, pb.x, pb.y) < 20));
        if (hitsExistingBridge) {
          this.restoreSnapshot(beforeSnap, false);
          this.showToast('立交桥处禁止再叠加交叉（仅允许两条轨道相交）');
          return;
        }

        this.undoStack.push({ label: '生成站台到发线', data: beforeSnap });
        if (this.undoStack.length > 50) this.undoStack.shift();
        this.redoStack = [];
        this.updateHistoryButtons();

        const stationEdgeId = res.edge.id;
        if (newCrossings.length === 0) {
          this.showToast(`已生成 ${res.edge.platformLength}m 站线`);
          return;
        }

        // Prompt user sequentially for every crossing between the new station track and existing tracks
        const promptStationCross = (idx) => {
          if (idx >= newCrossings.length) {
            this.graph.rebuildCrossingIndex();
            this.routes.rebuildAll();
            this.dispatcher.syncTrainsWithRoutes(false);
            this.refreshDiagnostics();
            this.showToast(`已生成 ${res.edge.platformLength}m 站线`);
            return;
          }
          const cr = newCrossings[idx];
          const otherEdgeId = cr.edgeA === stationEdgeId ? cr.edgeB : cr.edgeA;
          const apply = (mode) => {
            if (mode === 'level') {
              cr.type = 'level'; cr.overEdgeId = null; cr.underEdgeId = null;
            } else if (mode === 'over') {
              cr.type = 'overpass'; cr.overEdgeId = stationEdgeId; cr.underEdgeId = otherEdgeId;
            } else {
              cr.type = 'underpass'; cr.overEdgeId = otherEdgeId; cr.underEdgeId = stationEdgeId;
            }
            this.graph.rebuildCrossingIndex();
            this.hideInlinePrompt();
            promptStationCross(idx + 1);
          };
          const stepText = newCrossings.length > 1 ? `站线交叉 ${idx + 1}/${newCrossings.length}` : '站线交叉';
          this.showInlinePromptAt(cr.x, cr.y, '站线交叉方式', stepText, [
            { label: '平面相交', title: '共用闭塞区段', onClick: () => apply('level') },
            { label: '站线上跨', cls: 'btn-primary', title: '新站线作为高架桥上跨', onClick: () => apply('over') },
            { label: '站线下跨', title: '新站线从既有轨道下方下穿', onClick: () => apply('under') },
            {
              label: '取消生成',
              cls: 'btn-danger',
              onClick: () => {
                this.hideInlinePrompt();
                if (this.undoStack.length > 0) this.undoStack.pop();
                this.restoreSnapshot(beforeSnap, false);
                this.updateHistoryButtons();
                this.refreshDiagnostics();
                this.showToast('已取消生成站线');
              }
            }
          ]);
        };
        promptStationCross(0);
      });
      document.getElementById('popSnapToTrackBtn').addEventListener('click', () => {
        if (!this.activeSnapPopover) return;
        const { platformId, side } = this.activeSnapPopover;
        const p = this.platforms.getPlatform(platformId);
        this.hideSnapPopover();
        this.hideInlinePrompt();
        if (!p) return;
        if (this.platforms.hasBoundTrackInGroup(p.id)) {
          this.showToast('该站台组已绑定站线，禁止平移吸附；请改用「生成站线」或先删除原站线');
          return;
        }
        let hasCandidate = false;
        for (const e of this.graph.edges.values()) {
          if (this.platforms.isEdgeEligibleForSnap(p, e)) { hasCandidate = true; break; }
        }
        if (!hasCandidate) {
          this.showToast(`暂无同向且长度 ≥ ${p.length}m 的可用轨道`);
          return;
        }
        this.pendingTrackSnap = { platformId, side, targetLength: p.length };
        this.hoveredCandidateEdge = null;
        this.renderSubbar();
        this.showToast(`请点击高亮的同向轨道（≥${p.length}m）完成吸附`);
      });

      window.addEventListener('keydown', e => {
        // Rule 5: Space ALWAYS toggles play/pause regardless of which element currently has focus!
        if (e.code === 'Space') {
          e.preventDefault();
          if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
            document.activeElement.blur();
          }
          if (!e.repeat) {
            this.dispatcher.running = !this.dispatcher.running;
            const bp = document.getElementById('btnPlayPause');
            if (bp) bp.textContent = this.dispatcher.running ? '暂停' : '运行';
          }
          return;
        }
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) this.redo();
          else this.undo();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          this.redo();
          return;
        }
        if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey && !e.altKey && this.mode === 'track' && this.trackDrawStyle === 'l-bend') {
          this.trackFlipL = !this.trackFlipL;
          return;
        }
        if (e.key.toLowerCase() === 'c' && !e.ctrlKey && !e.metaKey && !e.altKey && this.mode === 'track') {
          this.trackContinuousMode = !this.trackContinuousMode;
          if (!this.trackContinuousMode) this.trackChainStartNode = null;
          this.renderSubbar();
          this.showToast(this.trackContinuousMode ? '已开启连续绘制 (C)' : '已切换为单段绘制 (C)');
          return;
        }
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (this.mode === 'route' && this.routeDraft && this.routeDraft.selectedSegIdx !== null && this.routeDraft.selectedSegIdx !== undefined) {
            e.preventDefault();
            this.deleteSelectedDraftSegment();
          } else if (this.selectedEntity) {
            e.preventDefault();
            this.deleteSelectedEntity();
          }
        } else if (e.key === 'Escape') {
          this.trackChainStartNode = null;
          this.pendingTrackSnap = null;
          this.pendingRouteInsert = null;
          this.hoveredCandidateEdge = null;
          this.hideSnapPopover();
          this.hideInlinePrompt();
          this.renderSubbar();
        }
      });
      window.addEventListener('keyup', e => {
        if (e.code === 'Space') {
          this.spaceDown = false;
        }
      });

      this.canvas.addEventListener('contextmenu', e => e.preventDefault());

      this.canvas.addEventListener('dblclick', e => {
        const rect = this.canvas.getBoundingClientRect();
        const w = this.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        const hitPlat = this.platforms.findPlatformAt(w.x, w.y);
        if (hitPlat) {
          this.setMode('select');
          this.selectedEntity = { type: 'platform', id: hitPlat.id };
          this.renderSubbar();
          const inp = document.getElementById('editPlatNameInput');
          if (inp) { inp.focus(); inp.select(); }
          return;
        }
        if (this.mode !== 'select' && this.mode !== 'track') return;
        const hit = this.graph.findEdgeAt(w.x, w.y, 12 / this.cam.zoom);
        if (hit && !hit.edge.isStationTrack) {
          if (this.graph.findBridgeNear(w.x, w.y, 20)) {
            this.showToast('禁止在立交桥上下方加点或开设道岔');
            return;
          }
          this.pushHistory('在轨道中插入节点');
          const split = this.graph.splitEdgeAt(hit.edge.id, w.x, w.y);
          if (split) {
            this.routes.handleEdgeSplit(split.oldFrom, split.oldTo, split.node.id);
            this.routes.rebuildAll();
            this.dispatcher.syncTrainsWithRoutes();
            this.selectedEntity = { type: 'node', id: split.node.id };
            this.renderSubbar();
            this.renderLineTree();
            this.showToast(`已在轨道中插入节点 ${split.node.id}`);
          } else {
            this.undoStack.pop();
            this.updateHistoryButtons();
          }
        }
      });

      this.canvas.addEventListener('mousedown', e => {
        this.focusedNodeId = null;
        const rect = this.canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const w = this.screenToWorld(sx, sy);

        if (e.button === 1 || e.button === 2 || (e.button === 0 && this.spaceDown)) {
          if (e.button === 2 && this.mode === 'track' && this.trackChainStartNode) {
            this.trackChainStartNode = null;
            this.renderSubbar();
            return;
          }
          this.isPanning = true;
          this.panStart = { x: sx, y: sy, camX: this.cam.x, camY: this.cam.y };
          this.canvas.style.cursor = 'grabbing';
          this.hideSnapPopover();
          return;
        }
        if (e.button !== 0) return;

        if (this.pendingTrackSnap) {
          const { platformId, side } = this.pendingTrackSnap;
          const plat = this.platforms.getPlatform(platformId);
          const hit = this.graph.findEdgeAt(w.x, w.y, 18 / this.cam.zoom);
          if (hit && this.platforms.isEdgeEligibleForSnap(plat, hit.edge)) {
            this.pushHistory('吸附站台至轨道');
            const res = this.platforms.snapPlatformToEdge(platformId, side, hit.edge.id, this.routes, w);
            this.pendingTrackSnap = null;
            this.hoveredCandidateEdge = null;
            if (res && res.ok) {
              this.graph.syncAllCrossings('overpass');
              this.routes.rebuildAll();
              this.dispatcher.syncTrainsWithRoutes();
              this.renderLineTree();
              this.refreshDiagnostics();
              this.showToast(`已将「${res.platform.name}」吸附至轨道 ${res.edge.id}`);
            } else {
              this.undoStack.pop();
              this.updateHistoryButtons();
              this.showToast(res ? res.reason : '吸附失败');
            }
            this.renderSubbar();
          } else {
            this.pendingTrackSnap = null;
            this.hoveredCandidateEdge = null;
            this.renderSubbar();
            this.showToast('已取消吸附选择');
          }
          return;
        }

        if (this.mode === 'platform' || (this.mode === 'select' && this.selectedEntity && this.selectedEntity.type === 'platform')) {
          const sp = this.platforms.findSnapPointAt(w.x, w.y, 13 / this.cam.zoom);
          const isValidForMode = sp && !sp.occupied && (this.mode === 'platform' || sp.platformId === this.selectedEntity.id);
          if (isValidForMode) {
            this.showSnapPopover(sp, sx, sy);
            return;
          }
        }
        this.hideSnapPopover();

        if (this.pendingRouteInsert) {
          const { routeId, afterIndex, fromId, toId } = this.pendingRouteInsert;
          const hitNode = this.graph.findNodeAt(w.x, w.y, 18 / this.cam.zoom);
          if (hitNode) {
            this.pushHistory('向交路环插入节点');
            const res = this.routes.insertNodeBetween(routeId, afterIndex, hitNode.id);
            if (!res.ok) {
              this.undoStack.pop();
              this.updateHistoryButtons();
              this.showToast(res.reason);
            } else {
              this.dispatcher.syncTrainsWithRoutes();
              this.renderLineTree();
              this.refreshDiagnostics();
              this.showToast(`已插入节点 ${hitNode.id}`);
            }
          }
          this.pendingRouteInsert = null;
          this.renderSubbar();
          this.renderLineTree();
          return;
        }

        if (this.mode === 'select') {
          const hitCross = this.graph.findCrossingAt(w.x, w.y, 14 / this.cam.zoom);
          if (hitCross) {
            this.showInlinePromptAt(hitCross.x, hitCross.y, `交叉 ${hitCross.id}`, hitCross.type === 'level' ? '平交' : '立交', [
              { label: '平面相交', cls: hitCross.type === 'level' ? 'btn-primary' : '', title: '共用闭塞区段', onClick: () => {
                this.pushHistory('修改交叉方式');
                hitCross.type = 'level'; hitCross.overEdgeId = null; hitCross.underEdgeId = null;
                this.hideInlinePrompt();
              } },
              { label: `${hitCross.edgeA} 上跨`, cls: hitCross.overEdgeId === hitCross.edgeA ? 'btn-primary' : '', onClick: () => {
                this.pushHistory('修改交叉方式');
                hitCross.type = 'overpass'; hitCross.overEdgeId = hitCross.edgeA; hitCross.underEdgeId = hitCross.edgeB;
                this.hideInlinePrompt();
              } },
              { label: `${hitCross.edgeB} 上跨`, cls: hitCross.overEdgeId === hitCross.edgeB ? 'btn-primary' : '', onClick: () => {
                this.pushHistory('修改交叉方式');
                hitCross.type = 'overpass'; hitCross.overEdgeId = hitCross.edgeB; hitCross.underEdgeId = hitCross.edgeA;
                this.hideInlinePrompt();
              } },
              { label: '关闭', onClick: () => this.hideInlinePrompt() }
            ]);
            return;
          }
          const hitNode = this.graph.findNodeAt(w.x, w.y, 14 / this.cam.zoom);
          if (hitNode && (!hitNode.isStationEnd || this.graph.classifyNode(hitNode.id) === 'switch')) {
            this.selectedEntity = { type: 'node', id: hitNode.id };
            if (!hitNode.isStationEnd) {
              const incOrig = this.graph.getIncidentEdges(hitNode.id).map(ed => {
                const otherId = ed.from === hitNode.id ? ed.to : ed.from;
                const on = this.graph.getNode(otherId);
                const len = on ? dist(hitNode.x, hitNode.y, on.x, on.y) : 0;
                const dDrag = (on && len > 1e-4) ? { x: (on.x - hitNode.x) / len, y: (on.y - hitNode.y) / len } : null;
                return {
                  movedId: hitNode.id,
                  otherId,
                  bendStyle: 'l-bend',
                  flipL: !!ed.flipL,
                  origDirFromDrag: dDrag,
                  origDirFromOther: dDrag ? { x: -dDrag.x, y: -dDrag.y } : null
                };
              });
              this.draggingEntity = {
                type: 'node',
                id: hitNode.id,
                lastX: hitNode.x,
                lastY: hitNode.y,
                baseSnap: this.captureSnapshot(),
                origIncident: incOrig,
                pushed: false
              };
            } else {
              this.draggingEntity = null;
            }
            this.renderSubbar();
            return;
          }
          const prefPlatId = (this.selectedEntity && this.selectedEntity.type === 'platform') ? this.selectedEntity.id : null;
          const hitPlat = this.platforms.findPlatformAt(w.x, w.y, prefPlatId);
          if (hitPlat) {
            this.selectedEntity = { type: 'platform', id: hitPlat.id };
            // Collect all station-track nodes belonging to this platform group and their external incident edges
            const groupNodeIds = new Set();
            const visP = new Set([hitPlat.id]);
            const qP = [hitPlat];
            while (qP.length > 0) {
              const curP = qP.shift();
              [-1, 1].forEach(sd => {
                const info = curP.sides[String(sd)];
                if (info.type === 'platform' && info.refId && !visP.has(info.refId)) {
                  const sib = this.platforms.getPlatform(info.refId);
                  if (sib) { visP.add(sib.id); qP.push(sib); }
                } else if (info.type === 'track' && info.refId) {
                  const ed = this.graph.edges.get(info.refId);
                  if (ed) { groupNodeIds.add(ed.from); groupNodeIds.add(ed.to); }
                }
              });
            }
            const platIncOrig = [];
            for (const nid of groupNodeIds) {
              const mn = this.graph.getNode(nid);
              if (!mn) continue;
              for (const ed of this.graph.getIncidentEdges(nid)) {
                if (ed.isStationTrack) continue;
                const otherId = ed.from === nid ? ed.to : ed.from;
                if (groupNodeIds.has(otherId)) continue;
                const on = this.graph.getNode(otherId);
                const len = on ? dist(mn.x, mn.y, on.x, on.y) : 0;
                const dDrag = (on && len > 1e-4) ? { x: (on.x - mn.x) / len, y: (on.y - mn.y) / len } : null;
                platIncOrig.push({
                  movedId: nid,
                  otherId,
                  bendStyle: 'l-bend',
                  flipL: !!ed.flipL,
                  origDirFromDrag: dDrag,
                  origDirFromOther: dDrag ? { x: -dDrag.x, y: -dDrag.y } : null
                });
              }
            }
            const startGX = snapToGrid(w.x), startGY = snapToGrid(w.y);
            this.draggingEntity = {
              type: 'platform',
              id: hitPlat.id,
              startX: startGX,
              startY: startGY,
              lastX: startGX,
              lastY: startGY,
              baseSnap: this.captureSnapshot(),
              groupNodeIds: Array.from(groupNodeIds),
              origIncident: platIncOrig,
              pushed: false
            };
            this.renderSubbar();
            return;
          }
          if (hitNode) {
            this.selectedEntity = { type: 'node', id: hitNode.id };
            this.draggingEntity = null;
            this.renderSubbar();
            return;
          }
          const hitEdge = this.graph.findEdgeAt(w.x, w.y, 10 / this.cam.zoom);
          if (hitEdge) {
            this.selectedEntity = { type: 'edge', id: hitEdge.edge.id };
            this.renderSubbar();
            return;
          }
          this.selectedEntity = null;
          this.renderSubbar();
          return;
        }

        if (this.mode === 'platform') {
          const beforeSnap = this.captureSnapshot();
          this.pushHistory('放置站台');
          const p = this.platforms.addPlatform(snapToGrid(w.x), snapToGrid(w.y), this.platformConfig.length, this.platformConfig.angleDeg, this.platformConfig.name);
          this.platformConfig.name = '';
          this.renderSubbar();
          this.showToast(`已放置「${p.name}」(${p.length}m)`);
          this.promptPlatformOverlap(p, beforeSnap, '取消放置');
        } else if (this.mode === 'track') {
          const gx = snapToGrid(w.x);
          const gy = snapToGrid(w.y);
          if (!this.trackChainStartNode) {
            // 2k+1 click: record start point strictly on grid (do not create orphan node yet)
            if (this.graph.findBridgeNear(gx, gy, 20)) {
              this.showToast('禁止在立交桥上下方开设道岔');
              return;
            }
            const hitNode = this.graph.findNodeAt(gx, gy, 6);
            if (hitNode && this.graph.classifyNode(hitNode.id) === 'switch') {
              this.showToast(`不可从道岔 ${hitNode.id} 引出新轨道`);
              return;
            }
            this.trackChainStartNode = hitNode || { id: null, x: gx, y: gy };
            this.renderSubbar();
          } else {
            // 2k+2 click: build strict octilinear (0°/45°/90°) polyline with corner nodes, NO auto-chain!
            if (gx === this.trackChainStartNode.x && gy === this.trackChainStartNode.y) {
              this.trackChainStartNode = null;
              this.renderSubbar();
              return;
            }
            const pts = buildOctilinearPoints(this.trackChainStartNode.x, this.trackChainStartNode.y, gx, gy, this.trackDrawStyle, this.trackFlipL);
            const plan = this.graph.analyzeTrackPlacement(pts);
            if (!plan.ok) {
              this.showToast(plan.reason || '无法铺设此轨道');
              return;
            }
            if (plan.noop) {
              this.trackChainStartNode = null;
              this.renderSubbar();
              this.showToast('轨道与已有线段重合，未新增');
              return;
            }
            if (plan.hits.length > 0 || plan.switchCandidates.length > 0) {
              this.pendingPlacement = {
                plan,
                hits: plan.hits,
                switchCandidates: plan.switchCandidates,
                crossingChoices: [],
                switchChoices: [],
                stepIndex: 0
              };
              this.advancePendingPlacement();
              return;
            }
            this.commitOctilinearTrack(plan);
          }
        } else if (this.mode === 'route') {
          const isInserting = !!(this.routeDraft && this.routeDraft.insertAfterIdx !== null && this.routeDraft.insertAfterIdx !== undefined);
          const nodeRadius = (isInserting ? 18 : 11) / this.cam.zoom;
          const hitNode = this.graph.findNodeAt(w.x, w.y, nodeRadius);
          if (hitNode) {
            if (this.routeDraft) this.routeDraft.selectedSegIdx = null;
            this.handleRouteNodeClick(hitNode);
          } else if (this.routeDraft && !isInserting) {
            const segIdx = this.findDraftSegmentAt(w.x, w.y, 13 / this.cam.zoom);
            if (segIdx !== null) {
              this.routeDraft.selectedSegIdx = segIdx;
              this.routeDraft.lastCutSlotIdx = null;
              this.routeDraft.insertAfterIdx = null;
              this.renderSubbar();
              this.renderLineTree();
            } else if (this.routeDraft.selectedSegIdx !== null && this.routeDraft.selectedSegIdx !== undefined) {
              this.routeDraft.selectedSegIdx = null;
              this.renderSubbar();
              this.renderLineTree();
            }
          }
        } else if (this.mode === 'simulate') {
          const train = this.findTrainAt(w.x, w.y);
          this.selectedTrainId = train ? train.id : null;
          if (train) {
            this.selectedRouteId = train.routeId;
            this.renderLineTree();
          }
        }
      });

      this.canvas.addEventListener('mousemove', e => {
        const rect = this.canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        if (this.isPanning) {
          this.cam.x = this.panStart.camX + (sx - this.panStart.x);
          this.cam.y = this.panStart.camY + (sy - this.panStart.y);
          return;
        }
        const w = this.screenToWorld(sx, sy);
        this.mouseWorld = w;

        if (this.draggingEntity) {
          const gx = snapToGrid(w.x);
          const gy = snapToGrid(w.y);
          const dx = gx - this.draggingEntity.lastX;
          const dy = gy - this.draggingEntity.lastY;
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            if (this.draggingEntity.type === 'node') {
              // Rule 4: forbid dropping/dragging a node directly onto another existing node's coordinates
              const snapNodes = this.draggingEntity.baseSnap.graph.nodes;
              const collidesOther = snapNodes.some(n => n.id !== this.draggingEntity.id && !n.isImplicit && dist(n.x, n.y, gx, gy) < 4);
              if (collidesOther) return;
              // Forbid dragging a switch node (>=3 incident edges) onto/under an overpass bridge
              if ((this.draggingEntity.origIncident || []).length >= 3 && this.graph.findBridgeNear(gx, gy, 20)) return;
              if (!this.draggingEntity.pushed) {
                this.undoStack.push({ label: '移动节点', data: this.draggingEntity.baseSnap });
                if (this.undoStack.length > 50) this.undoStack.shift();
                this.redoStack = [];
                this.updateHistoryButtons();
                this.draggingEntity.pushed = true;
              }
              const snap = this.draggingEntity.baseSnap;
              this.graph.clear();
              this.graph.nextNodeId = snap.graph.nextNodeId;
              this.graph.nextEdgeId = snap.graph.nextEdgeId;
              this.graph.nextCrossingId = snap.graph.nextCrossingId || 1;
              for (const n of snap.graph.nodes) {
                this.graph.nodes.set(n.id, { ...n, isSwitch: n.isSwitch !== undefined ? !!n.isSwitch : true, lockedBy: null });
              }
              for (const ed of snap.graph.edges) {
                this.graph.edges.set(ed.id, { ...ed, lockedBy: null });
              }
              for (const c of (snap.graph.crossings || [])) {
                this.graph.crossings.set(c.id, { ...c });
              }
              for (const rSnap of snap.routes.items) {
                const rt = this.routes.routes.get(rSnap.id);
                if (rt) {
                  rt.nodeIds = [...rSnap.nodeIds];
                  rt.turnbackIndices = new Set(rSnap.turnbackIndices);
                }
              }

              const dragNode = this.graph.getNode(this.draggingEntity.id);
              if (dragNode) {
                this.graph.updateNodePosition(dragNode.id, gx, gy);
                this.reconnectMovedNodesOctilinear([dragNode.id], this.draggingEntity.origIncident);
              }
              this.graph.syncAllCrossings('overpass');
              this.routes.rebuildAll();
            } else if (this.draggingEntity.type === 'platform') {
              if (!this.draggingEntity.pushed) {
                this.undoStack.push({ label: '移动站台', data: this.draggingEntity.baseSnap });
                if (this.undoStack.length > 50) this.undoStack.shift();
                this.redoStack = [];
                this.updateHistoryButtons();
                this.draggingEntity.pushed = true;
              }
              const snap = this.draggingEntity.baseSnap;
              const totalDx = gx - this.draggingEntity.startX;
              const totalDy = gy - this.draggingEntity.startY;
              this.graph.clear();
              this.graph.nextNodeId = snap.graph.nextNodeId;
              this.graph.nextEdgeId = snap.graph.nextEdgeId;
              this.graph.nextCrossingId = snap.graph.nextCrossingId || 1;
              for (const n of snap.graph.nodes) {
                this.graph.nodes.set(n.id, { ...n, isSwitch: n.isSwitch !== undefined ? !!n.isSwitch : true, lockedBy: null });
              }
              for (const ed of snap.graph.edges) {
                this.graph.edges.set(ed.id, { ...ed, lockedBy: null });
              }
              for (const c of (snap.graph.crossings || [])) {
                this.graph.crossings.set(c.id, { ...c });
              }
              this.platforms.clear();
              this.platforms.nextId = snap.platforms.nextId;
              for (const pl of snap.platforms.items) {
                this.platforms.platforms.set(pl.id, {
                  ...pl,
                  sides: { '-1': { ...pl.sides['-1'] }, '1': { ...pl.sides['1'] } }
                });
              }
              for (const rSnap of snap.routes.items) {
                const rt = this.routes.routes.get(rSnap.id);
                if (rt) {
                  rt.nodeIds = [...rSnap.nodeIds];
                  rt.turnbackIndices = new Set(rSnap.turnbackIndices);
                }
              }
              this.platforms.movePlatformGroup(this.draggingEntity.id, totalDx, totalDy);
              this.reconnectMovedNodesOctilinear(this.draggingEntity.groupNodeIds || [], this.draggingEntity.origIncident || []);
              this.graph.syncAllCrossings('overpass');
              this.routes.rebuildAll();
            }
            this.draggingEntity.lastX = gx;
            this.draggingEntity.lastY = gy;
          }
          return;
        }
        if (this.pendingTrackSnap) {
          const plat = this.platforms.getPlatform(this.pendingTrackSnap.platformId);
          const hit = this.graph.findEdgeAt(w.x, w.y, 18 / this.cam.zoom);
          this.hoveredCandidateEdge = (hit && this.platforms.isEdgeEligibleForSnap(plat, hit.edge)) ? hit.edge : null;
        } else {
          this.hoveredCandidateEdge = null;
        }
        const hn = this.graph.findNodeAt(w.x, w.y, 16 / this.cam.zoom);
        this.hoveredNodeId = hn ? hn.id : null;
        if (this.mode === 'platform' || (this.mode === 'select' && this.selectedEntity && this.selectedEntity.type === 'platform')) {
          const sp = this.platforms.findSnapPointAt(w.x, w.y, 13 / this.cam.zoom);
          const isValidForMode = sp && !sp.occupied && (this.mode === 'platform' || sp.platformId === this.selectedEntity.id);
          this.hoveredSnapPoint = isValidForMode ? sp : null;
        } else {
          this.hoveredSnapPoint = null;
        }
      });

      window.addEventListener('mouseup', () => {
        if (this.draggingEntity) {
          const moved = this.draggingEntity.pushed;
          const wasNode = this.draggingEntity.type === 'node';
          const wasPlatId = this.draggingEntity.type === 'platform' ? this.draggingEntity.id : null;
          const wasNodeOrPlat = wasNode || Boolean(wasPlatId);
          const dragBaseSnap = this.draggingEntity.baseSnap || null;
          const dropNodeObj = wasNode ? this.graph.getNode(this.draggingEntity.id) : null;
          const dropPos = dropNodeObj ? { x: dropNodeObj.x, y: dropNodeObj.y } : null;
          this.draggingEntity = null;
          if (moved) {
            // Collect crossing pairs that already existed BEFORE this drag (by spatial proximity) so we only prompt truly NEW crossings
            const baseCrossPts = (dragBaseSnap && dragBaseSnap.graph && dragBaseSnap.graph.crossings)
              ? dragBaseSnap.graph.crossings.map(c => ({ x: c.x, y: c.y, edgeA: c.edgeA, edgeB: c.edgeB }))
              : [];
            if (wasNodeOrPlat) this.cleanupAndRenumberGraph();
            const addedFromSync = this.graph.syncAllCrossings('overpass') || [];
            // Deduplicate new crossings (e.g. two bendNodeId entries at the exact same bridge) & exclude any crossing already near a pre-drag crossing
            const newBridgeQueue = [];
            const seenNewKeys = new Set();
            for (const cr of this.graph.crossings.values()) {
              const wasInBase = baseCrossPts.some(bc =>
                (bc.edgeA === cr.edgeA && bc.edgeB === cr.edgeB) ||
                (bc.edgeA === cr.edgeB && bc.edgeB === cr.edgeA) ||
                dist(bc.x, bc.y, cr.x, cr.y) < 18
              );
              if (wasInBase && !addedFromSync.includes(cr)) continue;
              if (wasInBase) continue;
              const dedupK = cr.bendNodeId ? ('B|' + cr.bendNodeId) : ('C|' + Math.round(cr.x) + ',' + Math.round(cr.y));
              if (seenNewKeys.has(dedupK)) continue;
              seenNewKeys.add(dedupK);
              newBridgeQueue.push(cr);
            }
            this.routes.rebuildAll();
            this.dispatcher.syncTrainsWithRoutes(false);
            this.renderSubbar();
            this.renderLineTree();
            this.refreshDiagnostics();

            const runSwitchDropPrompt = () => {
            if (wasNode && dropPos) {
              const droppedNode = this.graph.findNodeAt(dropPos.x, dropPos.y, 3);
              if (droppedNode && !droppedNode.isStationEnd) {
                let targetEdge = null;
                for (const ed of this.graph.edges.values()) {
                  if (ed.isStationTrack) continue;
                  if (ed.from === droppedNode.id || ed.to === droppedNode.id) continue;
                  const u = this.graph.getNode(ed.from), v = this.graph.getNode(ed.to);
                  if (!u || !v) continue;
                  const proj = pointToSegmentDist(droppedNode.x, droppedNode.y, u.x, u.y, v.x, v.y);
                  if (proj.dist < 6 && proj.t > 0.01 && proj.t < 0.99) {
                    targetEdge = ed;
                    break;
                  }
                }
                if (targetEdge) {
                  if (this.graph.findBridgeNear(droppedNode.x, droppedNode.y, 20)) {
                    this.showToast('禁止在立交桥上下方开设道岔');
                  } else {
                    const u = this.graph.getNode(targetEdge.from), v = this.graph.getNode(targetEdge.to);
                    const angles = [];
                    const pushAng = (tx, ty) => {
                      const ang = ((Math.atan2(ty - droppedNode.y, tx - droppedNode.x) * 180) / Math.PI + 360) % 360;
                      if (!angles.some(a => Math.min(Math.abs(a - ang), 360 - Math.abs(a - ang)) < 2.5)) angles.push(ang);
                    };
                    if (u) pushAng(u.x, u.y);
                    if (v) pushAng(v.x, v.y);
                    for (const incE of this.graph.getIncidentEdges(droppedNode.id)) {
                      const oId = incE.from === droppedNode.id ? incE.to : incE.from;
                      const on = this.graph.getNode(oId);
                      if (on) pushAng(on.x, on.y);
                    }
                    if (this.graph.isSwitchAngles(angles)) {
                      const dropId = droppedNode.id;
                      const edgeId = targetEdge.id;
                      this.showInlinePromptAt(droppedNode.x, droppedNode.y, `节点 ${dropId} 落于轨道`, '是否开设道岔？', [
                        {
                          label: '开设道岔',
                          cls: 'btn-primary',
                          onClick: () => {
                            const edNow = this.graph.edges.get(edgeId);
                            const dnNow = this.graph.getNode(dropId);
                            if (edNow && dnNow) {
                              this.pushHistory('拖点落线开设道岔');
                              const oldFrom = edNow.from, oldTo = edNow.to;
                              const aN = this.graph.getNode(oldFrom), bN = this.graph.getNode(oldTo);
                              this.graph.edges.delete(edgeId);
                              const e1 = this.graph.addEdge(oldFrom, dropId);
                              const e2 = this.graph.addEdge(dropId, oldTo);
                              for (const cr of this.graph.crossings.values()) {
                                if (cr.edgeA === edgeId || cr.edgeB === edgeId) {
                                  const oId = cr.edgeA === edgeId ? cr.edgeB : cr.edgeA;
                                  const oe = this.graph.edges.get(oId);
                                  if (!oe || !aN || !bN) continue;
                                  const oa = this.graph.getNode(oe.from), ob = this.graph.getNode(oe.to);
                                  if (!oa || !ob) continue;
                                  const hit1 = segmentInteriorIntersection(aN.x, aN.y, dnNow.x, dnNow.y, oa.x, oa.y, ob.x, ob.y);
                                  const tid = hit1 ? e1.id : e2.id;
                                  if (cr.edgeA === edgeId) cr.edgeA = tid;
                                  if (cr.edgeB === edgeId) cr.edgeB = tid;
                                  if (cr.overEdgeId === edgeId) cr.overEdgeId = tid;
                                  if (cr.underEdgeId === edgeId) cr.underEdgeId = tid;
                                }
                              }
                              this.graph.rebuildCrossingIndex();
                              dnNow.isSwitch = true;
                              this.routes.handleEdgeSplit(oldFrom, oldTo, dropId);
                              this.graph.syncAllCrossings('overpass');
                              this.routes.rebuildAll();
                              this.dispatcher.syncTrainsWithRoutes(false);
                              this.renderSubbar();
                              this.renderLineTree();
                              this.refreshDiagnostics();
                              this.showToast(`已在 ${dropId} 开设道岔`);
                            }
                            this.hideInlinePrompt();
                          }
                        },
                        {
                          label: '保持断头路',
                          onClick: () => {
                            this.hideInlinePrompt();
                            this.showToast(`节点 ${dropId} 保持断头路（未接入轨道）`);
                          }
                        }
                      ]);
                    } else {
                      this.showToast(`当前角度无法与轨道 ${targetEdge.id} 形成有效道岔（需 135° 单开/Y型道岔）`);
                    }
                  }
                }
              }
            }
            }; // end runSwitchDropPrompt

            // Prompt user sequentially for each genuinely NEW crossing created by the drag (replicating new-track UX without adding nodes!)
            const promptNewCrossings = (idx) => {
              if (idx >= newBridgeQueue.length) {
                if (wasPlatId) {
                  const movedPlat = this.platforms.getPlatform(wasPlatId);
                  this.promptPlatformOverlap(movedPlat, dragBaseSnap, '取消拖动');
                } else {
                  runSwitchDropPrompt();
                }
                return;
              }
              const cr = newBridgeQueue[idx];
              if (!this.graph.crossings.has(cr.id)) {
                promptNewCrossings(idx + 1);
                return;
              }
              const applyChoice = (mode) => {
                // Apply to cr AND any sibling crossing sharing the exact same bendNodeId
                const targets = cr.bendNodeId
                  ? Array.from(this.graph.crossings.values()).filter(x => x.bendNodeId === cr.bendNodeId)
                  : [cr];
                for (const t of targets) {
                  if (mode === 'level') {
                    t.type = 'level'; t.overEdgeId = null; t.underEdgeId = null;
                  } else if (mode === 'overA') {
                    t.type = 'overpass'; t.overEdgeId = t.edgeA; t.underEdgeId = t.edgeB;
                  } else if (mode === 'overB') {
                    t.type = 'underpass'; t.overEdgeId = t.edgeB; t.underEdgeId = t.edgeA;
                  }
                }
                this.graph.rebuildCrossingIndex();
                this.hideInlinePrompt();
                promptNewCrossings(idx + 1);
              };
              const stepText = newBridgeQueue.length > 1 ? `新交叉 ${idx + 1}/${newBridgeQueue.length}` : '新增交叉';
              this.showInlinePromptAt(cr.x, cr.y, '拖动产生新交叉', stepText, [
                { label: '平面相交', title: '共用闭塞区段', onClick: () => applyChoice('level') },
                { label: `${cr.edgeA} 上跨`, cls: 'btn-primary', title: `${cr.edgeA} 作为高架桥上跨`, onClick: () => applyChoice('overA') },
                { label: `${cr.edgeB} 上跨`, title: `${cr.edgeB} 作为高架桥上跨`, onClick: () => applyChoice('overB') },
                {
                  label: '取消拖动',
                  cls: 'btn-danger',
                  onClick: () => {
                    this.hideInlinePrompt();
                    if (dragBaseSnap) {
                      if (this.undoStack.length > 0) this.undoStack.pop();
                      this.restoreSnapshot(dragBaseSnap, false);
                      this.updateHistoryButtons();
                      this.refreshDiagnostics();
                      this.showToast('已取消拖动');
                    }
                  }
                }
              ]);
            };

            const runAfterCrossings = () => {
              if (wasPlatId) {
                const movedPlat = this.platforms.getPlatform(wasPlatId);
                this.promptPlatformOverlap(movedPlat, dragBaseSnap, '取消拖动');
              } else {
                runSwitchDropPrompt();
              }
            };
            if (newBridgeQueue.length > 0) {
              promptNewCrossings(0);
            } else {
              runAfterCrossings();
            }
          }
        }
        if (this.isPanning) {
          this.isPanning = false;
          this.canvas.style.cursor = this.spaceDown ? 'grab' : (this.mode === 'simulate' ? 'default' : 'crosshair');
        }
      });

      this.canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const rect = this.canvas.getBoundingClientRect();
        const sx = e.clientX - rect.left;
        const sy = e.clientY - rect.top;
        const before = this.screenToWorld(sx, sy);
        this.cam.zoom = clamp(this.cam.zoom * (e.deltaY < 0 ? 1.12 : 0.89), 0.25, 3.2);
        this.cam.x = sx - before.x * this.cam.zoom;
        this.cam.y = sy - before.y * this.cam.zoom;
        this.updateZoomHUD();
        this.hideSnapPopover();
      }, { passive: false });
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    window.metroApp = new SandboxApp();
  });
})();
</script>
</body>
</html>
