<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metro Sandbox — 地铁线网与调度建造沙盒</title>
<style>
  :root, [data-theme="dark"] {
    --bg-canvas: #0f172a;
    --bg-panel: #111827;
    --bg-panel-solid: #111827;
    --bg-card: #182234;
    --bg-subcard: #111827;
    --bg-hover: #243047;
    --bg-input: #0b1120;
    --border: rgba(148, 163, 184, 0.16);
    --border-strong: rgba(148, 163, 184, 0.34);
    --scroll-track: rgba(15, 23, 42, 0.55);
    --scroll-thumb: rgba(148, 163, 184, 0.45);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #38bdf8;
    --accent-bg: rgba(56, 189, 248, 0.14);
    --danger: #f43f5e;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  }

  [data-theme="light"] {
    --bg-canvas: #f8fafc;
    --bg-panel: #ffffff;
    --bg-panel-solid: #ffffff;
    --bg-card: #f8fafc;
    --bg-subcard: #ffffff;
    --bg-hover: #f1f5f9;
    --bg-input: #ffffff;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --scroll-track: #f1f5f9;
    --scroll-thumb: #94a3b8;
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --accent: #0284c7;
    --accent-bg: rgba(2, 132, 199, 0.1);
    --danger: #e11d48;
    --shadow: 0 4px 16px rgba(15, 23, 42, 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-canvas);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
  }

  #app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: row;
    overflow: hidden;
  }

  /* Left Vertical Tool Rail (RailMapGen style) */
  .left-rail {
    width: 50px;
    flex-shrink: 0;
    background: var(--bg-panel-solid);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
    z-index: 30;
  }

  .rail-brand {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  .rail-sep {
    width: 24px;
    height: 1px;
    background: var(--border);
    margin: 4px 0;
    flex-shrink: 0;
  }

  .rail-spacer {
    flex: 1;
  }

  .rail-btn {
    width: 36px;
    height: 36px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.14s;
    position: relative;
    flex-shrink: 0;
  }

  .rail-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .rail-btn span {
    font-size: 9.5px;
    line-height: 1;
    font-weight: 600;
  }

  .rail-btn:hover {
    color: var(--text-main);
    background: var(--bg-hover);
  }

  .rail-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: rgba(56, 189, 248, 0.35);
  }

  .rail-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Flyout menus opening to the RIGHT of Left Rail */
  .flyout-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flyout-menu {
    position: absolute;
    left: 100%;
    top: 0;
    margin-left: 6px;
    min-width: 156px;
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px;
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 80;
  }

  .flyout-menu.align-bottom {
    top: auto;
    bottom: 0;
  }

  /* Invisible hover bridge so moving right never closes the flyout */
  .flyout-menu::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 0;
    bottom: 0;
    width: 14px;
  }

  .flyout-wrap:hover .flyout-menu,
  .flyout-wrap.open .flyout-menu {
    display: flex;
  }

  .drop-item {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-main);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    white-space: nowrap;
  }

  .drop-item:hover {
    background: var(--bg-hover);
  }

  .drop-item.active {
    background: var(--accent-bg);
    color: var(--accent);
  }

  /* Generic Buttons */
  .btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-main);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.12s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn-primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn-danger { color: var(--danger); background: transparent; border-color: transparent; }
  .btn-danger:hover { background: rgba(244, 63, 94, 0.12); border-color: rgba(244, 63, 94, 0.25); }
  .btn-xs { padding: 2px 6px; font-size: 11px; border-radius: 5px; }

  .icon-btn {
    width: 22px;
    height: 22px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    border-radius: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-btn:hover { color: var(--text-main); background: var(--bg-hover); }
  .icon-btn.danger:hover { color: var(--danger); background: rgba(244, 63, 94, 0.12); }

  /* Workspace & Canvas */
  .workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .canvas-wrap {
    flex: 1;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }

  #metroCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Right-Sidebar Crossing / Switch Prompt Card */
  .side-prompt-box {
    background: rgba(245, 158, 11, 0.08);
    border: 1.5px solid #f59e0b;
    border-radius: 8px;
    padding: 9px 10px;
    margin: 8px 10px 2px 10px;
    display: none;
    flex-direction: column;
    gap: 7px;
  }
  .side-prompt-box.visible { display: flex; }
  .side-prompt-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-main);
  }
  .side-prompt-step {
    font-size: 10.5px;
    color: #d97706;
    font-weight: 700;
    background: rgba(245, 158, 11, 0.16);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .side-prompt-opts {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* Mode-Driven Right Sidebar Controls */
  .mode-panel {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .mode-panel-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .subbar-lbl {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }
  /* Bottom-Left Upward Flyout for Color Mode */
  .hud-flyout-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .hud-flyout-menu {
    position: absolute;
    left: 0;
    bottom: calc(100% + 6px);
    min-width: 152px;
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 4px;
    box-shadow: var(--shadow);
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 30;
  }
  .hud-flyout-wrap:hover .hud-flyout-menu,
  .hud-flyout-wrap.open .hud-flyout-menu {
    display: flex;
  }
  .hud-flyout-wrap::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: 8px;
  }
  /* Single-Route Detail View in Right Sidebar */
  .detail-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .detail-back-btn {
    border: 1px solid var(--border-strong);
    background: var(--bg-input);
    color: var(--text-main);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .detail-back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .detail-section {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .detail-sec-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .route-item.sim-readonly .route-label { cursor: default; }

  .chip-group {
    display: inline-flex;
    gap: 2px;
    background: var(--bg-input);
    padding: 2px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .chip {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .chip.active { background: var(--accent-bg); color: var(--accent); }

  .input-sm, .select-sm {
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    padding: 3px 6px;
    border-radius: 5px;
    font-size: 11.5px;
    outline: none;
  }

  .input-sm:focus, .select-sm:focus { border-color: var(--accent); }

  /* Minimal Bottom-Left & Bottom-Right HUD */
  .hud-bottom {
    position: absolute;
    left: 10px;
    bottom: 10px;
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .hud-bottom-center {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 14;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .hud-bottom-right {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .line-settings {
    padding: 6px 8px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .line-param-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .line-param-row span { min-width: 34px; }
  .line-param-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  .line-param-row strong { min-width: 44px; text-align: right; color: var(--text-main); font-size: 11px; }

  .color-popover {
    position: fixed;
    display: none;
    flex-direction: column;
    gap: 8px;
    width: 224px;
    box-sizing: border-box;
    padding: 10px;
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    box-shadow: var(--shadow);
    z-index: 60;
    font-size: 11.5px;
    color: var(--text-main);
  }
  .color-popover.visible { display: flex; }
  .loop-chip.seg-selected {
    border-color: #f59e0b !important;
    background: rgba(245, 158, 11, 0.22) !important;
    color: var(--text-main) !important;
    box-shadow: 0 0 0 1.5px rgba(245, 158, 11, 0.5);
  }
  .loop-slot-btn.gap-slot {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(244, 63, 94, 0.14);
    font-weight: 700;
    padding: 0 5px;
    width: auto;
  }
  .loop-slot-btn.gap-slot.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .cp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 11.5px;
  }
  .cp-hex-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cp-native {
    width: 28px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cp-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
  }
  .cp-swatch {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    border: 1.5px solid rgba(255,255,255,0.2);
    cursor: pointer;
  }
  .cp-swatch:hover { transform: scale(1.1); }

  .hud-pill {
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-muted);
    box-shadow: var(--shadow);
  }

  .toggle-pill { cursor: pointer; font-weight: 600; }
  .toggle-pill.active { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }

  .alert-pill {
    cursor: pointer;
    font-weight: 700;
    border-color: #f59e0b;
    color: #f59e0b;
    background: rgba(245, 158, 11, 0.12);
  }
  .alert-pill.error { border-color: var(--danger); color: var(--danger); background: rgba(244, 63, 94, 0.12); }

  /* Right Sidebar */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg-panel-solid);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 15;
    transition: width 0.18s ease;
  }

  .sidebar.collapsed { width: 0; border-left: none; }

  .side-block {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sim-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }

  .sim-metrics {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 7px;
    padding: 4px 7px;
    border-radius: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .sim-metrics strong { color: var(--text-main); }

  .list-head { display: flex; align-items: center; justify-content: space-between; }
  .list-title { font-size: 11.5px; font-weight: 700; color: var(--text-muted); }

  .line-creator {
    margin-top: 7px;
    padding: 7px;
    border-radius: 7px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    display: none;
    flex-direction: column;
    gap: 6px;
  }

  .line-creator.open { display: flex; }
  .swatch-row { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 15px; height: 15px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected { border-color: var(--text-main); }

  /* Always-scrollable Line & Route Tree */
  .tree-wrap {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: scroll;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) var(--scroll-track);
  }

  .tree-wrap::-webkit-scrollbar,
  .line-routes::-webkit-scrollbar,
  .station-chain-wrap::-webkit-scrollbar,
  .draft-nodes::-webkit-scrollbar {
    width: 7px;
    height: 7px;
  }

  .tree-wrap::-webkit-scrollbar-track,
  .line-routes::-webkit-scrollbar-track,
  .station-chain-wrap::-webkit-scrollbar-track,
  .draft-nodes::-webkit-scrollbar-track {
    background: var(--scroll-track);
    border-radius: 4px;
  }

  .tree-wrap::-webkit-scrollbar-thumb,
  .line-routes::-webkit-scrollbar-thumb,
  .station-chain-wrap::-webkit-scrollbar-thumb,
  .draft-nodes::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb);
    border-radius: 4px;
  }

  .line-group {
    flex-shrink: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .line-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 6px 7px;
    border-bottom: 1px solid var(--border);
  }

  .line-group.collapsed .line-head { border-bottom: none; }
  .line-group.collapsed .line-routes { display: none; }

  .line-title-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    flex: 1;
  }

  .line-bar { width: 4px; height: 14px; border-radius: 2px; flex-shrink: 0; cursor: pointer; }
  .line-name { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .collapse-caret {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    width: 15px;
    height: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.14s;
  }

  .collapse-caret.collapsed { transform: rotate(-90deg); }

  .line-routes {
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 220px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll-thumb) var(--scroll-track);
  }

  .route-item {
    flex-shrink: 0;
    background: var(--bg-subcard);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 7px;
  }

  .route-item.selected { border-color: var(--accent); }
  .route-item.collapsed .route-body { display: none; }

  .route-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .route-label { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; cursor: pointer; }
  .color-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; cursor: pointer; }
  .route-name { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .route-body { margin-top: 6px; }
  .route-sub { display: flex; align-items: center; justify-content: space-between; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .mini-ctrl { display: inline-flex; align-items: center; gap: 4px; }
  .mini-ctrl input[type="range"] { width: 46px; accent-color: var(--accent); }

  .station-chain-wrap {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border-strong);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    max-height: 96px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  .station-box {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--bg-card);
    border: 1.2px solid var(--border-strong);
    color: var(--text-main);
    cursor: pointer;
    white-space: nowrap;
  }

  .station-box:hover { border-color: var(--accent); background: var(--accent-bg); }
  .chain-arrow { font-size: 10.5px; color: var(--text-muted); font-weight: 700; }

  .draft-box {
    flex-shrink: 0;

<script>
(() => {
  'use strict';

  const GRID_SIZE = 20;
  const PLATFORM_WIDTH = 20;
  const TRACK_OFFSET = 20;
  const FILLET_DIST = 18;
  const PALETTE_COLORS = [
    '#0ea5e9', '#f97316', '#10b981', '#8b5cf6',
    '#f43f5e', '#eab308', '#ec4899', '#14b8a6'
  ];

  const THEME_PALETTES = {
    dark: {
      canvasBg: '#0b1120',
      gridMinor: 'rgba(148, 163, 184, 0.05)',
      gridMajor: 'rgba(148, 163, 184, 0.11)',
      platformFill: '#1e293b',
      platformStroke: 'rgba(148, 163, 184, 0.45)',
      platformText: '#e2e8f0',
      tactileLine: '#facc15',
      islandSeam: 'rgba(56, 189, 248, 0.48)',
      trackBed: '#1e293b',
      trackRail: '#475569',
      stationRail: '#64748b',
      blockLock: 'rgba(244, 63, 94, 0.42)',
      nodeFill: '#0f172a',
      nodeStroke: '#94a3b8',
      trainBody: '#0f172a',
      tbBg: 'rgba(245, 158, 11, 0.22)',
      tbBorder: '#f59e0b',
      tbText: '#fde68a',
      hudBg: 'rgba(15, 23, 42, 0.9)',
      hudText: '#7dd3fc'
    },
    light: {
      canvasBg: '#f1f5f9',
      gridMinor: 'rgba(15, 23, 42, 0.045)',
      gridMajor: 'rgba(15, 23, 42, 0.1)',
      platformFill: '#e2e8f0',
      platformStroke: '#94a3b8',
      platformText: '#0f172a',
      tactileLine: '#d97706',
      islandSeam: 'rgba(2, 132, 199, 0.55)',
      trackBed: '#cbd5e1',
      trackRail: '#64748b',
      stationRail: '#475569',
      blockLock: 'rgba(225, 29, 72, 0.28)',
      nodeFill: '#ffffff',
      nodeStroke: '#475569',
      trainBody: '#ffffff',
      tbBg: 'rgba(245, 158, 11, 0.18)',
      tbBorder: '#d97706',
      tbText: '#92400e',
      hudBg: 'rgba(255, 255, 255, 0.94)',
      hudText: '#0284c7'
    }
  };

  function dist(ax, ay, bx, by) {
    return Math.hypot(bx - ax, by - ay);
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function snapToGrid(val, grid = GRID_SIZE) {
    return Math.round(val / grid) * grid;
  }

  function snap8Dir(ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const len = Math.hypot(dx, dy);
    if (len < 1e-3) return { x: ax, y: ay, angleDeg: 0, len: 0 };
    const angle = Math.atan2(dy, dx);
    const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
    const deg = ((Math.round((snappedAngle * 180) / Math.PI) % 360) + 360) % 360;
    const step = deg % 90 !== 0 ? GRID_SIZE * Math.SQRT2 : GRID_SIZE;
    const snappedLen = Math.max(step, Math.round(len / step) * step);
    return {
      x: ax + Math.cos(snappedAngle) * snappedLen,
      y: ay + Math.sin(snappedAngle) * snappedLen,
      angleDeg: deg,
      len: snappedLen
    };
  }

  function pointToSegmentDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax;
    const dy = by - ay;
    const l2 = dx * dx + dy * dy;
    if (l2 < 1e-6) return { dist: Math.hypot(px - ax, py - ay), t: 0, x: ax, y: ay };
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    const x = ax + t * dx;
    const y = ay + t * dy;
    return { dist: Math.hypot(px - x, py - y), t, x, y };
  }

  // Build strict octilinear (0° / 45° / 90°) grid-point polyline between two grid points A and B
  function buildOctilinearPoints(ax, ay, bx, by, style = 's-bend', flipL = false) {
    const x1 = snapToGrid(ax), y1 = snapToGrid(ay);
    const x2 = snapToGrid(bx), y2 = snapToGrid(by);
    const dx = x2 - x1;
    const dy = y2 - y1;
    if (dx === 0 && dy === 0) return [{ x: x1, y: y1 }];
    const adx = Math.abs(dx);
    const ady = Math.abs(dy);
    const sx = Math.sign(dx);
    const sy = Math.sign(dy);

    // Already horizontal, vertical, or exact 45° diagonal
    if (adx === 0 || ady === 0 || adx === ady) {
      return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
    }

    if (style === 'l-bend') {
      // 图二(下): Straight + 45° Diagonal (1 corner, 135° bend)
      if (adx > ady) {
        const straight = adx - ady;
        const corner = flipL
          ? { x: x1 + sx * ady, y: y2 }
          : { x: x1 + sx * straight, y: y1 };
        return [{ x: x1, y: y1 }, corner, { x: x2, y: y2 }];
      } else {
        const straight = ady - adx;
        const corner = flipL
          ? { x: x2, y: y1 + sy * adx }
          : { x: x1, y: y1 + sy * straight };
        return [{ x: x1, y: y1 }, corner, { x: x2, y: y2 }];
      }
    } else {
      // 图二(上): S-Bend (Horizontal/Vertical -> 45° Diagonal -> Horizontal/Vertical, 2 corners at 135°)
      if (adx > ady) {
        const rem = adx - ady;
        const firstStraight = Math.floor(rem / (2 * GRID_SIZE)) * GRID_SIZE;
        const c1 = { x: x1 + sx * firstStraight, y: y1 };
        const c2 = { x: c1.x + sx * ady, y: y2 };
        const pts = [{ x: x1, y: y1 }];
        if (c1.x !== x1 || c1.y !== y1) pts.push(c1);
        if (c2.x !== x2 || c2.y !== y2) pts.push(c2);
        pts.push({ x: x2, y: y2 });
        return pts;
      } else {
        const rem = ady - adx;
        const firstStraight = Math.floor(rem / (2 * GRID_SIZE)) * GRID_SIZE;
        const c1 = { x: x1, y: y1 + sy * firstStraight };
        const c2 = { x: x2, y: c1.y + sy * adx };
        const pts = [{ x: x1, y: y1 }];
        if (c1.x !== x1 || c1.y !== y1) pts.push(c1);
        if (c2.x !== x2 || c2.y !== y2) pts.push(c2);
        pts.push({ x: x2, y: y2 });
        return pts;
      }
    }
  }

  // Exact 2D segment proper intersection check (returns { x, y, t, u } if strictly intersecting in interior)
  function segmentInteriorIntersection(ax, ay, bx, by, cx, cy, dx, dy) {
    const rX = bx - ax, rY = by - ay;
    const sX = dx - cx, sY = dy - cy;
    const denom = rX * sY - rY * sX;
    if (Math.abs(denom) < 1e-6) return null;
    const qpx = cx - ax, qpy = cy - ay;
    const t = (qpx * sY - qpy * sX) / denom;
    const u = (qpx * rY - qpy * rX) / denom;
    if (t > 0.02 && t < 0.98 && u > 0.02 && u < 0.98) {
      return { x: ax + t * rX, y: ay + t * rY, t, u };
    }
    return null;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  // =========================================================================
  // 1. TrackGraph
  // =========================================================================
  class TrackGraph {
    constructor() {
      this.nodes = new Map();
      this.edges = new Map();
      this.crossings = new Map(); // id -> { id, x, y, edgeA, edgeB, type: 'level'|'overpass'|'underpass', overEdgeId, underEdgeId }
      this.crossingByPair = new Map();
      this.nextNodeId = 1;
      this.nextEdgeId = 1;
      this.nextCrossingId = 1;
    }

    clear() {
      this.nodes.clear();
      this.edges.clear();
      this.crossings.clear();
      this.crossingByPair = new Map();
      this.nextNodeId = 1;
      this.nextEdgeId = 1;
      this.nextCrossingId = 1;
    }

    _pairKey(e1, e2) {
      return e1 < e2 ? (e1 + '|' + e2) : (e2 + '|' + e1);
    }

    rebuildCrossingIndex() {
      this.crossingByPair = new Map();
      for (const c of this.crossings.values()) {
        this.crossingByPair.set(this._pairKey(c.edgeA, c.edgeB), c);
      }
    }

    addCrossing(edgeA, edgeB, x, y, type = 'level', overEdgeId = null, underEdgeId = null) {
      const id = 'X' + (this.nextCrossingId++);
      const c = { id, x, y, edgeA, edgeB, type, overEdgeId, underEdgeId };
      this.crossings.set(id, c);
      if (!this.crossingByPair) this.crossingByPair = new Map();
      this.crossingByPair.set(this._pairKey(edgeA, edgeB), c);
      return c;
    }

    getCrossingBetween(edgeId1, edgeId2) {
      if (this.crossingByPair && this.crossingByPair.size === this.crossings.size) {
        return this.crossingByPair.get(this._pairKey(edgeId1, edgeId2)) || null;
      }
      this.rebuildCrossingIndex();
      return this.crossingByPair.get(this._pairKey(edgeId1, edgeId2)) || null;
    }

    pruneCrossingsForEdge(edgeId) {
      for (const [cid, c] of Array.from(this.crossings.entries())) {
        if (c.edgeA === edgeId || c.edgeB === edgeId) {
          this.crossings.delete(cid);
          if (this.crossingByPair) this.crossingByPair.delete(this._pairKey(c.edgeA, c.edgeB));
        }
      }
    }

    findCrossingAt(wx, wy, radius = 14) {
      let best = null, bestD = radius;
      for (const c of this.crossings.values()) {
        const d = dist(c.x, c.y, wx, wy);
        if (d < bestD) { bestD = d; best = c; }
      }
      return best;
    }

    // Detect if a point lies on/under an overpass/underpass bridge deck
    findBridgeNear(wx, wy, radius = 20) {
      for (const c of this.crossings.values()) {
        if (c.type !== 'overpass' && c.type !== 'underpass') continue;
        if (dist(c.x, c.y, wx, wy) < radius) return c;
      }
      return null;
    }

    // Automatically detect & sync EVERY exact geometric edge-edge intersection (including bend-node-on-edge bridges!)
    syncAllCrossings(defaultType = 'overpass') {
      const edgeList = Array.from(this.edges.values());
      const validPairs = new Set();
      const addedCrossings = [];
      const prevCrossings = Array.from(this.crossings.values()).map(c => ({ ...c }));

      // Helper: inherit overpass/underpass orientation from a prior crossing on the same carrier edge & adjacent moving edge
      const inheritOrientation = (eMovingId, eCarrierId) => {
        const eM = this.edges.get(eMovingId);
        if (!eM) return null;
        for (const pc of prevCrossings) {
          if (pc.edgeA !== eCarrierId && pc.edgeB !== eCarrierId) continue;
          const otherPrevId = pc.edgeA === eCarrierId ? pc.edgeB : pc.edgeA;
          const eOtherPrev = this.edges.get(otherPrevId);
          const sharesNode = eOtherPrev && (
            eOtherPrev.from === eM.from || eOtherPrev.from === eM.to ||
            eOtherPrev.to === eM.from || eOtherPrev.to === eM.to
          );
          if (otherPrevId === eMovingId || sharesNode) {
            if (pc.type === 'level') return { type: 'level', overEdgeId: null, underEdgeId: null };
            const carrierWasOver = pc.overEdgeId === eCarrierId;
            return {
              type: carrierWasOver ? 'underpass' : 'overpass',
              overEdgeId: carrierWasOver ? eCarrierId : eMovingId,
              underEdgeId: carrierWasOver ? eMovingId : eCarrierId
            };
          }
        }
        return null;
      };

      const upsertCrossing = (e1Id, e2Id, x, y, bendNodeId = null) => {
        const key = e1Id < e2Id ? `${e1Id}|${e2Id}` : `${e2Id}|${e1Id}`;
        validPairs.add(key);
        const rx = Math.round(x * 100) / 100;
        const ry = Math.round(y * 100) / 100;
        const existing = this.getCrossingBetween(e1Id, e2Id);
        if (existing) {
          existing.x = rx;
          existing.y = ry;
          if (bendNodeId) existing.bendNodeId = bendNodeId;
          else delete existing.bendNodeId;
          return existing;
        }
        const inh = inheritOrientation(e1Id, e2Id) || inheritOrientation(e2Id, e1Id);
        const cr = inh
          ? this.addCrossing(e1Id, e2Id, rx, ry, inh.type, inh.overEdgeId, inh.underEdgeId)
          : this.addCrossing(
              e1Id, e2Id, rx, ry, defaultType,
              defaultType === 'overpass' ? e1Id : null,
              defaultType === 'overpass' ? e2Id : null
            );
        if (bendNodeId) cr.bendNodeId = bendNodeId;
        if (!inh) addedCrossings.push(cr);
        return cr;
      };

      // 1. Standard interior edge-edge crossings
      for (let i = 0; i < edgeList.length; i++) {
        const e1 = edgeList[i];
        const a = this.nodes.get(e1.from), b = this.nodes.get(e1.to);
        if (!a || !b) continue;
        for (let j = i + 1; j < edgeList.length; j++) {
          const e2 = edgeList[j];
          if (e1.from === e2.from || e1.from === e2.to || e1.to === e2.from || e1.to === e2.to) continue;
          const c = this.nodes.get(e2.from), d = this.nodes.get(e2.to);
          if (!c || !d) continue;
          const hit = segmentInteriorIntersection(a.x, a.y, b.x, b.y, c.x, c.y, d.x, d.y);
          if (!hit) continue;
          upsertCrossing(e1.id, e2.id, hit.x, hit.y, null);
        }
      }

      // 2. Bend-node-on-edge crossings: a degree-2 corner node landing strictly on the interior of another track edge
      for (const bn of this.nodes.values()) {
        if (bn.isStationEnd) continue;
        const inc = this.getIncidentEdges(bn.id);
        if (inc.length !== 2) continue;
        const [eA, eB] = inc;
        for (const eCarrier of edgeList) {
          if (eCarrier.id === eA.id || eCarrier.id === eB.id) continue;
          if (eCarrier.from === bn.id || eCarrier.to === bn.id) continue;
          if (eCarrier.from === eA.from || eCarrier.from === eA.to || eCarrier.to === eA.from || eCarrier.to === eA.to) continue;
          if (eCarrier.from === eB.from || eCarrier.from === eB.to || eCarrier.to === eB.from || eCarrier.to === eB.to) continue;
          const u = this.nodes.get(eCarrier.from), v = this.nodes.get(eCarrier.to);
          if (!u || !v) continue;
          const proj = pointToSegmentDist(bn.x, bn.y, u.x, u.y, v.x, v.y);
          if (proj.dist < 3.5 && proj.t > 0.02 && proj.t < 0.98) {
            upsertCrossing(eA.id, eCarrier.id, bn.x, bn.y, bn.id);
            upsertCrossing(eB.id, eCarrier.id, bn.x, bn.y, bn.id);
          }
        }
      }

      // 3. Remove stale crossings whose edges no longer intersect
      for (const [cid, cr] of Array.from(this.crossings.entries())) {
        const key = cr.edgeA < cr.edgeB ? `${cr.edgeA}|${cr.edgeB}` : `${cr.edgeB}|${cr.edgeA}`;
        if (!validPairs.has(key)) this.crossings.delete(cid);
      }
      this.rebuildCrossingIndex();
      return addedCrossings;
    }

    // 图一两种道岔自动识别:
    // Form 1 (Y型对称道岔): deg=3, 夹角组合 {90°, 135°, 135°}
    // Form 2 (单开道岔):   deg=3, 夹角组合 {45°, 135°, 180°}
    classifyNode(nodeId) {
      const node = this.nodes.get(nodeId);
      if (!node) return 'normal';
      const inc = this.getIncidentEdges(nodeId);
      if (inc.length <= 2) return 'normal';
      if (inc.length === 3) {
        const angles = inc.map(e => {
          const other = this.nodes.get(e.from === nodeId ? e.to : e.from);
          return ((Math.atan2(other.y - node.y, other.x - node.x) * 180) / Math.PI + 360) % 360;
        }).sort((a, b) => a - b);
        const gaps = [
          angles[1] - angles[0],
          angles[2] - angles[1],
          360 - (angles[2] - angles[0])
        ].sort((a, b) => a - b);
        const isWye = Math.abs(gaps[0] - 90) < 4 && Math.abs(gaps[1] - 135) < 4 && Math.abs(gaps[2] - 135) < 4;
        const isTurnout = Math.abs(gaps[0] - 45) < 4 && Math.abs(gaps[1] - 135) < 4 && Math.abs(gaps[2] - 180) < 4;
        if (isWye || isTurnout) return 'switch';
      }
      return 'crossing';
    }

    isActiveSwitch(nodeId) {
      const n = this.nodes.get(nodeId);
      return !!(n && n.isSwitch && this.classifyNode(nodeId) === 'switch');
    }

    isSwitchAngles(angles) {
      if (angles.length !== 3) return false;
      const sorted = [...angles].sort((a, b) => a - b);
      const gaps = [
        sorted[1] - sorted[0],
        sorted[2] - sorted[1],
        360 - (sorted[2] - sorted[0])
      ].sort((a, b) => a - b);
      const isWye = Math.abs(gaps[0] - 90) < 4 && Math.abs(gaps[1] - 135) < 4 && Math.abs(gaps[2] - 135) < 4;
      const isTurnout = Math.abs(gaps[0] - 45) < 4 && Math.abs(gaps[1] - 135) < 4 && Math.abs(gaps[2] - 180) < 4;
      return isWye || isTurnout;
    }

    // Resolve collinear overlaps, mid-edge splits, switch collisions, crossings, and new switch candidates
    analyzeTrackPlacement(pts) {
      // 1. Subdivide drawn segments at any existing node lying strictly on them
      const expandedPts = [];
      const pushPt = (x, y) => {
        if (expandedPts.length === 0 || dist(expandedPts[expandedPts.length - 1].x, expandedPts[expandedPts.length - 1].y, x, y) > 1) {
          expandedPts.push({ x, y });
        }
      };
      for (let i = 0; i < pts.length - 1; i++) {
        const A = pts[i], B = pts[i + 1];
        pushPt(A.x, A.y);
        const mids = [];
        for (const n of this.nodes.values()) {
          if (dist(n.x, n.y, A.x, A.y) < 3 || dist(n.x, n.y, B.x, B.y) < 3) continue;
          const p = pointToSegmentDist(n.x, n.y, A.x, A.y, B.x, B.y);
          if (p.dist < 2 && p.t > 0.001 && p.t < 0.999) mids.push({ x: n.x, y: n.y, t: p.t });
        }
        mids.sort((a, b) => a.t - b.t);
        for (const m of mids) pushPt(m.x, m.y);
      }
      if (pts.length > 0) pushPt(pts[pts.length - 1].x, pts[pts.length - 1].y);

      // 2. Filter out collinear overlapping sub-segments (重合的就没事)
      const newSegs = [];
      for (let i = 0; i < expandedPts.length - 1; i++) {
        const P = expandedPts[i], Q = expandedPts[i + 1];
        if (dist(P.x, P.y, Q.x, Q.y) < 2) continue;
        let overlapsExisting = false;
        for (const e of this.edges.values()) {
          const u = this.nodes.get(e.from), v = this.nodes.get(e.to);
          if (!u || !v) continue;
          const pP = pointToSegmentDist(P.x, P.y, u.x, u.y, v.x, v.y);
          const pQ = pointToSegmentDist(Q.x, Q.y, u.x, u.y, v.x, v.y);
          if (pP.dist < 2 && pQ.dist < 2) {
            overlapsExisting = true;
            break;
          }
        }
        if (!overlapsExisting) {
          newSegs.push({ ax: P.x, ay: P.y, bx: Q.x, by: Q.y });
        }
      }

      if (newSegs.length === 0) {
        return { ok: true, noop: true, newSegs: [], pendingSplits: [], hits: [], switchCandidates: [] };
      }

      // 3. Reject if any genuinely NEW segment collides with an existing active switch
      for (const seg of newSegs) {
        const sw = this.wouldIntersectSwitch(seg.ax, seg.ay, seg.bx, seg.by);
        if (sw) {
          return { ok: false, reason: `不允许与道岔 ${sw.id} 相交` };
        }
      }

      // 4. Separate terminal endpoints of newSegs (which split & branch) from intermediate bend corners
      //    landing on an existing edge (which MUST prompt crossing FIRST and become implicit non-interactive bend nodes!)
      const ptKey = (x, y) => `${Math.round(x)},${Math.round(y)}`;
      const uniquePts = new Map();
      const segIndicesAtPt = new Map();
      newSegs.forEach((seg, sIdx) => {
        const kA = ptKey(seg.ax, seg.ay);
        const kB = ptKey(seg.bx, seg.by);
        uniquePts.set(kA, { x: seg.ax, y: seg.ay });
        uniquePts.set(kB, { x: seg.bx, y: seg.by });
        if (!segIndicesAtPt.has(kA)) segIndicesAtPt.set(kA, []);
        if (!segIndicesAtPt.has(kB)) segIndicesAtPt.set(kB, []);
        segIndicesAtPt.get(kA).push(sIdx);
        segIndicesAtPt.get(kB).push(sIdx);
      });

      const pendingSplits = [];
      const splitEdgeAtPt = new Map(); // ptKey -> edge
      const implicitBendPts = new Set(); // ptKey of intermediate bend corners crossing existing tracks
      const hits = [];

      for (const [k, pt] of uniquePts.entries()) {
        const touchedSegs = segIndicesAtPt.get(k) || [];
        const isIntermediateBend = touchedSegs.length >= 2;
        const existingNode = this.findNodeAt(pt.x, pt.y, 4);

        if (isIntermediateBend) {
          // Check if this intermediate bend corner lands on an existing edge interior (or non-isolated existing node)
          let crossedEdge = null;
          for (const e of this.edges.values()) {
            const u = this.nodes.get(e.from), v = this.nodes.get(e.to);
            if (!u || !v) continue;
            const p = pointToSegmentDist(pt.x, pt.y, u.x, u.y, v.x, v.y);
            if (p.dist < 2) { crossedEdge = e; break; }
          }
          if (crossedEdge || existingNode) {
            implicitBendPts.add(k);
            if (crossedEdge) {
              hits.push({
                edge: crossedEdge,
                x: pt.x,
                y: pt.y,
                isBendCrossing: true,
                bendKey: k,
                segIndices: [...touchedSegs]
              });
            }
            continue;
          }
        }

        if (existingNode) continue;
        for (const e of this.edges.values()) {
          const u = this.nodes.get(e.from), v = this.nodes.get(e.to);
          if (!u || !v) continue;
          if (dist(pt.x, pt.y, u.x, u.y) < 4 || dist(pt.x, pt.y, v.x, v.y) < 4) continue;
          const p = pointToSegmentDist(pt.x, pt.y, u.x, u.y, v.x, v.y);
          if (p.dist < 2 && p.t > 0.001 && p.t < 0.999) {
            if (e.isStationTrack) {
              return { ok: false, reason: '不可在站台到发线中间接轨' };
            }
            pendingSplits.push({ edgeId: e.id, x: pt.x, y: pt.y, t: p.t });
            splitEdgeAtPt.set(k, e);
            break;
          }
        }
      }

      // 5. Find interior crossings ONLY for genuinely new segments
      for (let i = 0; i < newSegs.length; i++) {
        const s = newSegs[i];
        const segHits = this.findSegmentIntersections(s.ax, s.ay, s.bx, s.by);
        for (const h of segHits) hits.push({ ...h, segIdx: i });
      }

      // Forbid stacking a 3rd track crossing on top of an existing bridge (strictly 2 tracks per bridge!)
      for (const h of hits) {
        if (this.findBridgeNear(h.x, h.y, 20)) {
          return { ok: false, reason: '立交桥处禁止再叠加交叉（仅允许两条轨道相交）' };
        }
      }

      // 6. Compute post-commit incident angles at every non-implicit endpoint of newSegs to detect ALL new switch candidates
      const switchCandidates = [];
      for (const [k, pt] of uniquePts.entries()) {
        if (implicitBendPts.has(k)) continue;
        const existing = this.findNodeAt(pt.x, pt.y, 4);
        const existingInc = existing ? this.getIncidentEdges(existing.id) : [];
        if (existing && existingInc.length >= 3) continue; // already >=3

        const angles = [];
        const pushAngle = (tx, ty) => {
          const ang = ((Math.atan2(ty - pt.y, tx - pt.x) * 180) / Math.PI + 360) % 360;
          if (!angles.some(a => Math.min(Math.abs(a - ang), 360 - Math.abs(a - ang)) < 2.5)) {
            angles.push(ang);
          }
        };
        if (existing) {
          for (const e of existingInc) {
            const other = this.nodes.get(e.from === existing.id ? e.to : e.from);
            if (other) pushAngle(other.x, other.y);
          }
        } else if (splitEdgeAtPt.has(k)) {
          const e = splitEdgeAtPt.get(k);
          const u = this.nodes.get(e.from), v = this.nodes.get(e.to);
          if (u) pushAngle(u.x, u.y);
          if (v) pushAngle(v.x, v.y);
        }
        for (const seg of newSegs) {
          if (dist(seg.ax, seg.ay, pt.x, pt.y) < 3) pushAngle(seg.bx, seg.by);
          else if (dist(seg.bx, seg.by, pt.x, pt.y) < 3) pushAngle(seg.ax, seg.ay);
        }
        if (this.isSwitchAngles(angles)) {
          if (this.findBridgeNear(pt.x, pt.y, 20)) {
            return { ok: false, reason: '禁止在立交桥上下方开设道岔' };
          }
          switchCandidates.push({
            id: existing ? existing.id : null,
            x: pt.x,
            y: pt.y
          });
        }
      }

      return { ok: true, noop: false, newSegs, pendingSplits, hits, switchCandidates, implicitBendPts };
    }

    // Reject drawing a segment that touches or crosses an existing switch (不可以与道岔相交!)
    wouldIntersectSwitch(ax, ay, bx, by) {
      for (const n of this.nodes.values()) {
        if (!this.isActiveSwitch(n.id)) continue;
        // Check if segment passes through switch interior or tries to attach a 4th edge to a switch
        const p = pointToSegmentDist(n.x, n.y, ax, ay, bx, by);
        if (p.dist < 8) {
          // Allow only if the segment is already an existing edge incident to this switch
          const nA = this.findNodeAt(ax, ay, 4);
          const nB = this.findNodeAt(bx, by, 4);
          if (nA && nB && this.getEdgeBetween(nA.id, nB.id)) continue;
          return n;
        }
      }
      return null;
    }

    // Detect visual interior intersections with existing edges
    findSegmentIntersections(ax, ay, bx, by) {
      const hits = [];
      for (const e of this.edges.values()) {
        const c = this.nodes.get(e.from);
        const d = this.nodes.get(e.to);
        if (!c || !d) continue;
        const hit = segmentInteriorIntersection(ax, ay, bx, by, c.x, c.y, d.x, d.y);
        if (hit) hits.push({ edge: e, x: hit.x, y: hit.y });
      }
      return hits;
    }

    addNode(x, y, meta = {}) {
      const gx = snapToGrid(x);
      const gy = snapToGrid(y);
      if (!meta.forceNew) {
        for (const n of this.nodes.values()) {
          if (n.isImplicit) continue;
          if (dist(n.x, n.y, gx, gy) < 4) {
            Object.assign(n, meta);
            return n;
          }
        }
      }
      const id = 'N' + (this.nextNodeId++);
      const node = {
        id,
        x: gx,
        y: gy,
        label: meta.label || '',
        isStationEnd: !!meta.isStationEnd,
        platformId: meta.platformId || null,
        isSwitch: meta.isSwitch !== undefined ? !!meta.isSwitch : true,
        isImplicit: !!meta.isImplicit,
        lockedBy: null
      };
      this.nodes.set(id, node);
      return node;
    }

    getNode(id) {
      return this.nodes.get(id) || null;
    }

    findNodeAt(wx, wy, radius = 14, includeImplicit = false) {
      let best = null;
      let bestD = radius;
      for (const n of this.nodes.values()) {
        if (!includeImplicit && n.isImplicit) continue;
        const d = dist(n.x, n.y, wx, wy);
        if (d < bestD) {
          bestD = d;
          best = n;
        }
      }
      return best;
    }

    getEdgeBetween(n1Id, n2Id) {
      for (const e of this.edges.values()) {
        if ((e.from === n1Id && e.to === n2Id) || (e.from === n2Id && e.to === n1Id)) return e;
      }
      return null;
    }

    addEdge(fromId, toId, meta = {}) {
      if (fromId === toId) return null;
      const existing = this.getEdgeBetween(fromId, toId);
      if (existing) {
        if (meta.isStationTrack) {
          existing.isStationTrack = true;
          existing.platformId = meta.platformId;
          existing.platformLength = meta.platformLength;
        }
        return existing;
      }
      const a = this.nodes.get(fromId);
      const b = this.nodes.get(toId);
      if (!a || !b) return null;
      const id = 'E' + (this.nextEdgeId++);
      const edge = {
        id,
        from: fromId,
        to: toId,
        length: dist(a.x, a.y, b.x, b.y),
        isStationTrack: !!meta.isStationTrack,
        platformId: meta.platformId || null,
        platformLength: meta.platformLength || 0,
        bendStyle: meta.bendStyle || 'l-bend',
        flipL: !!meta.flipL,
        lockedBy: null
      };
      this.edges.set(id, edge);
      return edge;
    }

    updateNodePosition(nodeId, x, y) {
      const n = this.nodes.get(nodeId);
      if (!n) return;
      n.x = Math.round(x * 100) / 100;
      n.y = Math.round(y * 100) / 100;
      for (const e of this.getIncidentEdges(nodeId)) {
        const a = this.nodes.get(e.from);
        const b = this.nodes.get(e.to);
        if (a && b) e.length = dist(a.x, a.y, b.x, b.y);
      }
    }

    removeNode(nodeId) {
      if (!this.nodes.has(nodeId)) return;
      for (const e of this.getIncidentEdges(nodeId)) {
        this.edges.delete(e.id);
      }
      this.nodes.delete(nodeId);
    }

    removeEdge(edgeId) {
      const e = this.edges.get(edgeId);
      if (!e) return;
      this.pruneCrossingsForEdge(edgeId);
      this.edges.delete(edgeId);
      [e.from, e.to].forEach(nid => {
        if (this.getIncidentEdges(nid).length === 0) this.nodes.delete(nid);
      });
    }

    getIncidentEdges(nodeId) {
      const list = [];
      for (const e of this.edges.values()) {
        if (e.from === nodeId || e.to === nodeId) list.push(e);
      }
      return list;
    }

    getNeighbors(nodeId) {
      const res = [];
      for (const e of this.edges.values()) {
        if (e.from === nodeId) res.push({ nodeId: e.to, edge: e });
        else if (e.to === nodeId) res.push({ nodeId: e.from, edge: e });
      }
      return res;
    }

    findEdgeAt(wx, wy, threshold = 10) {
      let best = null;
      let bestD = threshold;
      let bestProj = null;
      for (const e of this.edges.values()) {
        const a = this.nodes.get(e.from);
        const b = this.nodes.get(e.to);
        if (!a || !b) continue;
        const p = pointToSegmentDist(wx, wy, a.x, a.y, b.x, b.y);
        if (p.dist < bestD) {
          bestD = p.dist;
          best = e;
          bestProj = p;
        }
      }
      return best ? { edge: best, proj: bestProj } : null;
    }

    splitEdgeAt(edgeId, wx, wy) {
      const e = this.edges.get(edgeId);
      if (!e || e.isStationTrack) return null;
      const a = this.nodes.get(e.from);
      const b = this.nodes.get(e.to);
      const proj = pointToSegmentDist(wx, wy, a.x, a.y, b.x, b.y);
      if (proj.t < 0.001 || proj.t > 0.999) return null;
      const gx = snapToGrid(proj.x), gy = snapToGrid(proj.y);
      if (dist(gx, gy, a.x, a.y) < 4 || dist(gx, gy, b.x, b.y) < 4) return null;
      const mid = this.addNode(gx, gy);
      this.edges.delete(edgeId);
      const e1 = this.addEdge(a.id, mid.id);
      const e2 = this.addEdge(mid.id, b.id);
      // Reassign any existing crossings on edgeId to whichever half-edge intersects the other edge
      for (const c of this.crossings.values()) {
        if (c.edgeA === edgeId || c.edgeB === edgeId) {
          const otherId = c.edgeA === edgeId ? c.edgeB : c.edgeA;
          const other = this.edges.get(otherId);
          if (!other) continue;
          const oa = this.nodes.get(other.from), ob = this.nodes.get(other.to);
          if (!oa || !ob) continue;
          const hit1 = segmentInteriorIntersection(a.x, a.y, mid.x, mid.y, oa.x, oa.y, ob.x, ob.y);
          const hit2 = segmentInteriorIntersection(mid.x, mid.y, b.x, b.y, oa.x, oa.y, ob.x, ob.y);
          const targetId = hit1 ? e1.id : e2.id;
          if (c.edgeA === edgeId) c.edgeA = targetId;
          if (c.edgeB === edgeId) c.edgeB = targetId;
          if (c.overEdgeId === edgeId) c.overEdgeId = targetId;
          if (c.underEdgeId === edgeId) c.underEdgeId = targetId;
          if (!hit1 && !hit2 && dist(mid.x, mid.y, c.x, c.y) < 4) {
            c.bendNodeId = mid.id;
          }
        }
      }
      this.rebuildCrossingIndex();
      return { node: mid, oldFrom: a.id, oldTo: b.id, e1, e2 };
    }

    findShortestPath(startId, targetId) {
      if (startId === targetId) return [startId];
      const visited = new Set([startId]);
      const queue = [[startId]];
      while (queue.length > 0) {
        const path = queue.shift();
        const curr = path[path.length - 1];
        for (const nb of this.getNeighbors(curr)) {
          if (nb.nodeId === targetId) return [...path, nb.nodeId];
          if (!visited.has(nb.nodeId)) {
            visited.add(nb.nodeId);
            queue.push([...path, nb.nodeId]);
          }
        }
      }
      return null;
    }

    // Physics-aware rail pathfinder (Dijkstra on (nodeId, prevNodeId)):
    // - Prefers smooth forward track (>=88°) by actual physical distance
    // - Allows clean dead-end turnback reversals (degree === 1)
    // - Strictly avoids illegal <88° acute switch V-turns and spurious mid-line U-turns!
    findRailPath(startId, targetId, incomingPrevId = null) {
      if (startId === targetId) return [startId];
      const startKey = `${startId}|${incomingPrevId || ''}`;
      const bestCost = new Map([[startKey, 0]]);
      const parent = new Map();
      const pq = [{ cost: 0, curr: startId, prev: incomingPrevId, key: startKey }];

      let bestGoalKey = null;
      let bestGoalCost = Infinity;

      while (pq.length > 0) {
        // Pop minimum-cost state
        let minIdx = 0;
        for (let i = 1; i < pq.length; i++) {
          if (pq[i].cost < pq[minIdx].cost) minIdx = i;
        }
        const state = pq.splice(minIdx, 1)[0];
        if (state.cost > (bestCost.get(state.key) ?? Infinity)) continue;
        if (state.cost >= bestGoalCost) break;

        if (state.curr === targetId) {
          bestGoalCost = state.cost;
          bestGoalKey = state.key;
          continue;
        }

        const currNode = this.nodes.get(state.curr);
        if (!currNode) continue;
        const neighbors = this.getNeighbors(state.curr);
        const isDeadEnd = neighbors.length === 1;

        for (const nb of neighbors) {
          let stepCost = nb.edge.length;
          if (state.prev) {
            if (nb.nodeId === state.prev) {
              // Reversal on same track: normal at dead-end stub, heavily discouraged mid-line
              stepCost += isDeadEnd ? 40 : 60000;
            } else {
              const pNode = this.nodes.get(state.prev);
              const nNode = this.nodes.get(nb.nodeId);
              const l1 = dist(pNode.x, pNode.y, currNode.x, currNode.y) || 1;
              const l2 = dist(nNode.x, nNode.y, currNode.x, currNode.y) || 1;
              const dot = clamp(
                ((pNode.x - currNode.x) / l1) * ((nNode.x - currNode.x) / l2) +
                ((pNode.y - currNode.y) / l1) * ((nNode.y - currNode.y) / l2),
                -1, 1
              );
              const deg = (Math.acos(dot) * 180) / Math.PI;
              if (deg < 133) {
                // Strict railway switch rule: only >= 135° transitions allowed!
                continue;
              }
              if (neighbors.length >= 3 && !this.isActiveSwitch(state.curr)) {
                // Dead-end / non-switch junction: trains cannot pass through!
                continue;
              }
            }
          }

          const nextKey = `${nb.nodeId}|${state.curr}`;
          const nextCost = state.cost + stepCost;
          if (nextCost < (bestCost.get(nextKey) ?? Infinity)) {
            bestCost.set(nextKey, nextCost);
            parent.set(nextKey, state.key);
            pq.push({ cost: nextCost, curr: nb.nodeId, prev: state.curr, key: nextKey });
          }
        }
      }

      if (!bestGoalKey) {
        // Fallback to plain BFS only if no legal rail path exists
        return this.findShortestPath(startId, targetId);
      }

      const path = [];
      let k = bestGoalKey;
      while (k) {
        path.push(k.split('|')[0]);
        k = parent.get(k);
      }
      path.reverse();
      return path;
    }

    computeTrackFilletData() {
      const trims = new Map();
      for (const e of this.edges.values()) trims.set(e.id, { startTrim: 0, endTrim: 0 });
      const curves = [];

      for (const node of this.nodes.values()) {
        const inc = this.getIncidentEdges(node.id);
        if (inc.length < 2) continue;

        if (inc.length === 2) {
          const [e1, e2] = inc;
          const o1 = this.nodes.get(e1.from === node.id ? e1.to : e1.from);
          const o2 = this.nodes.get(e2.from === node.id ? e2.to : e2.from);
          const u1x = (o1.x - node.x) / e1.length;
          const u1y = (o1.y - node.y) / e1.length;
          const u2x = (o2.x - node.x) / e2.length;
          const u2y = (o2.y - node.y) / e2.length;
          const angle = Math.acos(clamp(u1x * u2x + u1y * u2y, -1, 1));
          const minConnRad = (133 * Math.PI) / 180;
          if (angle < Math.PI - 0.08 && angle >= minConnRad) {
            const d = Math.min(FILLET_DIST, e1.length * 0.36, e2.length * 0.36);
            if (e1.from === node.id) trims.get(e1.id).startTrim = Math.max(trims.get(e1.id).startTrim, d);
            else trims.get(e1.id).endTrim = Math.max(trims.get(e1.id).endTrim, d);
            if (e2.from === node.id) trims.get(e2.id).startTrim = Math.max(trims.get(e2.id).startTrim, d);
            else trims.get(e2.id).endTrim = Math.max(trims.get(e2.id).endTrim, d);
            curves.push({
              p0: { x: node.x + u1x * d, y: node.y + u1y * d },
              ctrl: { x: node.x, y: node.y },
              p1: { x: node.x + u2x * d, y: node.y + u2y * d },
              edgeA: e1,
              edgeB: e2
            });
          }
        } else if (this.isActiveSwitch(node.id)) {
          const minConnRad = (133 * Math.PI) / 180;
          for (let i = 0; i < inc.length; i++) {
            for (let j = i + 1; j < inc.length; j++) {
              const e1 = inc[i];
              const e2 = inc[j];
              const o1 = this.nodes.get(e1.from === node.id ? e1.to : e1.from);
              const o2 = this.nodes.get(e2.from === node.id ? e2.to : e2.from);
              const u1x = (o1.x - node.x) / e1.length;
              const u1y = (o1.y - node.y) / e1.length;
              const u2x = (o2.x - node.x) / e2.length;
              const u2y = (o2.y - node.y) / e2.length;
              const angle = Math.acos(clamp(u1x * u2x + u1y * u2y, -1, 1));
              // Only smooth genuinely connected >=135° paths (never smooth 90°/45° non-connected angles!)
              if (angle < Math.PI - 0.12 && angle >= minConnRad) {
                const d = Math.min(FILLET_DIST * 0.9, e1.length * 0.34, e2.length * 0.34);
                curves.push({
                  p0: { x: node.x + u1x * d, y: node.y + u1y * d },
                  ctrl: { x: node.x, y: node.y },
                  p1: { x: node.x + u2x * d, y: node.y + u2y * d },
                  edgeA: e1,
                  edgeB: e2
                });
              }
            }
          }
        }
      }
      return { trims, curves };
    }
  }

  // =========================================================================
  // 2. PlatformManager
  // =========================================================================
  class PlatformManager {
    constructor(trackGraph) {
      this.graph = trackGraph;
      this.platforms = new Map();
      this.nextId = 1;
    }

    clear() {
      this.platforms.clear();
      this.nextId = 1;
    }

    addPlatform(cx, cy, length = 180, angleDeg = 0, name = '') {
      const id = 'P' + (this.nextId++);
      const rad = (angleDeg * Math.PI) / 180;
      const platform = {
        id,
        name: name || ('站台 ' + id.slice(1)),
        cx,
        cy,
        length,
        width: PLATFORM_WIDTH,
        angleDeg,
        rad,
        sides: {
          '-1': { type: null, refId: null },
          '1': { type: null, refId: null }
        }
      };
      this.platforms.set(id, platform);
      return platform;
    }

    getPlatform(id) {
      return this.platforms.get(id) || null;
    }

    getBasis(p) {
      const tx = Math.cos(p.rad);
      const ty = Math.sin(p.rad);
      return { tx, ty, nx: -ty, ny: tx };
    }

    getSnapPoints(p) {
      const { nx, ny } = this.getBasis(p);
      const halfW = p.width / 2;
      return [-1, 1].map(side => ({
        platformId: p.id,
        side,
        x: p.cx + nx * halfW * side,
        y: p.cy + ny * halfW * side,
        occupied: p.sides[String(side)].type !== null
      }));
    }

    findPlatformAt(wx, wy, preferredId = null) {
      const hitTest = (p) => {
        const { tx, ty, nx, ny } = this.getBasis(p);
        const dx = wx - p.cx;
        const dy = wy - p.cy;
        const lx = dx * tx + dy * ty;
        const ly = dx * nx + dy * ny;
        return Math.abs(lx) <= p.length / 2 + 4 && Math.abs(ly) <= p.width / 2 + 4;
      };
      if (preferredId) {
        const pref = this.platforms.get(preferredId);
        if (pref && hitTest(pref)) return pref;
      }
      // Check higher zLayer platforms first (1 -> 0 -> -1)
      const ordered = Array.from(this.platforms.values()).sort((a, b) => (b.zLayer || 0) - (a.zLayer || 0));
      for (const p of ordered) {
        if (hitTest(p)) return p;
      }
      return null;
    }

    movePlatformGroup(platformId, dx, dy) {
      const base = this.platforms.get(platformId);
      if (!base) return;
      const visited = new Set([base.id]);
      const queue = [base];
      const movedNodeIds = new Set();
      while (queue.length > 0) {
        const p = queue.shift();
        p.cx = Math.round((p.cx + dx) * 100) / 100;
        p.cy = Math.round((p.cy + dy) * 100) / 100;
        [-1, 1].forEach(side => {
          const info = p.sides[String(side)];
          if (info.type === 'platform' && info.refId && !visited.has(info.refId)) {
            const sib = this.platforms.get(info.refId);
            if (sib) {
              visited.add(sib.id);
              queue.push(sib);
            }
          } else if (info.type === 'track' && info.refId) {
            const edge = this.graph.edges.get(info.refId);
            if (edge) {
              [edge.from, edge.to].forEach(nid => {
                if (!movedNodeIds.has(nid)) {
                  movedNodeIds.add(nid);
                  const n = this.graph.getNode(nid);
                  if (n) this.graph.updateNodePosition(nid, n.x + dx, n.y + dy);
                }
              });
            }
          }
        });
      }
    }

    removePlatform(platformId) {
      const p = this.platforms.get(platformId);
      if (!p) return;
      [-1, 1].forEach(side => {
        const info = p.sides[String(side)];
        if (info.type === 'platform' && info.refId) {
          const sib = this.platforms.get(info.refId);
          if (sib) sib.sides[String(-side)] = { type: null, refId: null };
        } else if (info.type === 'track' && info.refId) {
          const edge = this.graph.edges.get(info.refId);
          if (edge) {
            edge.isStationTrack = false;
            edge.platformId = null;
            edge.platformLength = 0;
            [edge.from, edge.to].forEach(nid => {
              const nd = this.graph.getNode(nid);
              if (nd && !this.graph.getIncidentEdges(nid).some(ie => ie.isStationTrack)) {
                nd.isStationEnd = false;
                delete nd.platformId;
              }
            });
          }
        }
      });
      this.platforms.delete(platformId);
    }

    findSnapPointAt(wx, wy, radius = 13) {
      let best = null;
      let bestD = radius;
      for (const p of this.platforms.values()) {
        for (const sp of this.getSnapPoints(p)) {
          const d = dist(sp.x, sp.y, wx, wy);
          if (d < bestD) {
            bestD = d;
            best = sp;
          }
        }
      }
      return best;
    }

    snapPlatform(platformId, side, newLength, newName = '') {
      const base = this.platforms.get(platformId);
      if (!base || base.sides[String(side)].type !== null) return null;
      const { nx, ny } = this.getBasis(base);
      const created = this.addPlatform(
        base.cx + nx * base.width * side,
        base.cy + ny * base.width * side,
        newLength,
        base.angleDeg,
        newName || (base.name + '·换乘侧')
      );
      base.sides[String(side)] = { type: 'platform', refId: created.id };
      created.sides[String(-side)] = { type: 'platform', refId: base.id };
      return created;
    }

    generateStationTrack(platformId, side) {
      const p = this.platforms.get(platformId);
      if (!p || p.sides[String(side)].type !== null) return null;
      const { tx, ty, nx, ny } = this.getBasis(p);
      const isDiag = p.angleDeg % 90 !== 0;
      const trackOff = isDiag ? TRACK_OFFSET * Math.SQRT2 : TRACK_OFFSET;
      const rawCx = p.cx + nx * trackOff * side;
      const rawCy = p.cy + ny * trackOff * side;
      let n1x, n1y, n2x, n2y;
      if (!isDiag) {
        // Exact integer grid endpoints for any multiple-of-20 length (120=6g, 180=9g, 240=12g)!
        const gridSteps = Math.max(2, Math.round(p.length / GRID_SIZE));
        const ux = Math.round(tx), uy = Math.round(ty);
        n1x = snapToGrid(rawCx - ux * (p.length / 2));
        n1y = snapToGrid(rawCy - uy * (p.length / 2));
        n2x = n1x + ux * gridSteps * GRID_SIZE;
        n2y = n1y + uy * gridSteps * GRID_SIZE;
        // Align platform visual center with track midpoint so train & platform match 100% flush
        p.cx = (n1x + n2x) / 2 - nx * trackOff * side;
        p.cy = (n1y + n2y) / 2 - ny * trackOff * side;
      } else {
        const halfSteps = Math.max(2, Math.round((p.length / 2) / (GRID_SIZE * Math.SQRT2)));
        const baseCx = snapToGrid(rawCx), baseCy = snapToGrid(rawCy);
        const sx = Math.sign(tx) * GRID_SIZE, sy = Math.sign(ty) * GRID_SIZE;
        n1x = baseCx - sx * halfSteps; n1y = baseCy - sy * halfSteps;
        n2x = baseCx + sx * halfSteps; n2y = baseCy + sy * halfSteps;
      }
      const n1 = this.graph.addNode(n1x, n1y, { isStationEnd: true, platformId: p.id });
      const n2 = this.graph.addNode(n2x, n2y, { isStationEnd: true, platformId: p.id });
      const edge = this.graph.addEdge(n1.id, n2.id, {
        isStationTrack: true,
        platformId: p.id,
        platformLength: p.length
      });
      p.sides[String(side)] = { type: 'track', refId: edge.id };
      return { edge, n1, n2 };
    }

    getConnectedPlatformIds(platformId) {
      const visited = new Set([platformId]);
      const queue = [platformId];
      while (queue.length > 0) {
        const cur = this.platforms.get(queue.shift());
        if (!cur) continue;
        [-1, 1].forEach(sDir => {
          const info = cur.sides[String(sDir)];
          if (info.type === 'platform' && info.refId && !visited.has(info.refId)) {
            visited.add(info.refId);
            queue.push(info.refId);
          }
        });
      }
      return visited;
    }

    wouldOverlapOtherPlatform(cx, cy, length, rad, ignoreIds) {
      const tx = Math.cos(rad), ty = Math.sin(rad);
      const nx = -ty, ny = tx;
      for (const other of this.platforms.values()) {
        if (ignoreIds.has(other.id)) continue;
        // Project center delta onto candidate platform local frame
        const dx = other.cx - cx;
        const dy = other.cy - cy;
        const lx = Math.abs(dx * tx + dy * ty);
        const ly = Math.abs(dx * nx + dy * ny);
        const halfL = (length + other.length) / 2 - 4;
        const halfW = (PLATFORM_WIDTH + other.width) / 2 - 4;
        if (lx < halfL && ly < halfW) return other;
      }
      return null;
    }

    // Detect if platform `p` spatially overlaps any other non-sibling platform OR any non-bound track edge
    findPlatformOverlaps(p) {
      if (!p) return { platforms: [], edges: [] };
      const ignoreIds = this.getConnectedPlatformIds(p.id);
      const hitPlatforms = [];
      const hitEdges = [];
      const tx = Math.cos(p.rad), ty = Math.sin(p.rad);
      const nx = -ty, ny = tx;
      const halfL = p.length / 2 - 2;
      const halfW = p.width / 2 - 1;
      const ptInPlat = (wx, wy) => {
        const dx = wx - p.cx, dy = wy - p.cy;
        const lx = Math.abs(dx * tx + dy * ty);
        const ly = Math.abs(dx * nx + dy * ny);
        return lx < halfL && ly < halfW;
      };

      // 1. Platform vs Platform
      for (const other of this.platforms.values()) {
        if (ignoreIds.has(other.id)) continue;
        const otx = Math.cos(other.rad), oty = Math.sin(other.rad);
        const onx = -oty, ony = otx;
        const ohl = other.length / 2 - 2, ohw = other.width / 2 - 1;
        let hit = false;
        for (let k = -4; k <= 4 && !hit; k++) {
          const sx = other.cx + otx * (ohl * k / 4);
          const sy = other.cy + oty * (ohl * k / 4);
          if (ptInPlat(sx, sy) || ptInPlat(sx + onx * ohw, sy + ony * ohw) || ptInPlat(sx - onx * ohw, sy - ony * ohw)) {
            hit = true;
          }
        }
        if (hit) hitPlatforms.push(other);
      }

      // 2. Platform vs Track edges (excluding tracks bound to this platform)
      for (const ed of this.graph.edges.values()) {
        if (ed.platformId === p.id) continue;
        const a = this.graph.getNode(ed.from), b = this.graph.getNode(ed.to);
        if (!a || !b) continue;
        const steps = Math.max(4, Math.ceil((ed.length || 1) / 14));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          if (ptInPlat(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)) {
            hitEdges.push(ed);
            break;
          }
        }
      }
      return { platforms: hitPlatforms, edges: hitEdges };
    }

    hasBoundTrackInGroup(platformId) {
      const ids = this.getConnectedPlatformIds(platformId);
      for (const pid of ids) {
        const pl = this.platforms.get(pid);
        if (!pl) continue;
        if (pl.sides['-1'].type === 'track' || pl.sides['1'].type === 'track') return true;
      }
      return false;
    }

    // Check if an existing straight edge has the same direction as platform `p` AND length >= p.length
    // Rule 2: if edge is already a station track, ONLY allow exact same length (±6) to avoid overwriting/breaking existing station
    isEdgeEligibleForSnap(p, edge) {
      if (!p || !edge) return false;
      if (edge.isStationTrack && Math.abs(edge.length - p.length) > 6) return false;
      if (edge.length < p.length - 2) return false;
      const a = this.graph.getNode(edge.from);
      const b = this.graph.getNode(edge.to);
      if (!a || !b) return false;
      const len = edge.length || 1;
      const etx = (b.x - a.x) / len;
      const ety = (b.y - a.y) / len;
      const ptx = Math.cos(p.rad);
      const pty = Math.sin(p.rad);
      return Math.abs(etx * ptx + ety * pty) > 0.985;
    }

    // Respect the platform's own orientation & chosen snap side direction; supports sliding along longer edges >= p.length
    computeSnapToEdgePose(p, side, edge, cursorWorld = null) {
      const a = this.graph.getNode(edge.from);
      const b = this.graph.getNode(edge.to);
      if (!a || !b) return null;
      const len = edge.length || 1;
      const etx = (b.x - a.x) / len;
      const ety = (b.y - a.y) / len;
      const edgeRad = Math.atan2(ety, etx);

      let sCenter = len / 2;
      if (cursorWorld && len > p.length + 6) {
        const rawS = (cursorWorld.x - a.x) * etx + (cursorWorld.y - a.y) * ety;
        const halfL = p.length / 2;
        const isAxis = Math.abs(etx) > 0.98 || Math.abs(ety) > 0.98;
        const step = isAxis ? GRID_SIZE : (GRID_SIZE * Math.SQRT2);
        const maxStart = Math.max(0, len - p.length);
        const snappedStart = clamp(Math.round((rawS - halfL) / step) * step, 0, maxStart);
        sCenter = snappedStart + halfL;
      }
      const mx = a.x + etx * sCenter;
      const my = a.y + ety * sCenter;

      // Align edge direction with platform's current tangent so platform keeps its facing direction
      const ptx = Math.cos(p.rad);
      const pty = Math.sin(p.rad);
      const alignedRad = (ptx * etx + pty * ety) >= 0 ? edgeRad : (edgeRad + Math.PI);
      const normRad = ((alignedRad % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

      // Platform normal points toward side = +1; placing track at side puts platform center at M - pNormal * TRACK_OFFSET * side
      const pnx = -Math.sin(normRad);
      const pny = Math.cos(normRad);
      const newCx = mx - pnx * TRACK_OFFSET * side;
      const newCy = my - pny * TRACK_OFFSET * side;
      const newAngleDeg = Math.round(((normRad * 180) / Math.PI) % 360);
      const ignoreIds = this.getConnectedPlatformIds(p.id);
      const overlap = this.wouldOverlapOtherPlatform(newCx, newCy, p.length, normRad, ignoreIds);
      return { cx: newCx, cy: newCy, rad: normRad, angleDeg: newAngleDeg, pnx, pny, overlap, sCenter, etx, ety };
    }

    snapPlatformToEdge(platformId, side, edgeId, routesManager = null, cursorWorld = null) {
      const p = this.platforms.get(platformId);
      const origEdge = this.graph.edges.get(edgeId);
      if (!p || !origEdge) return { ok: false, reason: '站台或轨道无效' };
      if (p.sides[String(side)].type !== null) return { ok: false, reason: '该侧设线点已被占用' };
      if (this.hasBoundTrackInGroup(p.id)) {
        return { ok: false, reason: '该站台组已绑定站线，禁止整组平移吸附；请改用「生成站线」或先删除原站线' };
      }
      if (!this.isEdgeEligibleForSnap(p, origEdge)) {
        return { ok: false, reason: `需要与站台同向且长度 ≥ ${p.length}m 的直线轨道` };
      }

      const pose = this.computeSnapToEdgePose(p, side, origEdge, cursorWorld);
      if (!pose) return { ok: false, reason: '无法计算吸附位置' };
      if (pose.overlap) {
        return { ok: false, reason: `该方向会与「${pose.overlap.name}」重叠，请改用站台另一侧设线点` };
      }

      // If the straight edge is longer than the platform, split cleanly at the two platform endpoints while preserving all routes!
      let targetEdge = origEdge;
      const origLen = origEdge.length;
      if (origLen > p.length + 6) {
        const aNode = this.graph.getNode(origEdge.from);
        const sStart = clamp(pose.sCenter - p.length / 2, 0, origLen);
        const sEnd = clamp(pose.sCenter + p.length / 2, 0, origLen);
        const p1x = aNode.x + pose.etx * sStart, p1y = aNode.y + pose.ety * sStart;
        const p2x = aNode.x + pose.etx * sEnd, p2y = aNode.y + pose.ety * sEnd;
        let currEdge = origEdge;
        if (sStart > 4) {
          const sp1 = this.graph.splitEdgeAt(currEdge.id, p1x, p1y);
          if (sp1) {
            if (routesManager) routesManager.handleEdgeSplit(sp1.oldFrom, sp1.oldTo, sp1.node.id);
            currEdge = sp1.e2;
          }
        }
        if (origLen - sEnd > 4) {
          const sp2 = this.graph.splitEdgeAt(currEdge.id, p2x, p2y);
          if (sp2) {
            if (routesManager) routesManager.handleEdgeSplit(sp2.oldFrom, sp2.oldTo, sp2.node.id);
            currEdge = sp2.e1;
          }
        }
        targetEdge = currEdge;
      }

      // Move base platform to the track side
      p.cx = pose.cx;
      p.cy = pose.cy;
      p.rad = pose.rad;
      p.angleDeg = pose.angleDeg;

      // Also move any directly snapped sibling platforms rigidly along the normal
      const visited = new Set([p.id]);
      const queue = [{ plat: p, offsetSteps: 0 }];
      while (queue.length > 0) {
        const { plat, offsetSteps } = queue.shift();
        [-1, 1].forEach(sDir => {
          const info = plat.sides[String(sDir)];
          if (info.type === 'platform' && info.refId && !visited.has(info.refId)) {
            const sib = this.platforms.get(info.refId);
            if (sib) {
              visited.add(sib.id);
              const nextSteps = offsetSteps + sDir;
              sib.cx = pose.cx + pose.pnx * (nextSteps * PLATFORM_WIDTH);
              sib.cy = pose.cy + pose.pny * (nextSteps * PLATFORM_WIDTH);
              sib.rad = pose.rad;
              sib.angleDeg = pose.angleDeg;
              queue.push({ plat: sib, offsetSteps: nextSteps });
            }
          }
        });
      }

      // Bind exact station-length edge to platform
      p.sides[String(side)] = { type: 'track', refId: targetEdge.id };
      targetEdge.isStationTrack = true;
      targetEdge.platformId = p.id;
      targetEdge.platformLength = p.length;
      const n1 = this.graph.getNode(targetEdge.from);
      const n2 = this.graph.getNode(targetEdge.to);
      if (n1) { n1.isStationEnd = true; n1.platformId = p.id; }
      if (n2) { n2.isStationEnd = true; n2.platformId = p.id; }
      return { ok: true, platform: p, edge: targetEdge };
    }
  }

  // =========================================================================
  // 3. MetroLine, Route & RouteManager (Line -> Subordinate Routes Hierarchy)
  // =========================================================================
  class MetroLine {
    constructor(id, name, color, opts = {}) {
      this.id = id;
      this.name = name;
      this.color = color;
      this.visible = true;
      this.speedKmh = typeof opts.speedKmh === 'number' ? opts.speedKmh : 80;
      this.dwellSec = typeof opts.dwellSec === 'number' ? opts.dwellSec : 1.8;
      this.turnbackSec = typeof opts.turnbackSec === 'number' ? opts.turnbackSec : 2.5;
    }
  }

  class Route {
    constructor(id, lineId, name, color, nodeIds, turnbackIndices = [], skipStopKeys = []) {
      this.id = id;
      this.lineId = lineId;
      this.name = name;
      this.color = color;
      this.nodeIds = [...nodeIds];
      this.turnbackIndices = new Set(turnbackIndices);
      this.skipStopKeys = new Set(skipStopKeys); // directed keys "N1->N2" for express non-stop pass
      this.visible = true;
      this.headwaySec = 18;
      this.trainCount = 1;
      this.customTrainLength = null; // optional user-selected formation: 120 | 180 | 240
      this.trainLength = 120;
      this.shortPlatformError = null;
      this.segments = [];
      this.totalLength = 0;
      this.stationStops = [];
      this.turnbackPoints = [];
      this.edgeIds = new Set();
    }

    buildGeometry(graph) {
      this.segments = [];
      this.stationStops = [];
      this.turnbackPoints = [];
      this.turnbackStubEdgeIds = new Set();
      this.invalidUturns = []; // { nodeIndex, nodeId, reason, angleDeg }
      this.shortPlatformError = null;
      this.brokenReason = null;
      this.runnable = true;
      this.edgeIds.clear();
      this.totalLength = 0;

      const m = this.nodeIds.length;
      if (m < 2) {
        this.runnable = false;
        this.brokenReason = '节点数量不足';
        return false;
      }

      const stepEdges = [];
      const stoppedPlatformLengths = [];
      for (let i = 0; i < m; i++) {
        const aId = this.nodeIds[i];
        const bId = this.nodeIds[(i + 1) % m];
        if (!graph.getNode(aId)) {
          this.runnable = false;
          this.brokenReason = `节点 ${aId} 已不存在`;
          return false;
        }
        if (!graph.getNode(bId)) {
          this.runnable = false;
          this.brokenReason = `节点 ${bId} 已不存在`;
          return false;
        }
        const edge = graph.getEdgeBetween(aId, bId);
        if (!edge) {
          this.runnable = false;
          this.brokenReason = `${aId} 与 ${bId} 之间轨道已断开`;
          return false;
        }
        stepEdges.push(edge);
        this.edgeIds.add(edge.id);
        const dirKey = aId + '->' + bId;
        if (edge.isStationTrack && edge.platformLength > 0 && !this.skipStopKeys.has(dirKey)) {
          stoppedPlatformLengths.push({ length: edge.platformLength, platformId: edge.platformId, edgeId: edge.id });
        }
      }

      const minStoppedPlatLen = stoppedPlatformLengths.length > 0
        ? Math.min(...stoppedPlatformLengths.map(x => x.length))
        : null;
      this.trainLength = this.customTrainLength
        ? Number(this.customTrainLength)
        : (minStoppedPlatLen || 120);
      if (minStoppedPlatLen !== null && this.trainLength > minStoppedPlatLen) {
        const tooShortIds = Array.from(new Set(
          stoppedPlatformLengths.filter(x => x.length < this.trainLength).map(x => x.platformId)
        ));
        this.shortPlatformError = {
          trainLength: this.trainLength,
          minPlatformLength: minStoppedPlatLen,
          platformIds: tooShortIds
        };
      }

      // Automatically derive turnback points strictly from physical track geometry (no manual toggling needed)
      this.turnbackIndices = new Set();
      const vertexFillet = new Array(m).fill(0);
      for (let i = 0; i < m; i++) {
        const eIn = stepEdges[(i - 1 + m) % m];
        const eOut = stepEdges[i];
        const currId = this.nodeIds[i];

        if (eIn.id === eOut.id) {
          // Physical dead-end / tail-track reversal: automatically a Turnback Point!
          this.turnbackIndices.add(i);
          continue;
        }

        if (eIn.length < 1e-4 || eOut.length < 1e-4) continue;
        const prevNode = graph.getNode(this.nodeIds[(i - 1 + m) % m]);
        const currNode = graph.getNode(currId);
        const nextNode = graph.getNode(this.nodeIds[(i + 1) % m]);
        const u1x = (prevNode.x - currNode.x) / eIn.length;
        const u1y = (prevNode.y - currNode.y) / eIn.length;
        const u2x = (nextNode.x - currNode.x) / eOut.length;
        const u2y = (nextNode.y - currNode.y) / eOut.length;
        const angle = Math.acos(clamp(u1x * u2x + u1y * u2y, -1, 1));
        const angleDeg = (angle * 180) / Math.PI;

        const degAtCurr = graph.getIncidentEdges(currId).length;
        // Going straight ~180° on a through-track never triggers a phantom dead-end;
        // diverging/turning at a >=3-way node strictly requires an active switch and ~>=135° (allowing minor drag skew on 45° platforms).
