        if (degAtCurr >= 3 && !graph.isActiveSwitch(currId) && angleDeg < 168) {
          this.invalidUturns.push({
            nodeIndex: i,
            nodeId: currId,
            reason: 'no_switch_deadend',
            angleDeg: Math.round(angleDeg)
          });
        } else if (angleDeg < 118) {
          // Strict railway geometry rule: reject 90°/45° sharp turns while tolerating minor platform-drag skew around 135°!
          this.invalidUturns.push({
            nodeIndex: i,
            nodeId: currId,
            reason: 'angle_under_135',
            angleDeg: Math.round(angleDeg)
          });
        } else if (angle < Math.PI - 0.08 && !eIn.isStationTrack && !eOut.isStationTrack) {
          vertexFillet[i] = Math.min(FILLET_DIST, eIn.length * 0.34, eOut.length * 0.34);
        }
      }

      let cursorS = 0;
      const pushSeg = (ax, ay, bx, by, edgeId, stepIndex, junctionNodeId = null) => {
        const len = dist(ax, ay, bx, by);
        if (!Number.isFinite(len) || len < 1e-4) return;
        this.segments.push({
          ax, ay, bx, by, len,
          s0: cursorS,
          s1: cursorS + len,
          tx: (bx - ax) / len,
          ty: (by - ay) / len,
          angle: Math.atan2(by - ay, bx - ax),
          edgeId,
          stepIndex,
          junctionNodeId
        });
        cursorS += len;
      };

      for (let i = 0; i < m; i++) {
        const aNode = graph.getNode(this.nodeIds[i]);
        const bNode = graph.getNode(this.nodeIds[(i + 1) % m]);
        const edge = stepEdges[i];
        if (edge.length < 1e-4) continue;
        const vx = (bNode.x - aNode.x) / edge.length;
        const vy = (bNode.y - aNode.y) / edge.length;
        const trimStart = vertexFillet[i];
        const trimEnd = vertexFillet[(i + 1) % m];

        const prevStepEdge = stepEdges[(i - 1 + m) % m];
        if (this.turnbackIndices.has(i)) {
          let sharedBack = 0;
          for (let k = 0; k < m; k++) {
            const backEdge = stepEdges[(i - 1 - k + m * 2) % m];
            const fwdEdge = stepEdges[(i + k) % m];
            if (backEdge.id === fwdEdge.id) {
              sharedBack += backEdge.length;
              // Mark immediate dead-end stub edge(s) within 1 train-length of turnback end
              if (sharedBack <= this.trainLength + 90) {
                this.turnbackStubEdgeIds.add(backEdge.id);
              }
            } else break;
          }
          const isStationTurnback = !!(prevStepEdge && prevStepEdge.isStationTrack && edge.id === prevStepEdge.id);
          this.turnbackPoints.push({
            s: cursorS,
            nodeIndex: i,
            nodeId: aNode.id,
            sharedBackDist: sharedBack,
            isStationTurnback
          });
        }

        const pStartX = aNode.x + vx * trimStart;
        const pStartY = aNode.y + vy * trimStart;
        const pEndX = bNode.x - vx * trimEnd;
        const pEndY = bNode.y - vy * trimEnd;

        pushSeg(pStartX, pStartY, pEndX, pEndY, edge.id, i, null);

        // Skip duplicate station stops when turning back directly at a terminus platform (站前折返):
        // - Entering a turnback end: the turnback dwell itself handles boarding + cab reversal (no double stop)
        // - Exiting immediately after cab reversal on the same station track: train already dwelled & reversed here!
        const nextVertexIdx = (i + 1) % m;
        const dirKey = aNode.id + '->' + bNode.id;
        const isSkipped = this.skipStopKeys.has(dirKey);
        const isEnteringStationTurnback = this.turnbackIndices.has(nextVertexIdx) && stepEdges[nextVertexIdx].id === edge.id;
        const isExitingStationTurnback = this.turnbackIndices.has(i) && prevStepEdge && prevStepEdge.id === edge.id;
        if (edge.isStationTrack && !isSkipped && !isEnteringStationTurnback && !isExitingStationTurnback) {
          this.stationStops.push({
            s: cursorS,
            edgeId: edge.id,
            platformId: edge.platformId,
            platformLength: edge.platformLength
          });
        }

        if (trimEnd > 0) {
          const nextIdx = (i + 1) % m;
          const nextNode = graph.getNode(this.nodeIds[(i + 2) % m]);
          const nextEdge = stepEdges[nextIdx];
          if (nextEdge.length < 1e-4) continue;
          const nvx = (nextNode.x - bNode.x) / nextEdge.length;
          const nvy = (nextNode.y - bNode.y) / nextEdge.length;
          const q0x = pEndX, q0y = pEndY;
          const q1x = bNode.x, q1y = bNode.y;
          const q2x = bNode.x + nvx * trimEnd;
          const q2y = bNode.y + nvy * trimEnd;

          const steps = 10;
          let prevX = q0x, prevY = q0y;
          for (let k = 1; k <= steps; k++) {
            const t = k / steps;
            const mt = 1 - t;
            const x = mt * mt * q0x + 2 * mt * t * q1x + t * t * q2x;
            const y = mt * mt * q0y + 2 * mt * t * q1y + t * t * q2y;
            pushSeg(prevX, prevY, x, y, k <= steps / 2 ? edge.id : nextEdge.id, k <= steps / 2 ? i : nextIdx, bNode.id);
            prevX = x;
            prevY = y;
          }
        }
      }

      this.totalLength = cursorS;
      if (this.shortPlatformError && !this.brokenReason) {
        this.brokenReason = `停靠站台最短 ${this.shortPlatformError.minPlatformLength}m < 列车编组 ${this.shortPlatformError.trainLength}m`;
      }
      this.runnable = (this.invalidUturns.length === 0 && !this.shortPlatformError && this.totalLength > 1);
      return this.totalLength > 1;
    }

    wrapS(s) {
      if (this.totalLength <= 0) return 0;
      return ((s % this.totalLength) + this.totalLength) % this.totalLength;
    }

    sampleAt(rawS) {
      if (this.segments.length === 0) return null;
      const s = this.wrapS(rawS);
      let lo = 0;
      let hi = this.segments.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (this.segments[mid].s1 < s) lo = mid + 1;
        else hi = mid;
      }
      const seg = this.segments[lo];
      const frac = clamp((s - seg.s0) / seg.len, 0, 1);
      return {
        x: seg.ax + (seg.bx - seg.ax) * frac,
        y: seg.ay + (seg.by - seg.ay) * frac,
        angle: seg.angle,
        tx: seg.tx,
        ty: seg.ty,
        edgeId: seg.edgeId,
        junctionNodeId: seg.junctionNodeId,
        s
      };
    }
  }

  class RouteManager {
    constructor(trackGraph) {
      this.graph = trackGraph;
      this.lines = new Map();
      this.routes = new Map();
      this.nextLineId = 1;
      this.nextRouteId = 1;
      this.colorCursor = 0;
    }

    clear() {
      this.lines.clear();
      this.routes.clear();
      this.nextLineId = 1;
      this.nextRouteId = 1;
      this.colorCursor = 0;
    }

    nextColor() {
      const c = PALETTE_COLORS[this.colorCursor % PALETTE_COLORS.length];
      this.colorCursor++;
      return c;
    }

    addLine(name, color = null) {
      const id = 'L' + (this.nextLineId++);
      const line = new MetroLine(id, name || `${id.slice(1)}号线`, color || this.nextColor());
      this.lines.set(id, line);
      return line;
    }

    getLine(lineId) {
      return this.lines.get(lineId) || null;
    }

    removeLine(lineId) {
      if (!this.lines.has(lineId)) return;
      for (const [rid, r] of Array.from(this.routes.entries())) {
        if (r.lineId === lineId) this.routes.delete(rid);
      }
      this.lines.delete(lineId);
    }

    getRoutesByLine(lineId) {
      const list = [];
      for (const r of this.routes.values()) {
        if (r.lineId === lineId) list.push(r);
      }
      return list;
    }

    addRoute(lineId, name, nodeIds, turnbackIndices = [], opts = {}) {
      const parentLine = this.lines.get(lineId);
      if (!parentLine) return null;
      const id = 'R' + (this.nextRouteId++);
      const siblings = this.getRoutesByLine(lineId).length;
      const defaultColor = siblings === 0 ? parentLine.color : this.nextColor();
      const route = new Route(id, lineId, name || (`交路 ${siblings + 1}`), opts.color || defaultColor, nodeIds, turnbackIndices, opts.skipStopKeys || []);
      if (opts.headwaySec) route.headwaySec = opts.headwaySec;
      if (opts.trainCount) route.trainCount = opts.trainCount;
      if (opts.customTrainLength) route.customTrainLength = Number(opts.customTrainLength);
      if (!route.buildGeometry(this.graph)) return null;
      this.routes.set(id, route);
      return route;
    }

    removeRoute(routeId) {
      this.routes.delete(routeId);
    }

    insertNodeBetween(routeId, afterIndex, targetNodeId) {
      const route = this.routes.get(routeId);
      if (!route || route.nodeIds.length < 2) return { ok: false, reason: '交路无效' };
      const m = route.nodeIds.length;
      const aId = route.nodeIds[afterIndex];
      const bId = route.nodeIds[(afterIndex + 1) % m];
      if (targetNodeId === aId || targetNodeId === bId) {
        return { ok: false, reason: '不能重复插入相邻的起止节点' };
      }
      const prevOfA = m >= 2 ? route.nodeIds[(afterIndex - 1 + m) % m] : null;
      const p1 = this.graph.findRailPath(aId, targetNodeId, prevOfA);
      const prevOfTarget = p1 && p1.length >= 2 ? p1[p1.length - 2] : aId;
      const p2 = this.graph.findRailPath(targetNodeId, bId, prevOfTarget);
      if (!p1 || !p2) {
        return { ok: false, reason: `节点 ${targetNodeId} 无法同时连通 ${aId} 与 ${bId}` };
      }
      const bridge = [...p1.slice(1), ...p2.slice(1, -1)];
      if (bridge.length === 0) return { ok: false, reason: '无需插入' };

      route.nodeIds = [
        ...route.nodeIds.slice(0, afterIndex + 1),
        ...bridge,
        ...route.nodeIds.slice(afterIndex + 1)
      ];
      if (!route.buildGeometry(this.graph)) return { ok: false, reason: '插入后路径几何重建失败' };
      return { ok: true };
    }

    removeNodeFromRoute(routeId, nodeIndex) {
      const route = this.routes.get(routeId);
      if (!route || route.nodeIds.length <= 2) return { ok: false, reason: '闭环交路至少需要保留 2 个节点' };
      const m = route.nodeIds.length;
      const prevIdx = (nodeIndex - 1 + m) % m;
      const nextIdx = (nodeIndex + 1) % m;
      const prevId = route.nodeIds[prevIdx];
      const nextId = route.nodeIds[nextIdx];

      const oldTbNodeIds = new Set();
      for (const idx of route.turnbackIndices) {
        if (idx !== nodeIndex) oldTbNodeIds.add(route.nodeIds[idx]);
      }

      let bridge = [];
      if (prevId !== nextId && !this.graph.getEdgeBetween(prevId, nextId)) {
        const prevPrevId = m >= 3 ? route.nodeIds[(prevIdx - 1 + m) % m] : null;
        const sp = this.graph.findRailPath(prevId, nextId, prevPrevId);
        if (!sp) return { ok: false, reason: '移除该节点后前后节点无法连通' };
        bridge = sp.slice(1, -1);
      }

      const raw = [
        ...route.nodeIds.slice(0, nodeIndex),
        ...bridge,
        ...route.nodeIds.slice(nodeIndex + 1)
      ];
      const cleaned = [];
      for (let i = 0; i < raw.length; i++) {
        if (cleaned.length === 0 || cleaned[cleaned.length - 1] !== raw[i]) cleaned.push(raw[i]);
      }
      if (cleaned.length > 1 && cleaned[0] === cleaned[cleaned.length - 1]) cleaned.pop();
      if (cleaned.length < 2) return { ok: false, reason: '移除后节点数不足' };

      const newTb = new Set();
      for (let i = 0; i < cleaned.length; i++) {
        const prev = cleaned[(i - 1 + cleaned.length) % cleaned.length];
        const next = cleaned[(i + 1) % cleaned.length];
        if (oldTbNodeIds.has(cleaned[i]) || prev === next) newTb.add(i);
      }
      route.nodeIds = cleaned;
      route.turnbackIndices = newTb;
      if (!route.buildGeometry(this.graph)) return { ok: false, reason: '移除后交路不连通' };
      return { ok: true };
    }

    handleEdgeSplit(oldFromId, oldToId, newMidId) {
      for (const route of this.routes.values()) {
        const m = route.nodeIds.length;
        if (m < 2) continue;
        const oldTbIds = new Set();
        for (const idx of route.turnbackIndices) oldTbIds.add(route.nodeIds[idx]);
        const nextNodes = [];
        for (let i = 0; i < m; i++) {
          const a = route.nodeIds[i];
          const b = route.nodeIds[(i + 1) % m];
          nextNodes.push(a);
          if ((a === oldFromId && b === oldToId) || (a === oldToId && b === oldFromId)) {
            nextNodes.push(newMidId);
          }
        }
        route.nodeIds = nextNodes;
        const nextTb = new Set();
        for (let i = 0; i < nextNodes.length; i++) {
          if (oldTbIds.has(nextNodes[i])) nextTb.add(i);
        }
        route.turnbackIndices = nextTb;
      }
    }

    rebuildAll() {
      for (const route of this.routes.values()) {
        route.buildGeometry(this.graph);
      }
    }

    isRouteVisible(route) {
      const line = this.lines.get(route.lineId);
      return route.visible && (!line || line.visible);
    }

    getEdgeCoRunningMap() {
      const map = new Map();
      for (const route of this.routes.values()) {
        if (!this.isRouteVisible(route)) continue;
        for (const eid of route.edgeIds) {
          if (!map.has(eid)) map.set(eid, []);
          map.get(eid).push(route);
        }
      }
      for (const list of map.values()) {
        list.sort((a, b) => a.id.localeCompare(b.id));
      }
      return map;
    }
  }

  // =========================================================================
  // 4. Train & Dispatcher
  // =========================================================================
  class Train {
    constructor(id, route, initialHeadS) {
      this.id = id;
      this.routeId = route.id;
      this.length = route.trainLength;
      this.headS = route.wrapS(initialHeadS);
      this.speed = 0;
      this.maxSpeed = 96;
      this.accel = 72;
      this.decel = 110;
      this.state = 'RUNNING';
      this.stateTimer = 0;
      this.waitSince = 0;
      this.waitingForEdgeId = null;
      this.lastHandledStopKey = null;
      this.lastHandledTbKey = null;
      this.occupiedEdges = new Set();
      this.occupiedNodes = new Set();
    }
  }

  class Dispatcher {
    constructor(trackGraph, routeManager) {
      this.graph = trackGraph;
      this.routeManager = routeManager;
      this.trains = new Map();
      this.nextTrainId = 1;
      this.simTime = 0;
      this.running = true;
      this.speedMultiplier = 1;
      this.blockDistance = 60;
    }

    clear() {
      this.trains.clear();
      this.nextTrainId = 1;
      this.simTime = 0;
      for (const e of this.graph.edges.values()) e.lockedBy = null;
      for (const n of this.graph.nodes.values()) n.lockedBy = null;
    }

    // Find the loop coordinate s on `route` that maximizes the minimum distance
    // to all existing trains currently running on the same line (route.lineId).
    findBestSpawnS(route) {
      const L = route.totalLength;
      if (L < 10) return 0;

      const sameLineTrains = [];
      for (const t of this.trains.values()) {
        const tr = this.routeManager.routes.get(t.routeId);
        if (tr && tr.lineId === route.lineId) {
          sameLineTrains.push({ train: t, route: tr });
        }
      }

      if (sameLineTrains.length === 0) {
        return route.wrapS(route.trainLength * 1.45);
      }

      const samples = Math.min(240, Math.max(48, Math.ceil(L / 20)));
      let bestS = 0;
      let bestMinDist = -1;

      for (let i = 0; i < samples; i++) {
        const candS = (L * i) / samples;
        const candHead = route.sampleAt(candS);
        const candMid = route.sampleAt(candS - route.trainLength * 0.5);
        if (!candHead) continue;

        let minD = Infinity;
        for (const item of sameLineTrains) {
          const other = item.train;
          let d;
          if (other.routeId === route.id) {
            const df = this.forwardDist(candS, other.headS, L);
            const db = this.forwardDist(other.headS, candS, L);
            d = Math.min(df, db);
          } else {
            // Different route under the same line: use shortest physical distance to the other train's body
            d = Infinity;
            const pts = other.bodyPoints && other.bodyPoints.length > 0
              ? other.bodyPoints
              : [item.route.sampleAt(other.headS)].filter(Boolean);
            for (let j = 0; j < pts.length; j++) {
              const bp = pts[j];
              const dh = dist(candHead.x, candHead.y, bp.x, bp.y);
              if (dh < d) d = dh;
              if (candMid) {
                const dm = dist(candMid.x, candMid.y, bp.x, bp.y);
                if (dm < d) d = dm;
              }
            }
          }
          if (d < minD) minD = d;
        }

        if (minD > bestMinDist + 1e-3) {
          bestMinDist = minD;
          bestS = candS;
        }
      }

      return { s: route.wrapS(bestS), minDist: bestMinDist };
    }

    addTrainToRoute(route, enforceSpacing = false) {
      if (!route || route.totalLength < 10 || !route.runnable) return null;
      const res = this.findBestSpawnS(route);
      const startS = typeof res === 'number' ? res : res.s;
      const minDist = typeof res === 'number' ? Infinity : res.minDist;
      // Rule 6: if adding another train would physically overlap an existing train, stop and reject!
      if (enforceSpacing && minDist < route.trainLength + 12) {
        return null;
      }
      const id = 'T' + (this.nextTrainId++);
      const train = new Train(id, route, startS);
      this.trains.set(id, train);
      this.refreshLocks();
      return train;
    }

    removeTrainFromRoute(route) {
      if (!route) return null;
      let targetId = null;
      for (const [tid, t] of this.trains.entries()) {
        if (t.routeId === route.id) targetId = tid;
      }
      if (targetId) {
        this.trains.delete(targetId);
        this.refreshLocks();
      }
      return targetId;
    }

    syncTrainsWithRoutes(resetAll = false) {
      if (resetAll) {
        this.clear();
        for (const route of this.routeManager.routes.values()) {
          if (route.totalLength < 10 || !route.runnable) continue;
          const count = Math.max(1, Math.floor(route.trainCount || 1));
          for (let i = 0; i < count; i++) {
            this.addTrainToRoute(route);
          }
        }
        this.refreshLocks();
        return;
      }

      // Preserve existing trains on all still-runnable routes without resetting their positions
      const keptByRoute = new Map();
      for (const [tid, train] of Array.from(this.trains.entries())) {
        const route = this.routeManager.routes.get(train.routeId);
        if (!route || route.totalLength < 10 || !route.runnable) {
          this.trains.delete(tid);
          continue;
        }
        train.length = route.trainLength;
        train.headS = route.wrapS(train.headS);
        if (!keptByRoute.has(route.id)) keptByRoute.set(route.id, []);
        keptByRoute.get(route.id).push(tid);
      }
      this.refreshLocks();

      for (const route of this.routeManager.routes.values()) {
        if (route.totalLength < 10 || !route.runnable) continue;
        const target = Math.max(1, Math.floor(route.trainCount || 1));
        const existing = keptByRoute.get(route.id) || [];
        while (existing.length > target) {
          const dropId = existing.pop();
          this.trains.delete(dropId);
        }
        while (existing.length < target) {
          const added = this.addTrainToRoute(route);
          if (!added) break;
          existing.push(added.id);
        }
      }
      this.refreshLocks();
    }

    getOccupiedGeometry(train, route) {
      const edges = new Set();
      const nodes = new Set();
      const bodyPoints = [];
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const samples = Math.max(8, Math.ceil(train.length / 16));
      for (let i = 0; i <= samples; i++) {
        const pt = route.sampleAt(train.headS - (train.length * i) / samples);
        if (pt) {
          edges.add(pt.edgeId);
          if (pt.junctionNodeId) nodes.add(pt.junctionNodeId);
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.y > maxY) maxY = pt.y;
          bodyPoints.push({ x: pt.x, y: pt.y, tx: pt.tx, ty: pt.ty, edgeId: pt.edgeId });
        }
      }
      return { edges, nodes, bodyPoints, minX, minY, maxX, maxY };
    }

    refreshLocks() {
      if (this._dirtyEdges) {
        for (let i = 0; i < this._dirtyEdges.length; i++) {
          const e = this._dirtyEdges[i];
          e.lockedBy = null;
          e.occupants = [];
        }
        this._dirtyEdges.length = 0;
      } else {
        this._dirtyEdges = [];
        for (const e of this.graph.edges.values()) { e.lockedBy = null; e.occupants = []; }
      }
      if (this._dirtyNodes) {
        for (let i = 0; i < this._dirtyNodes.length; i++) this._dirtyNodes[i].lockedBy = null;
        this._dirtyNodes.length = 0;
      } else {
        this._dirtyNodes = [];
        for (const n of this.graph.nodes.values()) n.lockedBy = null;
      }

      for (const train of this.trains.values()) {
        const route = this.routeManager.routes.get(train.routeId);
        if (!route) continue;
        train.length = route.trainLength;
        const { edges, nodes, bodyPoints, minX, minY, maxX, maxY } = this.getOccupiedGeometry(train, route);
        train.occupiedEdges = edges;
        train.occupiedNodes = nodes;
        train.bodyPoints = bodyPoints;
        train.minX = minX; train.minY = minY; train.maxX = maxX; train.maxY = maxY;

        for (const eid of edges) {
          const e = this.graph.edges.get(eid);
          if (e) {
            if (!e.occupants) e.occupants = [];
            if (!e.lockedBy) {
              e.lockedBy = train.id;
              this._dirtyEdges.push(e);
            }
            let rep = null;
            for (let k = 0; k < bodyPoints.length; k++) {
              if (bodyPoints[k].edgeId === eid) { rep = bodyPoints[k]; break; }
            }
            e.occupants.push({ trainId: train.id, tx: rep ? rep.tx : 0, ty: rep ? rep.ty : 0 });
          }
        }
        for (const nid of nodes) {
          const n = this.graph.nodes.get(nid);
          if (n && !n.lockedBy) {
            n.lockedBy = train.id;
            this._dirtyNodes.push(n);
          }
        }
      }
    }

    // Incremental O(1) lock update for a single moved train (avoids O(N^2) full-network relocking every train!)
    updateTrainLock(train, route) {
      if (!route) return;
      if (!this._dirtyEdges) this._dirtyEdges = [];
      if (!this._dirtyNodes) this._dirtyNodes = [];

      // 1. Release this train's previous edge/node locks
      if (train.occupiedEdges) {
        for (const eid of train.occupiedEdges) {
          const e = this.graph.edges.get(eid);
          if (!e) continue;
          if (e.occupants && e.occupants.length > 0) {
            e.occupants = e.occupants.filter(o => o.trainId !== train.id);
          }
          if (e.lockedBy === train.id) {
            e.lockedBy = (e.occupants && e.occupants.length > 0) ? e.occupants[0].trainId : null;
          }
        }
      }
      if (train.occupiedNodes) {
        for (const nid of train.occupiedNodes) {
          const n = this.graph.nodes.get(nid);
          if (n && n.lockedBy === train.id) n.lockedBy = null;
        }
      }

      // 2. Re-sample ONLY this train's geometry & AABB
      train.length = route.trainLength;
      const { edges, nodes, bodyPoints, minX, minY, maxX, maxY } = this.getOccupiedGeometry(train, route);
      train.occupiedEdges = edges;
      train.occupiedNodes = nodes;
      train.bodyPoints = bodyPoints;
      train.minX = minX; train.minY = minY; train.maxX = maxX; train.maxY = maxY;

      // 3. Re-acquire ONLY this train's new edge/node locks
      for (const eid of edges) {
        const e = this.graph.edges.get(eid);
        if (!e) continue;
        if (!e.occupants) e.occupants = [];
        if (!e.lockedBy) {
          e.lockedBy = train.id;
          this._dirtyEdges.push(e);
        }
        let rep = null;
        for (let k = 0; k < bodyPoints.length; k++) {
          if (bodyPoints[k].edgeId === eid) { rep = bodyPoints[k]; break; }
        }
        e.occupants.push({ trainId: train.id, tx: rep ? rep.tx : 0, ty: rep ? rep.ty : 0 });
      }
      for (const nid of nodes) {
        const n = this.graph.nodes.get(nid);
        if (n && !n.lockedBy) {
          n.lockedBy = train.id;
          this._dirtyNodes.push(n);
        }
      }
    }

    forwardDist(sFrom, sTarget, totalLen) {
      let d = sTarget - sFrom;
      if (d < 0) d += totalLen;
      return d;
    }

    // Moving-Block Distance Signaling: enforces exact `blockDistance` across ALL trains (same-route & co-running!),
    // plus switch exclusivity & opposing single-track protection.
    canReserveAhead(train, route, lookaheadDist, opts = {}) {
      const steps = Math.max(4, Math.ceil(lookaheadDist / 12));
      for (let i = 1; i <= steps; i++) {
        const d = (lookaheadDist * i) / steps;
        const pt = route.sampleAt(train.headS + d);
        if (!pt) continue;

        // 1. Junction / Switch (degree >= 3) exclusive lock
        if (pt.junctionNodeId) {
          const node = this.graph.nodes.get(pt.junctionNodeId);
          if (node && node.lockedBy && node.lockedBy !== train.id) {
            return { ok: false, blockedEdgeId: `道岔 ${node.id}`, blockedDist: d };
          }
        }

        // 2. Opposing-direction single-track conflict check on the edge ahead
        const edge = this.graph.edges.get(pt.edgeId);
        if (edge && edge.occupants && edge.occupants.length > 0) {
          for (const occ of edge.occupants) {
            if (occ.trainId === train.id) continue;
            const dirDot = pt.tx * occ.tx + pt.ty * occ.ty;
            if (dirDot < -0.45) {
              return { ok: false, blockedEdgeId: `对向 ${edge.id}`, blockedDist: d };
            }
          }
        }

        // 3. Fast AABB-pruned moving-block check against nearby trains' physical bodies:
        for (const other of this.trains.values()) {
          if (other.id === train.id || !other.bodyPoints) continue;
          if (pt.x < other.minX - 15 || pt.x > other.maxX + 15 || pt.y < other.minY - 15 || pt.y > other.maxY + 15) continue;
          const bps = other.bodyPoints;
          for (let j = 0; j < bps.length; j++) {
            const bp = bps[j];
            const dxB = pt.x - bp.x;
            if (dxB > 14 || dxB < -14) continue;
            const dyB = pt.y - bp.y;
            if (dyB > 14 || dyB < -14) continue;
            if (dxB * dxB + dyB * dyB < 169) {
              if (pt.edgeId !== bp.edgeId) {
                const cross = this.graph.getCrossingBetween(pt.edgeId, bp.edgeId);
                if (cross && (cross.type === 'overpass' || cross.type === 'underpass')) continue;
                return { ok: false, blockedEdgeId: cross ? `平面相交 ${cross.id}` : `前车 ${other.id}`, blockedDist: d };
              }
              return { ok: false, blockedEdgeId: `前车 ${other.id}`, blockedDist: d };
            }
          }
        }
      }

      // 4. Turnback Priority & Throat Protection (折返出清优先):
      // If train is approaching a turnback stub that is currently occupied by another train,
      // hold BEFORE entering the throat switch so the reversing train has a 100% clear exit!
      // (Does NOT interfere with genuine single-track 2-train opposing deadlocks.)
      if (!opts.skipThroatHold && route.turnbackStubEdgeIds && route.turnbackStubEdgeIds.size > 0) {
        let alreadyInStub = false;
        for (const eid of train.occupiedEdges) {
          if (route.turnbackStubEdgeIds.has(eid)) { alreadyInStub = true; break; }
        }
        if (!alreadyInStub) {
          // Hold cleanly right before the throat switch leading into the occupied turnback stub (never 260m away!)
          const throatLookahead = Math.min(Math.max(lookaheadDist + 16, 48), 96);
          const tSteps = Math.max(3, Math.ceil(throatLookahead / 12));
          for (let i = 1; i <= tSteps; i++) {
            const td = (throatLookahead * i) / tSteps;
            const tpt = route.sampleAt(train.headS + td);
            if (!tpt) continue;
            if (route.turnbackStubEdgeIds.has(tpt.edgeId)) {
              const stubEdge = this.graph.edges.get(tpt.edgeId);
              if (stubEdge && stubEdge.occupants && stubEdge.occupants.some(o => o.trainId !== train.id)) {
                // Only apply throat-hold if the turnback stub connects to a >=3-way throat switch
                // (so genuine 2-train deadlocks on pure single-track shuttles are NOT artificially bypassed)
                const degA = this.graph.getIncidentEdges(stubEdge.from).length;
                const degB = this.graph.getIncidentEdges(stubEdge.to).length;
                if (degA >= 3 || degB >= 3) {
                  return { ok: false, blockedEdgeId: `折返优先 ${stubEdge.id}`, blockedDist: td };
                }
              }
              break;
            }
          }
        }
      }

      return { ok: true, blockedEdgeId: null, blockedDist: lookaheadDist };
    }

    diagnoseIssues() {
      const issues = [];
      for (const route of this.routeManager.routes.values()) {
        const line = this.routeManager.getLine(route.lineId);
        const prefix = line ? `${line.name} / ${route.name}` : route.name;

        // 0a. Disconnected / missing node or track (suspended, NOT deleted!)
        if (!route.runnable && route.brokenReason && !route.shortPlatformError) {
          let anchor = null;
          for (const nid of route.nodeIds) {
            const nd = this.graph.getNode(nid);
            if (nd) { anchor = nd; break; }
          }
          issues.push({
            key: `BROKEN_${route.id}_${route.brokenReason}`,
            level: 'error',
            title: `交路已停运：${route.name}（${route.brokenReason}）`,
            detail: `${prefix} 因「${route.brokenReason}」无法运行，已自动停运保留；点击编辑交路修复断点后即可恢复运行`,
            x: anchor ? anchor.x : 0,
            y: anchor ? anchor.y : 0
          });
          continue;
        }

        // 0b. Forbidden non-switch dead-end OR corner < 135° (route cannot run!)
        for (const bad of (route.invalidUturns || [])) {
          const n = this.graph.getNode(bad.nodeId);
          if (bad.reason === 'no_switch_deadend') {
            issues.push({
              key: `NO_SWITCH_${route.id}_${bad.nodeId}`,
              level: 'error',
              title: `交路不可运行：${bad.nodeId} 为断头路（未设道岔）`,
              detail: `「${prefix}」经过节点 ${bad.nodeId} 但该点未设道岔，交路已停运。可在「选择/编辑」模式选中 ${bad.nodeId} 切换为道岔`,
              x: n ? n.x : 0,
              y: n ? n.y : 0
            });
          } else {
            issues.push({
              key: `ANGLE_135_${route.id}_${bad.nodeId}`,
              level: 'error',
              title: `交路不可运行：${bad.nodeId} 夹角 ${bad.angleDeg}° < 135°`,
              detail: `「${prefix}」在节点 ${bad.nodeId} 转向夹角小于 135°，违反道岔通行规则，该交路已停运。请调整为 ≥135° 或经折返线换向`,
              x: n ? n.x : 0,
              y: n ? n.y : 0
            });
          }
        }

        // 1. Turnback siding length shorter than train length
        for (const tb of route.turnbackPoints) {
          const n = this.graph.getNode(tb.nodeId);
          if (tb.sharedBackDist > 0 && tb.sharedBackDist < route.trainLength - 2) {
            issues.push({
              key: `TB_SHORT_${route.id}_${tb.nodeId}`,
              level: 'error',
              title: `折返线长度不足 (${Math.round(tb.sharedBackDist)}m < ${route.trainLength}m)`,
              detail: `「${prefix}」在折返点 ${tb.nodeId} 有效折返段仅 ${Math.round(tb.sharedBackDist)}m，小于列车长度 ${route.trainLength}m，换端时车尾会侵入道岔或正线`,
              x: n ? n.x : 0,
              y: n ? n.y : 0
            });
          }
        }

        // 2. Stopping platform shorter than selected train formation (small train at large platform is allowed)
        if (route.shortPlatformError) {
          const err = route.shortPlatformError;
          const platNames = (err.platformIds || []).map(pid => {
            const p = this.platforms ? this.platforms.getPlatform(pid) : null;
            return p ? `${p.name}(${p.length}m)` : `${err.minPlatformLength}m站台`;
          });
          const firstP = (err.platformIds && err.platformIds[0] && this.platforms) ? this.platforms.getPlatform(err.platformIds[0]) : null;
          const n0 = this.graph.getNode(route.nodeIds[0]);
          issues.push({
            key: `PLAT_SHORT_${route.id}`,
            level: 'error',
            title: `交路停运：停靠站台长度不足 (${err.minPlatformLength}m < ${err.trainLength}m)`,
            detail: `「${prefix}」选用 ${err.trainLength}m 编组，但停靠站台 ${platNames.join('、')} 短于列车长度，该交路已停运。请调小编组或将短站台设为不停通过`,
            x: firstP ? firstP.x : (n0 ? n0.x : 0),
            y: firstP ? firstP.y : (n0 ? n0.y : 0)
          });
        }

        // 3. No station stops on route (count both regular stops and pre-station turnbacks)
        const hasAnyStation = route.stationStops.length > 0 || route.turnbackPoints.some(tb => tb.isStationTurnback);
        if (!hasAnyStation) {
          const n0 = this.graph.getNode(route.nodeIds[0]);
          issues.push({
            key: `NO_STOP_${route.id}`,
            level: 'warn',
            title: `交路未途经任何站台`,
            detail: `「${prefix}」当前无停靠站台，按默认 ${route.trainLength}m 编组空跑`,
            x: n0 ? n0.x : 0,
            y: n0 ? n0.y : 0
          });
        }

        // 4. Overcrowded route
        if (route.totalLength > 0 && route.trainCount * (route.trainLength + 36) > route.totalLength * 0.75) {
          const n0 = this.graph.getNode(route.nodeIds[0]);
          issues.push({
            key: `CROWD_${route.id}`,
            level: 'warn',
            title: `配车密度过高`,
            detail: `「${prefix}」共 ${route.trainCount} 列（总车长占全环超 75%），易引发连环闭塞拥堵`,
            x: n0 ? n0.x : 0,
            y: n0 ? n0.y : 0
          });
        }

        // 5. Fallback: never allow a route to be silently suspended with 0 diagnostic errors
        if (!route.runnable && !route.shortPlatformError && (!route.invalidUturns || route.invalidUturns.length === 0)) {
          const n0 = this.graph.getNode(route.nodeIds[0]);
          issues.push({
            key: `SUSPENDED_${route.id}`,
            level: 'error',
            title: `交路已停运：${route.name}`,
            detail: `「${prefix}」当前路径异常（总长 ${Number.isFinite(route.totalLength) ? Math.round(route.totalLength) : 0}m），请检查重叠节点或编辑交路`,
            x: n0 ? n0.x : 0,
            y: n0 ? n0.y : 0
          });
        }
      }

      // 5. Live Deadlock / Prolonged Block Wait (> 10s)
      for (const train of this.trains.values()) {
        if (train.state === 'WAITING' && (this.simTime - train.waitSince) > 10) {
          const route = this.routeManager.routes.get(train.routeId);
          const pt = route ? route.sampleAt(train.headS) : null;
          issues.push({
            key: `DEADLOCK_${train.id}_${train.waitingForEdgeId || ''}`,
            level: 'error',
            title: `列车 ${train.id} 闭塞等待超时 (${Math.round(this.simTime - train.waitSince)}s)`,
            detail: `可能发生单线对向死锁或道岔冲突，请检查 ${train.waitingForEdgeId || '前方区间'} 或减少配车`,
            x: pt ? pt.x : 0,
            y: pt ? pt.y : 0
          });
        }
      }

      return issues;
    }

    step(rawDt) {
      if (!this.running) return;
      const totalDt = Math.min(rawDt, 0.034) * this.speedMultiplier;
      const subSteps = Math.min(8, Math.max(1, Math.ceil(totalDt / 0.05)));
      const dt = totalDt / subSteps;
      for (let sub = 0; sub < subSteps; sub++) {
        this.stepOnce(dt);
      }
    }

    stepOnce(dt) {
      this.simTime += dt;

      // Priority scheduling: trains currently inside/exiting a turnback stub ALWAYS get priority over incoming trains!
      const isInTurnbackStub = t => {
        const r = this.routeManager.routes.get(t.routeId);
        if (!r || !r.turnbackStubEdgeIds || !t.occupiedEdges) return false;
        for (const eid of t.occupiedEdges) {
          if (r.turnbackStubEdgeIds.has(eid)) return true;
        }
        return false;
      };
      const orderedTrains = Array.from(this.trains.values()).sort((a, b) => {
        const aTb = isInTurnbackStub(a) ? 1 : 0;
        const bTb = isInTurnbackStub(b) ? 1 : 0;
        if (aTb !== bTb) return bTb - aTb;
        if (a.state === 'WAITING' && b.state === 'WAITING') return a.waitSince - b.waitSince;
        if (a.state === 'WAITING') return -1;
        if (b.state === 'WAITING') return 1;
        return 0;
      });

      for (const train of orderedTrains) {
        const route = this.routeManager.routes.get(train.routeId);
        if (!route || route.totalLength < 10) continue;
        const line = this.routeManager.getLine(route.lineId);
        const lineSpeedPx = ((line && typeof line.speedKmh === 'number' ? line.speedKmh : 80) / 0.85);
        const lineDwell = (line && typeof line.dwellSec === 'number') ? line.dwellSec : 1.8;
        const lineTurnback = (line && typeof line.turnbackSec === 'number') ? line.turnbackSec : 2.5;
        train.length = route.trainLength;
        train.maxSpeed = lineSpeedPx;

        if (train.state === 'TURNBACK') {
          train.speed = 0;
          train.stateTimer -= dt;
          if (train.stateTimer <= 0) {
            const tb = route.turnbackPoints.find(t => t.nodeId + '@' + t.nodeIndex === train.lastHandledTbKey);
            const jumpDist = tb ? Math.min(train.length, tb.sharedBackDist) : 0;
            // Always complete cab reversal (swap head & tail on the exact same occupied track) FIRST,
            // so even if the outgoing section ahead is locked, the train waits cleanly facing outbound instead of U-turning in place!
            if (jumpDist > 1) {
              train.headS = route.wrapS(train.headS + jumpDist);
            }
            this.updateTrainLock(train, route);
            const reserveOut = this.canReserveAhead(train, route, Math.max(24, this.blockDistance));
            if (!reserveOut.ok) {
              train.state = 'WAITING';
              train.waitSince = this.simTime;
              train.waitingForEdgeId = reserveOut.blockedEdgeId;
            } else {
              train.state = 'RUNNING';
              train.waitingForEdgeId = null;
            }
          }
          continue;
        }

        if (train.state === 'DWELL') {
          train.speed = 0;
          train.stateTimer -= dt;
          if (train.stateTimer <= 0) {
            const depClear = this.canReserveAhead(train, route, Math.max(24, this.blockDistance));
            if (depClear.ok) {
              train.state = 'RUNNING';
              train.waitingForEdgeId = null;
            } else {
              train.state = 'WAITING';
              train.waitSince = this.simTime;
              train.waitingForEdgeId = depClear.blockedEdgeId;
            }
          }
          continue;
        }

        let targetStopDist = Infinity;
        let stopAction = null;

        for (const tb of route.turnbackPoints) {
          const key = tb.nodeId + '@' + tb.nodeIndex;
          const d = this.forwardDist(train.headS, tb.s, route.totalLength);
          if (d < targetStopDist && (key !== train.lastHandledTbKey || d > 25)) {
            targetStopDist = d;
            stopAction = { type: 'TURNBACK', key, s: tb.s, isStationTurnback: !!tb.isStationTurnback };
          }
        }

        for (const st of route.stationStops) {
          const key = st.edgeId + '@' + Math.round(st.s);
          const d = this.forwardDist(train.headS, st.s, route.totalLength);
          if (d < targetStopDist && (key !== train.lastHandledStopKey || d > 25)) {
            targetStopDist = d;
            stopAction = { type: 'DWELL', key, s: st.s };
          }
        }

        const brakeDist = (train.speed * train.speed) / (2 * train.decel);
        const lookahead = this.blockDistance + brakeDist * 0.45;
        // Station arrival priority: never stop halfway into a station when the path up to the platform stop mark is collision-free!
        const approachingStation = !!(stopAction && stopAction.type === 'DWELL' && targetStopDist < lookahead && targetStopDist < 260);
        const effectiveLookahead = approachingStation ? Math.min(lookahead, Math.max(10, targetStopDist + 10)) : lookahead;
        const reserve = this.canReserveAhead(train, route, effectiveLookahead, { skipThroatHold: approachingStation });
        train.currentBlockClearDist = reserve.blockedDist;

        if (!reserve.ok) {
          if (train.state !== 'WAITING') {
            train.state = 'WAITING';
            train.waitSince = this.simTime;
          }
          train.waitingForEdgeId = reserve.blockedEdgeId;
          train.speed = Math.max(0, train.speed - train.decel * 1.45 * dt);
          if (train.speed > 0.5 && this.canReserveAhead(train, route, Math.max(12, this.blockDistance * 0.72)).ok) {
            train.headS = route.wrapS(train.headS + train.speed * dt);
          } else {
            train.speed = 0;
          }
          this.updateTrainLock(train, route);
          continue;
        } else if (train.state === 'WAITING') {
          train.state = 'RUNNING';
          train.waitingForEdgeId = null;
        }

        let desiredSpeed = train.maxSpeed;
        if (stopAction && targetStopDist < 75) {
          desiredSpeed = Math.max(14, Math.sqrt(2 * train.decel * targetStopDist));
        }

        if (train.speed < desiredSpeed) train.speed = Math.min(desiredSpeed, train.speed + train.accel * dt);
        else train.speed = Math.max(desiredSpeed, train.speed - train.decel * dt);

        const stepDist = train.speed * dt;
        if (stopAction && stepDist >= targetStopDist && targetStopDist < 30) {
          train.headS = route.wrapS(stopAction.s);
          train.speed = 0;
          if (stopAction.type === 'TURNBACK') {
            train.state = 'TURNBACK';
            train.stateTimer = stopAction.isStationTurnback ? Math.max(lineTurnback, lineDwell) : lineTurnback;
            train.lastHandledTbKey = stopAction.key;
            train.lastHandledStopKey = null;
          } else {
            train.state = 'DWELL';
            train.stateTimer = lineDwell;
            train.lastHandledStopKey = stopAction.key;
            train.lastHandledTbKey = null;
          }
        } else {
          train.headS = route.wrapS(train.headS + stepDist);
          if (targetStopDist > 35) {
            if (train.lastHandledStopKey) {
              const prevSt = route.stationStops.find(st => st.edgeId + '@' + Math.round(st.s) === train.lastHandledStopKey);
              if (prevSt && this.forwardDist(prevSt.s, train.headS, route.totalLength) > 40) train.lastHandledStopKey = null;
            }
            if (train.lastHandledTbKey) {
              const prevTb = route.turnbackPoints.find(tb => tb.nodeId + '@' + tb.nodeIndex === train.lastHandledTbKey);
              if (prevTb && this.forwardDist(prevTb.s, train.headS, route.totalLength) > 40) train.lastHandledTbKey = null;
            }
          }
        }

        this.updateTrainLock(train, route);
      }
    }
  }

  // =========================================================================
  // 5. SandboxApp
  // =========================================================================
  class SandboxApp {
    constructor() {
      this.canvas = document.getElementById('metroCanvas');
      this.ctx = this.canvas.getContext('2d');
      this.canvasWrap = document.getElementById('canvasWrap');

      this.graph = new TrackGraph();
      this.platforms = new PlatformManager(this.graph);
      this.routes = new RouteManager(this.graph);
      this.dispatcher = new Dispatcher(this.graph, this.routes);
      this.dispatcher.platforms = this.platforms;

      this.cam = { x: 0, y: 0, zoom: 1 };
      this.dpr = window.devicePixelRatio || 1;
      this.width = 800;
      this.height = 600;

      // Theme
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('metro_sandbox_theme') || 'dark'; } catch (_) {}
      this.theme = savedTheme === 'light' ? 'light' : 'dark';
      this.applyTheme(this.theme, false);

      this.mode = 'simulate';
      this.showRoutes = true;
      this.showBlocks = true;
      this.selectedRouteId = null;
      this.selectedTrainId = null;
      this.hoveredNodeId = null;
      this.hoveredSnapPoint = null;
      this.activeSnapPopover = null;

      this.platformConfig = { length: 180, angleDeg: 0, name: '' };
      this.trackChainStartNode = null; // used as 2k+1 start point; resets after 2k+2 click (no auto-chain!)
      this.trackDrawStyle = 'l-bend'; // L形135°折线 (legacy s-bend saves still render cleanly)
      this.trackFlipL = false;
      this.trackContinuousMode = false; // 单段绘制 vs 连续绘制
      this.activeInlinePrompt = null; // { x, y, title, stepText, options }
      this.pendingPlacement = null;   // { pts, hits, switchCandidates, crossingChoices, switchChoices, stepIndex }
      this.collapsedLines = new Set();
      this.collapsedRoutes = new Set();
      this.expandedLineSettings = new Set();
      this.colorViewMode = 'line'; // 'line' = 默认模式 (线路标识色) | 'route' = 交路观察模式 (交路标识色)
      this.activeColorTarget = null;
      this.activeLineIdForDraft = null;
      this.inspectedRouteId = null;
      this.routeDraft = null;
      this.markTurnbackMode = false;
      this.newLineColor = PALETTE_COLORS[0];

      // Snap-to-existing-track state
      this.pendingTrackSnap = null;
      this.hoveredCandidateEdge = null;

      // Selection, Drag, Focus-Node & Route-Loop Insert state
      this.selectedEntity = null;
      this.draggingEntity = null;
      this.pendingRouteInsert = null;
      this.focusedNodeId = null;

      // Operational Diagnostics
      this.currentIssues = [];
      this.seenIssueKeys = new Set();
      this.diagOpen = false;
      this.lastDiagCheck = 0;

      // Undo / Redo History
      this.undoStack = [];
      this.redoStack = [];
      this.maxHistory = 60;

      this.mouseWorld = { x: 0, y: 0 };
      this.isPanning = false;
      this.panStart = { x: 0, y: 0, camX: 0, camY: 0 };
      this.spaceDown = false;
      this.lastFrameTime = performance.now();
      this.toastTimer = null;

      this.bindDOM();
      this.renderNewLineSwatches();
      this.resizeCanvas();
      this.loadClassicDemo();
      requestAnimationFrame(t => this.loop(t));
    }

    getPalette() {
      return THEME_PALETTES[this.theme] || THEME_PALETTES.dark;
    }

    applyTheme(theme, persist = true) {
      this.theme = theme;
      document.documentElement.dataset.theme = theme;
      const lbl = document.getElementById('themeLbl');
      if (lbl) lbl.textContent = theme === 'dark' ? '深色' : '浅色';
      if (persist) {
        try { localStorage.setItem('metro_sandbox_theme', theme); } catch (_) {}
      }
    }

    captureSnapshot() {
      return {
        graph: {
          nextNodeId: this.graph.nextNodeId,
          nextEdgeId: this.graph.nextEdgeId,
          nodes: Array.from(this.graph.nodes.values()).map(n => ({
            id: n.id, x: n.x, y: n.y, label: n.label,
            isStationEnd: n.isStationEnd, platformId: n.platformId,
            isSwitch: n.isSwitch !== undefined ? !!n.isSwitch : true,
            ...(n.isImplicit ? { isImplicit: true } : {})
          })),
          edges: Array.from(this.graph.edges.values()).map(e => ({
            id: e.id, from: e.from, to: e.to, length: e.length,
            isStationTrack: e.isStationTrack, platformId: e.platformId,
            platformLength: e.platformLength
          })),
          nextCrossingId: this.graph.nextCrossingId,
          crossings: Array.from(this.graph.crossings.values()).map(c => ({ ...c }))
        },
        platforms: {
          nextId: this.platforms.nextId,
          items: Array.from(this.platforms.platforms.values()).map(p => ({
            id: p.id, name: p.name, cx: p.cx, cy: p.cy,
            length: p.length, width: p.width, angleDeg: p.angleDeg, rad: p.rad,
            ...(p.zLayer ? { zLayer: p.zLayer } : {}),
            sides: {
              '-1': { ...p.sides['-1'] },
              '1': { ...p.sides['1'] }
            }
          }))
        },
        routes: {
          nextLineId: this.routes.nextLineId,
          nextRouteId: this.routes.nextRouteId,
          colorCursor: this.routes.colorCursor,
          lines: Array.from(this.routes.lines.values()).map(l => ({
            id: l.id, name: l.name, color: l.color, visible: l.visible,
            ...(l.speedKmh !== 80 ? { speedKmh: l.speedKmh } : {}),
            ...(l.dwellSec !== 1.8 ? { dwellSec: l.dwellSec } : {}),
            ...(l.turnbackSec !== 2.5 ? { turnbackSec: l.turnbackSec } : {})
          })),
          items: Array.from(this.routes.routes.values()).map(r => ({
            id: r.id, lineId: r.lineId, name: r.name, color: r.color,
            nodeIds: [...r.nodeIds],
            turnbackIndices: Array.from(r.turnbackIndices),
            skipStopKeys: Array.from(r.skipStopKeys || []),
            visible: r.visible, headwaySec: r.headwaySec, trainCount: r.trainCount,
            ...(r.customTrainLength ? { customTrainLength: r.customTrainLength } : {})
          }))
        }
      };
    }

    restoreSnapshot(snap, resetTrains = false) {
      this.graph.clear();
      this.graph.nextNodeId = snap.graph.nextNodeId;
      this.graph.nextEdgeId = snap.graph.nextEdgeId;
      for (const n of snap.graph.nodes) {
        this.graph.nodes.set(n.id, { ...n, isSwitch: n.isSwitch !== undefined ? !!n.isSwitch : true, lockedBy: null });
      }
      for (const e of snap.graph.edges) {
        this.graph.edges.set(e.id, { ...e, lockedBy: null });
      }
      this.graph.nextCrossingId = snap.graph.nextCrossingId || 1;
      for (const c of (snap.graph.crossings || [])) {
        this.graph.crossings.set(c.id, { ...c });
      }

      this.platforms.clear();
      this.platforms.nextId = snap.platforms.nextId;
      for (const p of snap.platforms.items) {
        this.platforms.platforms.set(p.id, {
          ...p,
          sides: { '-1': { ...p.sides['-1'] }, '1': { ...p.sides['1'] } }
        });
      }

      this.routes.clear();
      this.routes.nextLineId = snap.routes.nextLineId;
      this.routes.nextRouteId = snap.routes.nextRouteId;
      this.routes.colorCursor = snap.routes.colorCursor;
      for (const l of snap.routes.lines) {
        const line = new MetroLine(l.id, l.name, l.color, {
          speedKmh: l.speedKmh,
          dwellSec: l.dwellSec,
          turnbackSec: l.turnbackSec
        });
        line.visible = l.visible;
        this.routes.lines.set(line.id, line);
      }
      for (const r of snap.routes.items) {
        const route = new Route(r.id, r.lineId, r.name, r.color, r.nodeIds, r.turnbackIndices, r.skipStopKeys || []);
        route.visible = r.visible;
        route.headwaySec = r.headwaySec;
        route.trainCount = r.trainCount;
        if (r.customTrainLength) route.customTrainLength = Number(r.customTrainLength);
        route.buildGeometry(this.graph);
        this.routes.routes.set(route.id, route);
      }

      this.trackChainStartNode = null;
      this.routeDraft = null;
      this.pendingTrackSnap = null;
      this.hoveredCandidateEdge = null;
      this.selectedTrainId = null;
      if (this.selectedRouteId && !this.routes.routes.has(this.selectedRouteId)) {
        this.selectedRouteId = null;
      }
      if (this.inspectedRouteId && !this.routes.routes.has(this.inspectedRouteId)) {
        this.inspectedRouteId = null;
      }
      if (this.activeLineIdForDraft && !this.routes.lines.has(this.activeLineIdForDraft)) {
        this.activeLineIdForDraft = this.routes.lines.keys().next().value || null;
      }
      this.hideSnapPopover();
      this.dispatcher.syncTrainsWithRoutes(resetTrains);
      this.renderSubbar();
      this.renderLineTree();
    }

    updateHistoryButtons() {
      const u = document.getElementById('btnUndo');
      const r = document.getElementById('btnRedo');
      if (u) u.disabled = this.undoStack.length === 0;
      if (r) r.disabled = this.redoStack.length === 0;
    }

    pushHistory(label = '') {
      this.undoStack.push({ label, data: this.captureSnapshot() });
      if (this.undoStack.length > this.maxHistory) this.undoStack.shift();
      this.redoStack.length = 0;
      this.updateHistoryButtons();
    }

    undo() {
      if (this.undoStack.length === 0) return;
      this.hideInlinePrompt();
      this.hideSnapPopover();
      this.pendingTrackSnap = null;
      this.draggingEntity = null;
      const entry = this.undoStack.pop();
      this.redoStack.push({ label: entry.label, data: this.captureSnapshot() });
      this.restoreSnapshot(entry.data);
      this.updateHistoryButtons();
      this.refreshDiagnostics();
      this.showToast(`已撤回${entry.label ? '：' + entry.label : ''}`);
    }

    redo() {
      if (this.redoStack.length === 0) return;
      this.hideInlinePrompt();
      this.hideSnapPopover();
      this.pendingTrackSnap = null;
      this.draggingEntity = null;
      const entry = this.redoStack.pop();
      this.undoStack.push({ label: entry.label, data: this.captureSnapshot() });
      this.restoreSnapshot(entry.data);
      this.updateHistoryButtons();
      this.refreshDiagnostics();
      this.showToast(`已复原${entry.label ? '：' + entry.label : ''}`);
    }

    exportSave() {
      const payload = {
        app: 'MetroSandbox',
        version: 1,
        exportedAt: new Date().toISOString(),
        theme: this.theme,
        blockDistance: this.dispatcher.blockDistance,
        snapshot: this.captureSnapshot()
      };
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `metro_sandbox_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      this.showToast('已导出线网与交路存档 (.json)');
    }

    importSaveFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          const snap = parsed.snapshot || parsed;
          if (!snap || !snap.graph || !Array.isArray(snap.graph.nodes) || !Array.isArray(snap.graph.edges)) {
            this.showToast('存档格式无效：缺少轨道拓扑数据');
            return;
          }
          if (!snap.platforms) snap.platforms = { nextId: 1, items: [] };
          if (!snap.routes) snap.routes = { nextLineId: 1, nextRouteId: 1, colorCursor: 0, lines: [], items: [] };
          this.pushHistory('导入存档');
          this.restoreSnapshot(snap, true);
          if (typeof parsed.blockDistance === 'number') {
            this.dispatcher.blockDistance = clamp(parsed.blockDistance, 15, 260);
            const sl = document.getElementById('blockDistSlider');
            const vl = document.getElementById('blockDistVal');
            if (sl) sl.value = String(this.dispatcher.blockDistance);
            if (vl) vl.textContent = this.dispatcher.blockDistance + 'm';
          }
          this.fitToView();
          this.refreshDiagnostics();
          this.showToast(`已成功导入存档（${this.routes.lines.size} 条线路 / ${this.routes.routes.size} 条交路）`);
        } catch (err) {
          this.showToast('导入失败：JSON 文件解析错误');
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    screenToWorld(sx, sy) {
      return { x: (sx - this.cam.x) / this.cam.zoom, y: (sy - this.cam.y) / this.cam.zoom };
    }

    resizeCanvas() {
      const rect = this.canvasWrap.getBoundingClientRect();
      this.width = Math.max(300, rect.width);
      this.height = Math.max(240, rect.height);
      this.dpr = window.devicePixelRatio || 1;
      this.canvas.width = Math.round(this.width * this.dpr);
      this.canvas.height = Math.round(this.height * this.dpr);
      this.canvas.style.width = this.width + 'px';
      this.canvas.style.height = this.height + 'px';
    }

    fitToView() {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const n of this.graph.nodes.values()) {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x);
        maxY = Math.max(maxY, n.y);
      }
      for (const p of this.platforms.platforms.values()) {
        const r = p.length / 2 + 24;
        minX = Math.min(minX, p.cx - r);
        minY = Math.min(minY, p.cy - r);
        maxX = Math.max(maxX, p.cx + r);
        maxY = Math.max(maxY, p.cy + r);
      }
      if (!isFinite(minX)) {
        this.cam = { x: this.width / 2, y: this.height / 2, zoom: 1 };
        this.updateZoomHUD();
        return;
      }
      const pad = 42;
      const bw = Math.max(200, maxX - minX + pad * 2);
      const bh = Math.max(200, maxY - minY + pad * 2);
      const zoom = clamp(Math.min(this.width / bw, this.height / bh), 0.28, 1.5);
      this.cam.zoom = zoom;
      this.cam.x = this.width / 2 - ((minX + maxX) / 2) * zoom;
      this.cam.y = this.height / 2 - ((minY + maxY) / 2) * zoom;
      this.updateZoomHUD();
    }

    focusNodeOnMap(nodeId) {
      const n = this.graph.getNode(nodeId);
      if (!n) return;
      this.focusedNodeId = nodeId;
      this.cam.zoom = Math.max(this.cam.zoom, 0.95);
      this.cam.x = this.width / 2 - n.x * this.cam.zoom;
      this.cam.y = this.height / 2 - n.y * this.cam.zoom;
      this.updateZoomHUD();
    }

    updateZoomHUD() {
      document.getElementById('hudZoom').textContent = Math.round(this.cam.zoom * 100) + '%';
    }

    showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    setMode(newMode) {
      this.mode = newMode;
      this.trackChainStartNode = null;
      this.pendingTrackSnap = null;
      this.hoveredCandidateEdge = null;
      this.draggingEntity = null;
      if (newMode !== 'select') this.selectedEntity = null;
      this.hideSnapPopover();
      if (newMode !== 'route') {
        this.routeDraft = null;
        this.pendingRouteInsert = null;
        this.markTurnbackMode = false;
      } else if (!this.activeLineIdForDraft && this.routes.lines.size > 0) {
        this.activeLineIdForDraft = this.routes.lines.keys().next().value;
      }
      // In simulate mode, keep inspectedRouteId allowed for read-only viewing (routeDraft is cleared above)
      document.querySelectorAll('#modeGroup .mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === newMode);
      });
      this.canvas.style.cursor = newMode === 'simulate' ? 'default' : 'crosshair';
      this.renderSubbar();
      this.renderLineTree();
      this.updateHintHUD();
    }

    updateHintHUD() {}

    openLineCreator() {
      const box = document.getElementById('lineCreator');
      const input = document.getElementById('newLineNameInput');
      this.newLineColor = PALETTE_COLORS[this.routes.lines.size % PALETTE_COLORS.length];
      this.renderNewLineSwatches();
      input.value = `${this.routes.nextLineId}号线`;
      box.classList.add('open');
      input.focus();
      input.select();
    }

    closeLineCreator() {
      document.getElementById('lineCreator').classList.remove('open');
    }

    renderNewLineSwatches() {
      const row = document.getElementById('newLineSwatches');
      row.innerHTML = PALETTE_COLORS.map(c =>

      ).join('');

    getEffectiveRouteColor(route) {
      if (!route) return '#0ea5e9';
      if (this.colorViewMode === 'route') return route.color;
      const line = this.routes.getLine(route.lineId);
      return (line && line.color) ? line.color : route.color;
    }

    openColorPicker(anchorEl, title, initialColor, onApply) {
      const pop = document.getElementById('colorPickerPopover');
      const nativeInp = document.getElementById('cpNativeInput');
      const hexInp = document.getElementById('cpHexInput');
      const grid = document.getElementById('cpPresetGrid');
      const presets = [
        '#0ea5e9', '#10b981', '#ec4899', '#eab308', '#8b5cf6', '#f97316', '#14b8a6', '#ef4444',
        '#3b82f6', '#22c55e', '#d946ef', '#f59e0b', '#6366f1', '#06b6d4', '#84cc16', '#64748b'
      ];
      const normHex = (val) => {
        let s = String(val || '').trim();
        if (!s.startsWith('#')) s = '#' + s;
        if (/^#[0-9a-fA-F]{3}$/.test(s)) {
          s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
        }
        return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : null;
      };
      const cur = normHex(initialColor) || '#0ea5e9';
      document.getElementById('cpTitle').textContent = title || '颜色设置';
      nativeInp.value = cur;
      hexInp.value = cur.toUpperCase();
      this.activeColorTarget = { onApply, normHex };
      grid.innerHTML = presets.map(c =>
        `<button class="cp-swatch" data-cp-color="${c}" style="background:${c}" title="${c.toUpperCase()}"></button>`
      ).join('');
      grid.querySelectorAll('.cp-swatch').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const c = btn.dataset.cpColor;
          nativeInp.value = c;
          hexInp.value = c.toUpperCase();
          onApply(c);
        });
      });

      const rect = anchorEl.getBoundingClientRect();
      const popW = 214, popH = 152;
      const left = clamp(rect.left - popW - 8 < 8 ? rect.right + 8 : rect.left - popW - 8, 8, window.innerWidth - popW - 8);
      const top = clamp(rect.top, 8, window.innerHeight - popH - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      pop.classList.add('visible');
    }

    hideColorPicker() {
      this.activeColorTarget = null;
      const pop = document.getElementById('colorPickerPopover');
      if (pop) pop.classList.remove('visible');
    }

    normalizeDraftGaps(ids) {
      const GAP = '__GAP__';
      let changed = true;
      while (changed) {
        changed = false;
        // 1. Collapse consecutive GAPs (linear & cyclic wrap-around)
        for (let i = 0; i < ids.length; i++) {
          if (ids[i] === GAP && ids[(i + 1) % ids.length] === GAP) {
            ids.splice((i + 1) % ids.length, 1);
            changed = true;
            break;
          }
        }
        if (changed) continue;
        // 2. Remove isolated orphan real node sandwiched between two GAPs (cyclic)
        const realCount = ids.filter(x => x !== GAP).length;
        if (realCount > 2) {
          for (let i = 0; i < ids.length; i++) {
            if (ids[i] === GAP) continue;
            const prev = ids[(i - 1 + ids.length) % ids.length];
            const next = ids[(i + 1) % ids.length];
            if (prev === GAP && next === GAP) {
              ids.splice(i, 1);
              changed = true;
              break;
            }
          }
        }
      }
      // Keep first element a real node when possible so indexing stays intuitive
      if (ids.length > 1 && ids[0] === GAP) {
        ids.push(ids.shift());
      }
      return ids;
    }

    getDraftTargetAfter(ids, pos) {
      const GAP = '__GAP__';
      const n = ids.length;
      if (n < 2) return null;
      const next1 = ids[(pos + 1) % n];
      if (next1 === GAP) {
        const next2 = ids[(pos + 2) % n];
        return (next2 && next2 !== GAP) ? next2 : null;
      }
      return next1 || null;
    }

    deleteSelectedDraftSegment() {
      const GAP = '__GAP__';
      const draft = this.routeDraft;
      if (!draft || draft.selectedSegIdx === null || draft.selectedSegIdx === undefined) return;
      const ids = draft.nodeIds;
      const idx = draft.selectedSegIdx;
      const n = ids.length;
      if (idx < 0 || idx >= n || ids[idx] === GAP) return;
      const nextIdx = (idx + 1) % n;
      if (ids[nextIdx] === GAP) return;

      // Cut ONLY this exact segment by inserting a GAP marker between ids[idx] and ids[nextIdx]
      const leftNodeId = ids[idx];
      if (idx === n - 1) ids.push(GAP);
      else ids.splice(idx + 1, 0, GAP);

      this.normalizeDraftGaps(ids);
      draft.selectedSegIdx = null;
      // Focus the newly opened gap slot so user can either keep deleting segments or click '+' to re-route
      const newLeftIdx = ids.indexOf(leftNodeId);
      draft.lastCutSlotIdx = newLeftIdx >= 0 ? newLeftIdx : null;
      if (draft.insertAfterIdx !== null && draft.insertAfterIdx >= ids.length) {
        draft.insertAfterIdx = null;
      }
      this.renderSubbar();
      this.renderLineTree();
    }

    findDraftSegmentAt(wx, wy, threshold = 12) {
      const GAP = '__GAP__';
      const draft = this.routeDraft;
      if (!draft || draft.nodeIds.length < 2) return null;
      const ids = draft.nodeIds;
      const n = ids.length;
      const RIGHT_OFFSET = 6;
      const hasWrap = n >= 3 && ids[0] !== GAP && ids[n - 1] !== GAP && (draft.editingRouteId || !!this.graph.getEdgeBetween(ids[n - 1], ids[0]));
      const segCount = hasWrap ? n : n - 1;
      let bestIdx = null;
      let bestD = threshold;
      for (let i = 0; i < segCount; i++) {
        const nextIdx = (i + 1) % n;
        if (ids[i] === GAP || ids[nextIdx] === GAP) continue;
        const a = this.graph.getNode(ids[i]);
        const b = this.graph.getNode(ids[nextIdx]);
        if (!a || !b) continue;
        const segLen = dist(a.x, a.y, b.x, b.y);
        if (segLen < 1e-3) continue;
        const tx = (b.x - a.x) / segLen;
        const ty = (b.y - a.y) / segLen;
        const rx = -ty, ry = tx;
        const pOff = pointToSegmentDist(wx, wy, a.x + rx * RIGHT_OFFSET, a.y + ry * RIGHT_OFFSET, b.x + rx * RIGHT_OFFSET, b.y + ry * RIGHT_OFFSET);
        const pCenter = pointToSegmentDist(wx, wy, a.x, a.y, b.x, b.y);
        // Prefer the right-hand directional offset line so outbound & inbound on shared tracks select cleanly
        const effD = Math.min(pOff.dist, pCenter.dist + 2.5);
        if (effD < bestD) {
          bestD = effD;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    renderSubbar() {
      const bar = document.getElementById('modePanel');

      const lineHeadBlock = document.getElementById('lineListHeaderBlock');
      const treeWrap = document.getElementById('treeWrap');
      const inspector = document.getElementById('trainInspector');

      const addLineBtn = document.getElementById('btnOpenLineCreator');

      if (inspector) inspector.style.display = this.mode === 'simulate' ? '' : 'none';
      if (lineHeadBlock) lineHeadBlock.style.display = (showRoutesSidebar && !isDetailView) ? '' : 'none';

      if (this.pendingTrackSnap) {

          <div class="mode-panel-row">

      }
      if (this.pendingRouteInsert) {

          <div class="mode-panel-row">
            <span class="subbar-lbl" style="color:var(--accent)">在「${r ? r.name : ''}」的 ${fromId} → ${toId} 之间插入：请点击画布节点</span>

          </div>

          this.renderSubbar();
          this.renderLineTree();

      if (this.mode === 'select') {

            const p = this.platforms.getPlatform(this.selectedEntity.id);

          } else if (this.selectedEntity.type === 'edge') {
            const e = this.graph.edges.get(this.selectedEntity.id);
            desc = `已选中轨道 ${this.selectedEntity.id}${e ? ` (${Math.round(e.length)}m)` : ''}`;
          }
          const selPlat = this.selectedEntity.type === 'platform' ? this.platforms.getPlatform(this.selectedEntity.id) : null;
          const selNode = this.selectedEntity.type === 'node' ? this.graph.getNode(this.selectedEntity.id) : null;
          const canToggleSwitch = !!(selNode && this.graph.classifyNode(selNode.id) === 'switch');
          const canSplit = this.selectedEntity.type === 'edge' && this.graph.edges.get(this.selectedEntity.id) && !this.graph.edges.get(this.selectedEntity.id).isStationTrack;
          bar.innerHTML = `
            <div class="mode-panel-row" style="justify-content:space-between;">
              <span class="subbar-lbl" style="color:var(--text-main);">${desc}</span>
              <button class="btn btn-danger btn-xs" id="btnDeleteSelected">删除 (Del)</button>
            </div>
            ${selPlat ? `<div class="mode-panel-row"><span class="subbar-lbl">站名</span><input class="input-sm" id="editPlatNameInput" value="${selPlat.name.replace(/"/g, '&quot;')}" placeholder="输入站名" style="flex:1;min-width:0;"></div>` : ''}
            ${canToggleSwitch ? `
              <div class="mode-panel-row">
                <span class="subbar-lbl">道岔</span>
                <div class="chip-group">
                  <button class="chip ${selNode.isSwitch ? 'active' : ''}" id="btnEnableSwitch">开启道岔</button>

                </div>
              </div>
            ` : ''}
            ${canSplit ? '<div class="mode-panel-row"><button class="btn btn-primary btn-xs" id="btnSplitSelectedEdge">轨中加点</button></div>' : ''}

          if (canToggleSwitch) {
            const setSw = (val) => {
              if (selNode.isSwitch === val) return;
              if (val && this.graph.findBridgeNear(selNode.x, selNode.y, 20)) {
                this.showToast('禁止在立交桥上下方开设道岔');
                return;

              this.pushHistory(val ? '开启道岔' : '关闭道岔');
              selNode.isSwitch = val;
              this.routes.rebuildAll();
              this.dispatcher.syncTrainsWithRoutes();
              this.renderSubbar();
              this.renderLineTree();
              this.refreshDiagnostics();
              this.showToast(`节点 ${selNode.id} 已${val ? '开启道岔' : '关闭道岔（断头路）'}`);

            document.getElementById('btnEnableSwitch').addEventListener('click', () => setSw(true));
            document.getElementById('btnDisableSwitch').addEventListener('click', () => setSw(false));
          }
          if (selPlat) {
            const inp = document.getElementById('editPlatNameInput');

              if (!pushedRename) { this.pushHistory('修改站名'); pushedRename = true; }
              selPlat.name = e.target.value;
            });
