          if (canSplit) {
            document.getElementById('btnSplitSelectedEdge').addEventListener('click', () => {
              const e = this.graph.edges.get(this.selectedEntity.id);
              if (!e) return;
              const a = this.graph.getNode(e.from);
              const b = this.graph.getNode(e.to);
              if (!a || !b) return;
              this.pushHistory('在轨道中插入节点');
              const split = this.graph.splitEdgeAt(e.id, (a.x + b.x) / 2, (a.y + b.y) / 2);
              if (split) {
                this.routes.handleEdgeSplit(split.oldFrom, split.oldTo, split.node.id);
                this.routes.rebuildAll();
                this.dispatcher.syncTrainsWithRoutes();
                this.selectedEntity = { type: 'node', id: split.node.id };
                this.renderSubbar();
                this.renderLineTree();
                this.showToast(`已在轨道中插入节点 ${split.node.id}`);
              }
            });
          }
          document.getElementById('btnDeleteSelected').addEventListener('click', () => this.deleteSelectedEntity());
        } else {
          bar.innerHTML = `<span class="subbar-lbl">点击并拖拽任意节点或站台即可移动，选中后按 Delete 删除</span>`;
        }
        return;
      }
      if (this.mode === 'platform') {
        bar.style.display = 'flex';
        bar.innerHTML = `
          <div class="mode-panel-row">
            <span class="subbar-lbl">长度</span>
            <div class="chip-group" id="subLenGroup">
              <button class="chip ${this.platformConfig.length === 120 ? 'active' : ''}" data-len="120">4编 120m</button>
              <button class="chip ${this.platformConfig.length === 180 ? 'active' : ''}" data-len="180">6编 180m</button>
              <button class="chip ${this.platformConfig.length === 240 ? 'active' : ''}" data-len="240">8编 240m</button>
            </div>
          </div>
          <div class="mode-panel-row">
            <span class="subbar-lbl">朝向</span>
            <div class="chip-group" id="subAngGroup">
              <button class="chip ${this.platformConfig.angleDeg === 0 ? 'active' : ''}" data-ang="0">0°</button>
              <button class="chip ${this.platformConfig.angleDeg === 45 ? 'active' : ''}" data-ang="45">45°</button>
              <button class="chip ${this.platformConfig.angleDeg === 90 ? 'active' : ''}" data-ang="90">90°</button>
              <button class="chip ${this.platformConfig.angleDeg === 135 ? 'active' : ''}" data-ang="135">135°</button>
            </div>
          </div>
          <div class="mode-panel-row">
            <span class="subbar-lbl">站名</span>
            <input class="input-sm" id="subPlatName" placeholder="站名 (可选)" style="flex:1;min-width:0;" value="${this.platformConfig.name}">
          </div>
        `;
        bar.querySelectorAll('#subLenGroup .chip').forEach(b => b.addEventListener('click', () => {
          this.platformConfig.length = Number(b.dataset.len);
          this.renderSubbar();
        }));
        bar.querySelectorAll('#subAngGroup .chip').forEach(b => b.addEventListener('click', () => {
          this.platformConfig.angleDeg = Number(b.dataset.ang);
          this.renderSubbar();
        }));
        document.getElementById('subPlatName').addEventListener('input', e => {
          this.platformConfig.name = e.target.value;
        });
      } else if (this.mode === 'track') {
        bar.style.display = 'flex';
        bar.innerHTML = `
          <div class="mode-panel-row" style="justify-content:space-between;">
            <span class="subbar-lbl" style="color:var(--accent)">L形 135° 折线</span>
            <span class="subbar-lbl">${this.trackChainStartNode ? (this.trackContinuousMode ? '点击下一点连续铺轨' : '点击终点（折角自动生点）') : '点击起点 → 终点铺轨'}</span>
          </div>
          <div class="mode-panel-row">
            <span class="subbar-lbl">绘制</span>
            <div class="chip-group" id="subTrackContGroup">
              <button class="chip ${!this.trackContinuousMode ? 'active' : ''}" data-cont="0">单段绘制</button>
              <button class="chip ${this.trackContinuousMode ? 'active' : ''}" data-cont="1">连续绘制 (C)</button>
            </div>
          </div>
          <div class="mode-panel-row">
            <button class="btn btn-xs" id="btnFlipL">⇄ 翻转折向 (R)</button>
            <button class="btn btn-xs" id="btnEndChain" ${this.trackChainStartNode ? '' : 'disabled'}>${this.trackContinuousMode ? '结束连续 (Esc)' : '取消起点 (Esc)'}</button>
          </div>
        `;
        bar.querySelectorAll('#subTrackContGroup .chip').forEach(b => b.addEventListener('click', () => {
          this.trackContinuousMode = b.dataset.cont === '1';
          if (!this.trackContinuousMode) this.trackChainStartNode = null;
          this.renderSubbar();
        }));
        const flipBtn = document.getElementById('btnFlipL');
        if (flipBtn) flipBtn.addEventListener('click', () => { this.trackFlipL = !this.trackFlipL; });
        document.getElementById('btnEndChain').addEventListener('click', () => {
          this.trackChainStartNode = null;
          this.renderSubbar();
        });
      } else if (this.mode === 'route') {
        if (!this.routeDraft) {
          bar.style.display = 'none';
          bar.innerHTML = '';
        } else {
          const hasSelSeg = !!(this.routeDraft.selectedSegIdx !== null && this.routeDraft.selectedSegIdx !== undefined && this.routeDraft.nodeIds.length >= 2 && this.routeDraft.nodeIds[this.routeDraft.selectedSegIdx] !== '__GAP__');
          const selA = hasSelSeg ? this.routeDraft.nodeIds[this.routeDraft.selectedSegIdx] : '';
          const selB = hasSelSeg ? (this.getDraftTargetAfter(this.routeDraft.nodeIds, this.routeDraft.selectedSegIdx) || '') : '';
          const insIdx = this.routeDraft.insertAfterIdx;
          const insA = (insIdx !== null && insIdx !== undefined && this.routeDraft.nodeIds[insIdx] && this.routeDraft.nodeIds[insIdx] !== '__GAP__') ? this.routeDraft.nodeIds[insIdx] : '';
          const insB = (insIdx !== null && insIdx !== undefined) ? (this.getDraftTargetAfter(this.routeDraft.nodeIds, insIdx) || '') : '';
          if (!hasSelSeg && (insIdx === null || insIdx === undefined)) {
            bar.style.display = 'none';
            bar.innerHTML = '';
          } else {
            bar.style.display = 'flex';
            const draftHint = hasSelSeg ? `已选线段 ${selA} → ${selB}` : `连续插入 ${insA} → ${insB}`;
            bar.innerHTML = `
              <div class="mode-panel-row" style="justify-content:space-between;">
                <span class="subbar-lbl" style="font-weight:600;color:var(--accent)">${draftHint}</span>
                ${hasSelSeg ? '<button class="btn btn-danger btn-xs" id="subDeleteDraftSeg">删除此线段</button>' : ''}
                ${insIdx !== null && insIdx !== undefined ? '<button class="btn btn-xs" id="subStopInsert">结束插入</button>' : ''}
              </div>
            `;
            const delSegBtn = document.getElementById('subDeleteDraftSeg');
            if (delSegBtn) delSegBtn.addEventListener('click', () => this.deleteSelectedDraftSegment());
            const stopInsBtn = document.getElementById('subStopInsert');
            if (stopInsBtn) stopInsBtn.addEventListener('click', () => {
              if (this.routeDraft) this.routeDraft.insertAfterIdx = null;
              this.renderSubbar();
              this.renderLineTree();
            });
          }
        }
      } else {
        bar.style.display = 'none';
      }
    }

    startRouteDraft(lineId) {
      const line = this.routes.getLine(lineId);
      if (!line) {
        this.openLineCreator();
        this.showToast('交路必须归属于线路，请先创建一条线路');
        return;
      }
      this.activeLineIdForDraft = line.id;
      const siblings = this.routes.getRoutesByLine(line.id).length;
      const letter = String.fromCharCode(65 + (siblings % 26));
      this.inspectedRouteId = null;
      this.routeDraft = {
        editingRouteId: null,
        lineId: line.id,
        name: `交路 ${letter}`,
        color: siblings === 0 ? line.color : this.routes.nextColor(),
        customTrainLength: 120,
        nodeIds: [],
        turnbackIndices: new Set(),
        skipStopKeys: new Set(),
        insertAfterIdx: null
      };
      this.markTurnbackMode = false;
      this.setMode('route');
      this.showToast(`正在为「${line.name}」绘制下属交路，编辑完成后点击「闭合保存」`);
    }

    startEditRoute(routeId) {
      const route = this.routes.routes.get(routeId);
      if (!route) return;
      this.activeLineIdForDraft = route.lineId;
      this.selectedRouteId = routeId;
      this.inspectedRouteId = routeId;
      this.pendingRouteInsert = null;
      const draftNodes = [];
      const rawIds = route.nodeIds || [];
      for (let i = 0; i < rawIds.length; i++) {
        const nid = rawIds[i];
        if (!this.graph.getNode(nid)) {
          draftNodes.push('__GAP__');
          continue;
        }
        draftNodes.push(nid);
        const nextId = rawIds[(i + 1) % rawIds.length];
        if (nextId && this.graph.getNode(nextId) && !this.graph.getEdgeBetween(nid, nextId)) {
          draftNodes.push('__GAP__');
        }
      }
      this.normalizeDraftGaps(draftNodes);
      this.routeDraft = {
        editingRouteId: route.id,
        lineId: route.lineId,
        name: route.name,
        color: route.color,
        customTrainLength: route.customTrainLength || route.trainLength || 120,
        nodeIds: draftNodes,
        turnbackIndices: new Set(route.turnbackIndices),
        skipStopKeys: new Set(route.skipStopKeys || []),
        insertAfterIdx: null,
        selectedSegIdx: null
      };
      this.setMode('route');
      this.showToast(`已进入「${route.name}」编辑模式：可自由增删节点，完成后点击「保存交路」`);
    }

    handleRouteNodeClick(node) {
      if (this.routes.lines.size === 0) {
        this.openLineCreator();
        this.showToast('请先创建线路，再绘制下属交路');
        return;
      }

      if (!this.routeDraft) {
        if (this.markTurnbackMode && this.selectedRouteId) {
          const r = this.routes.routes.get(this.selectedRouteId);
          if (r) {
            const idx = r.nodeIds.indexOf(node.id);
            if (idx !== -1) {
              this.pushHistory('切换折返点');
              if (r.turnbackIndices.has(idx)) r.turnbackIndices.delete(idx);
              else r.turnbackIndices.add(idx);
              r.buildGeometry(this.graph);
              this.dispatcher.syncTrainsWithRoutes();
              this.renderLineTree();
              this.showToast(`已更新「${r.name}」折返点`);
              return;
            }
          }
        }
        this.startRouteDraft(this.activeLineIdForDraft || this.routes.lines.keys().next().value);
      }

      const draft = this.routeDraft;
      if (this.markTurnbackMode) {
        const idx = draft.nodeIds.lastIndexOf(node.id);
        if (idx !== -1) {
          if (draft.turnbackIndices.has(idx)) draft.turnbackIndices.delete(idx);
          else draft.turnbackIndices.add(idx);
          this.renderLineTree();
        } else {
          this.showToast('请先将该节点加入路径再标记折返点');
        }
        return;
      }

      // Continuous '+' insertion: insert node-by-node (auto-bridging from leftId) and keep inserting until connected to rightId!
      if (draft.insertAfterIdx !== null && draft.insertAfterIdx !== undefined) {
        const GAP = '__GAP__';
        draft.selectedSegIdx = null;
        draft.lastCutSlotIdx = null;
        let len = draft.nodeIds.length;
        let pos = clamp(draft.insertAfterIdx, 0, Math.max(0, len - 1));
        if (draft.nodeIds[pos] === GAP) pos = (pos - 1 + len) % len;
        const leftId = draft.nodeIds[pos];
        const prevCandidate = len >= 2 ? draft.nodeIds[(pos - 1 + len) % len] : null;
        const prevOfLeft = (prevCandidate && prevCandidate !== GAP) ? prevCandidate : null;

        // Ensure a GAP marker exists immediately after pos while inserting so partial detours stay visibly open until connected
        const nextIdx = (pos + 1) % len;
        let gapIdx;
        if (draft.nodeIds[nextIdx] === GAP) {
          gapIdx = nextIdx;
        } else {
          if (pos === len - 1) {
            draft.nodeIds.push(GAP);
            gapIdx = draft.nodeIds.length - 1;
          } else {
            draft.nodeIds.splice(pos + 1, 0, GAP);
            gapIdx = pos + 1;
          }
          len = draft.nodeIds.length;
        }
        const rightCandidate = draft.nodeIds[(gapIdx + 1) % len];
        const rightId = (rightCandidate && rightCandidate !== GAP) ? rightCandidate : null;

        if (node.id === leftId) {
          this.showToast(`当前插入起点已为 ${node.id}`);
          return;
        }
        // Clicking rightId directly attempts shortest-rail-path auto-bridge & closes the gap
        if (rightId && node.id === rightId) {
          const direct = !!this.graph.getEdgeBetween(leftId, rightId);
          const pBridge = !direct ? this.graph.findRailPath(leftId, rightId, prevOfLeft) : null;
          if (direct) {
            draft.nodeIds.splice(gapIdx, 1);
            draft.insertAfterIdx = null;
          } else if (pBridge && pBridge.length >= 2) {
            draft.nodeIds.splice(gapIdx, 1, ...pBridge.slice(1, -1));
            draft.insertAfterIdx = null;
          } else {
            this.showToast(`${leftId} 与 ${rightId} 之间暂无连通路径`);
            return;
          }
          this.renderSubbar();
          this.renderLineTree();
          return;
        }

        // Insert from leftId to clicked node right BEFORE the GAP marker
        const directLeft = !!this.graph.getEdgeBetween(leftId, node.id);
        const pLeft = !directLeft ? this.graph.findRailPath(leftId, node.id, prevOfLeft) : null;
        const toInsert = directLeft ? [node.id] : (pLeft && pLeft.length > 1 ? pLeft.slice(1) : [node.id]);
        draft.nodeIds.splice(gapIdx, 0, ...toInsert);
        const newPos = gapIdx + toInsert.length - 1;
        const newGapIdx = gapIdx + toInsert.length;

        // Connected to rightId? Heal and remove GAP, then automatically exit continuous insert mode!
        if (rightId && this.graph.getEdgeBetween(node.id, rightId)) {
          draft.nodeIds.splice(newGapIdx, 1);
          draft.insertAfterIdx = null;
        } else {
          // Stay in continuous insertion mode right after the newly inserted node!
          draft.insertAfterIdx = newPos;
        }
        this.renderSubbar();
        this.renderLineTree();
        return;
      }

      if (draft.nodeIds.length === 0) {
        draft.nodeIds.push(node.id);
        this.renderSubbar();
        this.renderLineTree();
        return;
      }

      const lastId = draft.nodeIds[draft.nodeIds.length - 1];
      if (node.id === lastId) {
        this.showToast(`当前末端已是 ${node.id}，请点击下一个节点`);
        return;
      }

      // For brand-new drafts, clicking start node when >=2 nodes attempts save if directly connected
      if (!draft.editingRouteId && node.id === draft.nodeIds[0] && draft.nodeIds.length >= 2 && this.graph.getEdgeBetween(lastId, node.id)) {
        this.finishRouteDraft();
        return;
      }

      // If non-adjacent to lastId, automatically bridge via physics-aware rail shortest path!
      if (this.graph.getEdgeBetween(lastId, node.id)) {
        draft.nodeIds.push(node.id);
      } else {
        const prevOfLast = draft.nodeIds.length >= 2 ? draft.nodeIds[draft.nodeIds.length - 2] : null;
        const sp = this.graph.findRailPath(lastId, node.id, prevOfLast);
        if (sp && sp.length > 1) {
          draft.nodeIds.push(...sp.slice(1));
        } else {
          draft.nodeIds.push(node.id);
          this.showToast(`提示：${lastId} 与 ${node.id} 尚不连通，已暂存节点`);
        }
      }
      this.renderSubbar();
      this.renderLineTree();
    }

    finishRouteDraft() {
      const draft = this.routeDraft;
      if (!draft || draft.nodeIds.filter(x => x !== '__GAP__').length < 2) {
        this.showToast('交路至少需要 2 个节点');
        return;
      }
      const gapPos = draft.nodeIds.indexOf('__GAP__');
      if (gapPos !== -1) {
        const n = draft.nodeIds.length;
        const aId = draft.nodeIds[(gapPos - 1 + n) % n];
        const bId = draft.nodeIds[(gapPos + 1) % n];
        draft.lastCutSlotIdx = (gapPos - 1 + n) % n;
        this.renderLineTree();
        this.showToast(`无法保存：${aId} 与 ${bId} 之间已断开，请点击「+」补全路径`);
        return;
      }
      // Remove consecutive duplicates if user deleted a node between identical neighbors
      const cleaned = [];
      for (const nid of draft.nodeIds) {
        if (cleaned.length === 0 || cleaned[cleaned.length - 1] !== nid) cleaned.push(nid);
      }
      if (cleaned.length > 1 && cleaned[0] === cleaned[cleaned.length - 1]) cleaned.pop();
      if (cleaned.length < 2) {
        this.showToast('有效节点不足 2 个，请继续编辑');
        return;
      }

      // Check every adjacent pair (including closing edge) is connected by a physical track edge
      const m = cleaned.length;
      for (let i = 0; i < m; i++) {
        const aId = cleaned[i];
        const bId = cleaned[(i + 1) % m];
        if (!this.graph.getEdgeBetween(aId, bId)) {
          this.focusNodeOnMap(aId);
          this.showToast(`无法保存：${aId} → ${bId} 之间没有直连轨道，请点击「+」插入中间节点或删去断点`);
          return;
        }
      }

      let saved = null;
      if (draft.editingRouteId && this.routes.routes.has(draft.editingRouteId)) {
        this.pushHistory('编辑交路');
        saved = this.routes.routes.get(draft.editingRouteId);
        saved.lineId = draft.lineId;
        saved.name = draft.name.trim() || saved.name;
        saved.nodeIds = cleaned;
        saved.skipStopKeys = new Set(draft.skipStopKeys || []);
        if (draft.customTrainLength) saved.customTrainLength = Number(draft.customTrainLength);
        saved.buildGeometry(this.graph);
      } else {
        this.pushHistory('新建交路');
        saved = this.routes.addRoute(draft.lineId, draft.name, cleaned, [], {
          color: draft.color,
          trainCount: 1,
          headwaySec: 18,
          customTrainLength: draft.customTrainLength || 120,
          skipStopKeys: Array.from(draft.skipStopKeys || [])
        });
      }

      if (!saved) {
        this.showToast('交路构建失败');
        return;
      }
      const line = this.routes.getLine(saved.lineId);
      this.routeDraft = null;
      this.selectedRouteId = saved.id;
      this.dispatcher.syncTrainsWithRoutes();
      this.renderSubbar();
      this.renderLineTree();
      this.refreshDiagnostics();
      if (saved.shortPlatformError) {
        this.showToast(`已保存，但停靠站台最短 ${saved.shortPlatformError.minPlatformLength}m < ${saved.trainLength}m 编组，该交路已停运`);
      } else if (saved.invalidUturns && saved.invalidUturns.length > 0) {
        const firstBad = saved.invalidUturns[0];
        this.showToast(`已保存，但检测到「${firstBad.nodeId}」存在 ${firstBad.angleDeg}° 非法道岔折返，请点「编辑」调整`);
      } else {
        this.showToast(`已保存「${line ? line.name + ' / ' : ''}${saved.name}」(${saved.trainLength}m)`);
      }
    }

    showSnapPopover(sp, sx, sy) {
      this.activeSnapPopover = sp;
      const pop = document.getElementById('snapPopover');
      const p = this.platforms.getPlatform(sp.platformId);
      document.getElementById('popTitleText').textContent = `${p ? p.name : '站台'} · 设线点`;
      pop.style.left = clamp(sx + 12, 10, this.width - 230) + 'px';
      pop.style.top = clamp(sy - 16, 54, this.height - 155) + 'px';
      pop.classList.add('visible');
    }

    hideSnapPopover() {
      this.activeSnapPopover = null;
      document.getElementById('snapPopover').classList.remove('visible');
    }

    buildDraftBoxHtml(d) {
      const parentLine = this.routes.getLine(d.lineId);
      const curLen = Number(d.customTrainLength) || 120;
      const GAP = '__GAP__';
      const len = d.nodeIds.length;
      const selA = (d.selectedSegIdx !== null && d.selectedSegIdx !== undefined) ? d.selectedSegIdx : -1;
      const selB = selA >= 0 ? (selA + 1) % len : -1;
      const nodesHtml = d.nodeIds.map((nid, idx) => {
        if (nid === GAP) return '';
        const isSlot = d.insertAfterIdx === idx;
        const nextRaw = len >= 2 ? d.nodeIds[(idx + 1) % len] : null;
        const isGapAfter = nextRaw === GAP;
        const targetNextId = this.getDraftTargetAfter(d.nodeIds, idx);
        const edge = (!isGapAfter && targetNextId) ? this.graph.getEdgeBetween(nid, targetNextId) : null;
        const broken = isGapAfter || (len >= 2 && targetNextId && !edge);
        const isSegEnd = idx === selA || idx === selB;
        const isCutFocus = d.lastCutSlotIdx === idx;
        let platChip = '';
        if (edge && edge.isStationTrack) {
          const p = this.platforms.getPlatform(edge.platformId);
          const dirKey = nid + '->' + targetNextId;
          const isSkip = d.skipStopKeys && d.skipStopKeys.has(dirKey);
          platChip = `<button class="plat-stop-chip ${isSkip ? 'skip' : ''}" data-draft-stop-key="${dirKey}" title="点击切换停站或不停通过">${p ? p.name : '站台'}·${isSkip ? '过' : '停'}</button>`;
        }
        return `
          <span class="loop-chip ${broken ? 'bad' : ''} ${isSegEnd ? 'seg-selected' : ''}" data-draft-node-idx="${idx}">
            <span data-focus-node="${nid}" style="cursor:pointer;font-weight:600;" title="定位节点 ${nid}">${nid}</span>
            <button class="loop-chip-del" data-draft-del="${idx}" title="移除节点">×</button>
          </span>
          ${platChip}
          <button class="loop-slot-btn ${isGapAfter ? 'gap-slot' : ''} ${isSlot ? 'active' : ''} ${isCutFocus ? 'seg-selected' : ''}" data-draft-slot="${idx}" title="${isGapAfter ? `已断开，点击在 ${nid} 与 ${targetNextId || ''} 之间连续插入节点` : `在 ${nid} 与 ${targetNextId || ''} 之间连续插入节点`}">${isGapAfter ? '断开 +' : '+'}</button>
        `;
      }).join('');
      const nodeCount = d.nodeIds.filter(x => x !== '__GAP__').length;
      return `
        <div class="draft-box" style="${d.editingRouteId ? 'margin-top:6px;' : ''}">
          ${d.editingRouteId ? `
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);">
              <span>点击线段选中删除 · 点 + 连续插点</span>
              <strong style="color:var(--accent);">${nodeCount} 节点</strong>
            </div>
          ` : `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:11.5px;color:var(--accent);">
              <span style="white-space:nowrap;">${parentLine ? parentLine.name + ' /' : ''}</span>
              <input class="input-sm" id="draftNameInput" value="${d.name.replace(/"/g, '&quot;')}" style="flex:1;min-width:72px;padding:2px 6px;font-weight:700;">
              <span style="white-space:nowrap;">${nodeCount} 节点</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
              <span style="font-size:11px;color:var(--text-muted);font-weight:600;white-space:nowrap;">编组</span>
              <div class="chip-group" id="draftLenGroup" style="flex:1;justify-content:space-between;">
                <button class="chip ${curLen === 120 ? 'active' : ''}" data-draft-len="120" style="flex:1;">4编 120m</button>
                <button class="chip ${curLen === 180 ? 'active' : ''}" data-draft-len="180" style="flex:1;">6编 180m</button>
                <button class="chip ${curLen === 240 ? 'active' : ''}" data-draft-len="240" style="flex:1;">8编 240m</button>
              </div>
            </div>
            <div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;">点击线段选中删除 · 点 + 连续插点直至连通</div>
          `}
          <div class="draft-nodes" id="draftNodesList">${nodesHtml}</div>
          <div style="display:flex;gap:5px;">
            <button class="btn btn-primary btn-xs" id="draftSaveBtn" style="flex:1;justify-content:center;">✓ ${d.editingRouteId ? '保存路线' : '闭合保存'}</button>
            <button class="btn btn-xs" id="draftUndoBtn">退一格</button>
            <button class="btn btn-danger btn-xs" id="draftCancelBtn">取消</button>
          </div>
        </div>
      `;
    }

    bindDraftBoxEvents(wrap) {
      if (!this.routeDraft) return;
      const nameInp = document.getElementById('draftNameInput');
      if (nameInp) {
        nameInp.addEventListener('input', e => { this.routeDraft.name = e.target.value; });
      }
      wrap.querySelectorAll('[data-draft-len]').forEach(btn => btn.addEventListener('click', () => {
        this.routeDraft.customTrainLength = Number(btn.dataset.draftLen);
        this.renderLineTree();
      }));
      wrap.querySelectorAll('[data-draft-stop-key]').forEach(btn => btn.addEventListener('click', () => {
        const k = btn.dataset.draftStopKey;
        if (!this.routeDraft.skipStopKeys) this.routeDraft.skipStopKeys = new Set();
        if (this.routeDraft.skipStopKeys.has(k)) this.routeDraft.skipStopKeys.delete(k);
        else this.routeDraft.skipStopKeys.add(k);
        this.renderLineTree();
      }));
      wrap.querySelectorAll('[data-draft-del]').forEach(btn => btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.draftDel);
        this.routeDraft.nodeIds.splice(idx, 1);
        this.normalizeDraftGaps(this.routeDraft.nodeIds);
        this.routeDraft.selectedSegIdx = null;
        this.routeDraft.insertAfterIdx = null;
        this.renderSubbar();
        this.renderLineTree();
      }));
      wrap.querySelectorAll('[data-draft-slot]').forEach(btn => btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.draftSlot);
        this.routeDraft.selectedSegIdx = null;
        this.routeDraft.lastCutSlotIdx = null;
        this.routeDraft.insertAfterIdx = (this.routeDraft.insertAfterIdx === idx) ? null : idx;
        if (this.routeDraft.insertAfterIdx !== null) {
          this.focusNodeOnMap(this.routeDraft.nodeIds[idx]);
        }
        this.renderSubbar();
        this.renderLineTree();
      }));
      const scrollTarget = wrap.querySelector('#draftNodesList .loop-chip.seg-selected, #draftNodesList .loop-slot-btn.active, #draftNodesList .loop-slot-btn.seg-selected');
      if (scrollTarget) {
        scrollTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      const saveBtn = document.getElementById('draftSaveBtn');
      if (saveBtn) saveBtn.addEventListener('click', () => this.finishRouteDraft());
      const undoBtn = document.getElementById('draftUndoBtn');
      if (undoBtn) undoBtn.addEventListener('click', () => {
        if (this.routeDraft.nodeIds.length > 0) {
          this.routeDraft.nodeIds.pop();
          this.routeDraft.insertAfterIdx = null;
          this.renderSubbar();
          this.renderLineTree();
        }
      });
      const cancelBtn = document.getElementById('draftCancelBtn');
      if (cancelBtn) cancelBtn.addEventListener('click', () => {
        this.routeDraft = null;
        this.renderSubbar();
        this.renderLineTree();
      });
    }

    renderLineTree() {
      const wrap = document.getElementById('treeWrap');
      const isSimMode = this.mode === 'simulate';
      const showRoutesSidebar = (this.mode === 'route' || this.mode === 'simulate');
      const lineHeadBlock = document.getElementById('lineListHeaderBlock');
      if (!showRoutesSidebar) {
        if (lineHeadBlock) lineHeadBlock.style.display = 'none';
        if (wrap) wrap.style.display = 'none';
        return;
      }
      if (wrap) wrap.style.display = '';

      // Single-Route Detail View (editable in route mode, strictly read-only in simulate mode)
      if (this.inspectedRouteId && this.routes.routes.has(this.inspectedRouteId)) {
        if (lineHeadBlock) lineHeadBlock.style.display = 'none';
        const r = this.routes.routes.get(this.inspectedRouteId);
        const parentLine = this.routes.getLine(r.lineId);
        const stopChain = [];
        for (let i = 0; i < r.nodeIds.length; i++) {
          const aId = r.nodeIds[i];
          const bId = r.nodeIds[(i + 1) % r.nodeIds.length];
          const edge = this.graph.getEdgeBetween(aId, bId);
          if (!edge || !edge.isStationTrack) continue;
          const dirKey = aId + '->' + bId;
          if (r.skipStopKeys && r.skipStopKeys.has(dirKey)) continue;
          const prevEdge = this.graph.getEdgeBetween(r.nodeIds[(i - 1 + r.nodeIds.length) % r.nodeIds.length], aId);
          if (r.turnbackIndices.has(i) && prevEdge && prevEdge.id === edge.id) continue;
          const p = this.platforms.getPlatform(edge.platformId);
          stopChain.push({ name: p ? p.name : '站台', nodeId: aId });
        }
        const isEditingThis = !isSimMode && !!(this.routeDraft && this.routeDraft.editingRouteId === r.id);
        const curLen = Number(r.customTrainLength || r.trainLength) || 120;
        let detailHtml = `
          <div class="detail-head">
            <button class="detail-back-btn" id="btnDetailBack" title="返回线路与交路主界面">← 返回</button>
            <span class="color-dot" id="detailColorDot" style="background:${r.color};${isSimMode ? 'cursor:default;' : 'cursor:pointer;'}" title="${isSimMode ? '' : '点击切换交路颜色'}"></span>
            <span id="detailRouteName" style="font-weight:700;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${isSimMode ? '' : 'cursor:text;'}" title="${isSimMode ? (parentLine ? parentLine.name + ' / ' : '') + r.name : '点击编辑交路名称'}">${r.name}</span>
            <span style="font-size:10.5px;color:${r.runnable ? 'var(--text-muted)' : 'var(--danger)'};font-weight:${r.runnable ? '600' : '700'};">${r.runnable ? `${r.trainLength}m` : '停运'}</span>
          </div>
          ${!r.runnable && r.brokenReason ? `<div style="font-size:11px;color:var(--danger);background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.28);border-radius:6px;padding:6px 8px;margin-bottom:8px;">交路停运：${r.brokenReason}</div>` : ''}
          <div class="detail-section">
            <div class="detail-sec-title">
              <span>交路缩略图</span>
              <span class="mini-ctrl">
                <span>${r.turnbackPoints.length > 0 ? `折返×${r.turnbackPoints.length}` : '环线'}</span>
                <button class="btn btn-xs" id="detailDecTrain">-</button>
                <strong>${r.trainCount}车</strong>
                <button class="btn btn-xs" id="detailIncTrain">+</button>
              </span>
            </div>
            <div class="station-chain-wrap" style="border-top:none;padding-top:2px;">
              ${stopChain.length === 0
                ? `<span style="font-size:11px;color:var(--text-dim);">暂无停靠站点</span>`
                : stopChain.map((st, idx) => `
                    <span class="station-box" data-focus-node="${st.nodeId}" title="点击定位至「${st.name}」">${st.name}</span>
                    ${idx < stopChain.length - 1 ? '<span class="chain-arrow">→</span>' : '<span class="chain-arrow" title="闭环交路">↺</span>'}
                  `).join('')
              }
            </div>
          </div>
          ${!isSimMode ? `
            <div class="detail-section">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
                <span style="font-size:11px;color:var(--text-muted);font-weight:600;white-space:nowrap;">编组</span>
                <div class="chip-group" style="flex:1;justify-content:space-between;">
                  <button class="chip ${curLen === 120 ? 'active' : ''}" data-detail-len="120" style="flex:1;">4编 120m</button>
                  <button class="chip ${curLen === 180 ? 'active' : ''}" data-detail-len="180" style="flex:1;">6编 180m</button>
                  <button class="chip ${curLen === 240 ? 'active' : ''}" data-detail-len="240" style="flex:1;">8编 240m</button>
                </div>
              </div>
              <div class="detail-sec-title" style="margin-bottom:${isEditingThis ? '4px' : '0'};">
                <span>路线编辑</span>
                ${isEditingThis ? `<span style="color:var(--accent);font-weight:600;">编辑中（已隐藏列车）</span>` : `<button class="btn btn-primary btn-xs" id="btnEnableDetailEdit">启用编辑</button>`}
              </div>
              ${isEditingThis
                ? this.buildDraftBoxHtml(this.routeDraft)
                : `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;">停靠站台长度需 ≥ 所选编组；启用编辑可增删节点与切换停站/过站。</div>`
              }
            </div>
          ` : ''}
        `;
        wrap.innerHTML = detailHtml;

        wrap.querySelectorAll('[data-focus-node]').forEach(el => {
          el.addEventListener('click', e => {
            e.stopPropagation();
            this.focusNodeOnMap(el.dataset.focusNode);
          });
        });
        document.getElementById('btnDetailBack').addEventListener('click', () => {
          this.inspectedRouteId = null;
          this.selectedRouteId = null;
          this.routeDraft = null;
          this.renderSubbar();
          this.renderLineTree();
        });
        if (!isSimMode) {
          document.getElementById('detailColorDot').addEventListener('click', e => {
            e.stopPropagation();
            this.openColorPicker(e.currentTarget, `${r.name} 标识色`, r.color, c => {
              r.color = c;
              this.renderLineTree();
            });
          });
          const detailNameEl = document.getElementById('detailRouteName');
          if (detailNameEl) {
            detailNameEl.addEventListener('click', e => {
              e.stopPropagation();
              const inp = document.createElement('input');
              inp.className = 'input-sm';
              inp.value = r.name;
              inp.style.flex = '1';
              inp.style.minWidth = '0';
              inp.style.padding = '2px 6px';
              inp.style.fontWeight = '700';
              detailNameEl.replaceWith(inp);
              inp.focus();
              inp.select();
              const commit = () => {
                const val = inp.value.trim();
                if (val && val !== r.name) {
                  this.pushHistory('重命名交路');
                  r.name = val;
                  if (this.routeDraft && this.routeDraft.editingRouteId === r.id) {
                    this.routeDraft.name = val;
                  }
                }
                this.renderLineTree();
              };
              inp.addEventListener('blur', commit);
              inp.addEventListener('keydown', ev => {
                if (ev.key === 'Enter') inp.blur();
                if (ev.key === 'Escape') { inp.value = r.name; inp.blur(); }
              });
            });
          }
        }
        document.getElementById('detailDecTrain').addEventListener('click', () => {
          if (r.trainCount > 1) {
            this.pushHistory('调整配车');
            r.trainCount--;
            const removedId = this.dispatcher.removeTrainFromRoute(r);
            if (removedId && this.selectedTrainId === removedId) this.selectedTrainId = null;
            this.renderLineTree();
            this.refreshDiagnostics();
          }
        });
        document.getElementById('detailIncTrain').addEventListener('click', () => {
          const added = this.dispatcher.addTrainToRoute(r, true);
          if (!added) {
            this.showToast(r.runnable ? '线路空间已满，不能再加这么多车（继续加车会导致列车重叠）' : '交路当前已停运，无法加车');
            return;
          }
          this.pushHistory('调整配车');
          r.trainCount++;
          this.renderLineTree();
          this.refreshDiagnostics();
        });
        const enableEditBtn = document.getElementById('btnEnableDetailEdit');
        if (enableEditBtn) {
          enableEditBtn.addEventListener('click', () => this.startEditRoute(r.id));
        }
        wrap.querySelectorAll('[data-detail-len]').forEach(btn => {
          btn.addEventListener('click', () => {
            const newLen = Number(btn.dataset.detailLen);
            this.pushHistory('修改交路编组');
            r.customTrainLength = newLen;
            if (this.routeDraft && this.routeDraft.editingRouteId === r.id) {
              this.routeDraft.customTrainLength = newLen;
            }
            r.buildGeometry(this.graph);
            this.dispatcher.syncTrainsWithRoutes(false);
            this.renderLineTree();
            this.refreshDiagnostics();
            if (r.shortPlatformError) {
              this.showToast(`停靠站台最短 ${r.shortPlatformError.minPlatformLength}m < ${newLen}m，该交路已停运`);
            } else {
              this.showToast(`「${r.name}」编组已切换为 ${newLen}m`);
            }
          });
        });
        if (isEditingThis) this.bindDraftBoxEvents(wrap);
        return;
      }

      if (lineHeadBlock) lineHeadBlock.style.display = '';
      let html = '';

      if (this.routeDraft) {
        html += this.buildDraftBoxHtml(this.routeDraft);
      }

      if (this.routes.lines.size === 0) {
        html += `<div style="color:var(--text-dim);text-align:center;padding:24px 10px;line-height:1.6;">
          暂无线路<br>点击上方「+ 新建线路」后即可为其创建下属交路
        </div>`;
      } else {
        for (const line of this.routes.lines.values()) {
          const subRoutes = this.routes.getRoutesByLine(line.id);
          const isLineCollapsed = this.collapsedLines.has(line.id);
          html += `
            <div class="line-group ${isLineCollapsed ? 'collapsed' : ''}" data-line-id="${line.id}">
              <div class="line-head">
                <div class="line-title-wrap">
                  <button class="collapse-caret ${isLineCollapsed ? 'collapsed' : ''}" data-action="toggle-line-collapse" title="折叠/展开线路">▾</button>
                  <span class="line-bar" style="background:${line.color};${isSimMode ? 'cursor:default;' : ''}" data-action="cycle-line-color" title="${isSimMode ? '' : '切换线路主色'}"></span>
                  <span class="line-name" data-action="rename-line" title="${isSimMode ? line.name : '双击重命名线路'}" style="${isSimMode ? '' : 'cursor:text;'}">${line.name}</span>
                </div>
                <div style="display:flex;gap:3px;">
                  ${!isSimMode ? `<button class="btn btn-xs" data-action="add-sub-route" title="新增交路">+ 交路</button>` : ''}
                  ${!isSimMode ? `<button class="icon-btn ${this.expandedLineSettings.has(line.id) ? 'active' : ''}" data-action="toggle-line-settings" title="线路列车参数"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2"/></svg></button>` : ''}
                  <button class="icon-btn" data-action="toggle-line-vis" title="显示/隐藏">${line.visible ? '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'}</button>
                  ${!isSimMode ? `<button class="icon-btn danger" data-action="delete-line" title="删除线路"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
                </div>
              </div>
              ${!isSimMode && this.expandedLineSettings.has(line.id) ? `
                <div class="line-settings">
                  <div class="line-param-row">
                    <span>速度</span>
                    <input type="range" min="40" max="160" step="5" value="${line.speedKmh}" data-action="line-speed">
                    <strong class="lp-speed">${line.speedKmh}km/h</strong>
                  </div>
                  <div class="line-param-row">
                    <span>停站</span>
                    <input type="range" min="0.5" max="15" step="0.5" value="${line.dwellSec}" data-action="line-dwell">
                    <strong class="lp-dwell">${line.dwellSec}s</strong>
                  </div>
                  <div class="line-param-row">
                    <span>折返</span>
                    <input type="range" min="0.5" max="20" step="0.5" value="${line.turnbackSec}" data-action="line-turnback">
                    <strong class="lp-tb">${line.turnbackSec}s</strong>
                  </div>
                  <div class="line-param-row" style="justify-content:space-between;">
                    <span>标识色</span>
                    <button class="btn btn-xs" data-action="pick-line-color" style="gap:5px;">
                      <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${line.color}"></span>
                      <span style="font-family:monospace;">${line.color.toUpperCase()}</span>
                    </button>
                  </div>
                </div>
              ` : ''}
              <div class="line-routes">
                ${subRoutes.length === 0 ? `<div style="font-size:11px;color:var(--text-dim);padding:4px 2px;">暂无下属交路，点击右上「+ 交路」绘制</div>` : subRoutes.map(r => {
                  const cars = Math.max(2, Math.round(r.trainLength / 30));
                  const isRouteCollapsed = this.collapsedRoutes.has(r.id);
                  const stopChain = [];
                  for (let i = 0; i < r.nodeIds.length; i++) {
                    const aId = r.nodeIds[i];
                    const bId = r.nodeIds[(i + 1) % r.nodeIds.length];
                    const edge = this.graph.getEdgeBetween(aId, bId);
                    if (!edge || !edge.isStationTrack) continue;
                    const dirKey = aId + '->' + bId;
                    if (r.skipStopKeys && r.skipStopKeys.has(dirKey)) continue;
                    const prevEdge = this.graph.getEdgeBetween(r.nodeIds[(i - 1 + r.nodeIds.length) % r.nodeIds.length], aId);
                    if (r.turnbackIndices.has(i) && prevEdge && prevEdge.id === edge.id) continue;
                    const p = this.platforms.getPlatform(edge.platformId);
                    stopChain.push({ name: p ? p.name : '站台', nodeId: aId });
                  }
                  return `
                    <div class="route-item" data-route-id="${r.id}">
                      <div class="route-top">
                        <button class="collapse-caret" data-action="inspect-route" title="查看交路详情">▸</button>
                        <div class="route-label" data-action="select-route">
                          <span class="color-dot" style="background:${r.color};${isSimMode ? 'cursor:default;' : ''}" data-action="cycle-route-color" title="${isSimMode ? '' : '切换交路色彩'}"></span>
                          <span class="route-name" data-action="rename-route" title="${isSimMode ? '点击查看交路详情' : '单击进入单交路详情 · 双击重命名'}">${r.name}</span>
                        </div>
                        <div style="display:flex;gap:3px;align-items:center;">
                          <span style="font-size:10px;color:${r.runnable ? 'var(--text-muted)' : 'var(--danger)'};font-weight:${r.runnable ? '400' : '700'}">${r.runnable ? `${r.trainLength}m` : '停运'}</span>
                          ${!isSimMode ? `<button class="icon-btn" data-action="edit-route" title="编辑"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ''}
                          <button class="icon-btn" data-action="toggle-route-vis" title="显隐">${r.visible ? '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'}</button>
                          ${!isSimMode ? `<button class="icon-btn danger" data-action="delete-route" title="删除"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
                        </div>
                      </div>
                      <div class="route-body">
                        <div class="route-sub" style="margin-top:0;justify-content:space-between;">
                          <span style="font-size:11px;color:var(--text-muted);">${r.turnbackPoints.length > 0 ? `折返×${r.turnbackPoints.length}` : '环线'}</span>
                          <span class="mini-ctrl">
                            <button class="btn btn-xs" data-action="dec-train">-</button>
                            <strong>${r.trainCount}车</strong>
                            <button class="btn btn-xs" data-action="inc-train">+</button>
                          </span>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      }

      wrap.innerHTML = html;

      // Bind focus-node clicks (pan & highlight node on map until next user action)
      wrap.querySelectorAll('[data-focus-node]').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          this.focusNodeOnMap(el.dataset.focusNode);
        });
      });

      if (this.routeDraft) {
        this.bindDraftBoxEvents(wrap);
      }

      // Bind line actions
      wrap.querySelectorAll('.line-group').forEach(group => {
        const lid = group.dataset.lineId;
        const line = this.routes.getLine(lid);
        if (!line) return;

        group.querySelector('[data-action="toggle-line-collapse"]').addEventListener('click', () => {
          if (this.collapsedLines.has(lid)) this.collapsedLines.delete(lid);
          else this.collapsedLines.add(lid);
          this.renderLineTree();
        });
        const lineNameEl = group.querySelector('[data-action="rename-line"]');
        lineNameEl.addEventListener('dblclick', e => {
          e.stopPropagation();
          if (this.mode === 'simulate') { this.setMode('route'); return; }
          const inp = document.createElement('input');
          inp.className = 'input-sm';
          inp.value = line.name;
          inp.style.width = '100%';
          inp.style.padding = '2px 5px';
          lineNameEl.replaceWith(inp);
          inp.focus();
          inp.select();
          const commit = () => {
            const val = inp.value.trim();
            if (val && val !== line.name) {
              this.pushHistory('重命名线路');
              line.name = val;
            }
            this.renderSubbar();
            this.renderLineTree();
          };
          inp.addEventListener('blur', commit);
          inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') inp.blur(); if (ev.key === 'Escape') { inp.value = line.name; inp.blur(); } });
        });
        const openLineCP = (el) => {
          this.openColorPicker(el, `${line.name} 标识色`, line.color, c => {
            line.color = c;
            this.renderLineTree();
          });
        };
        const lineColorEl = group.querySelector('[data-action="cycle-line-color"]');
        if (lineColorEl && !isSimMode) {
          lineColorEl.addEventListener('click', e => {
            e.stopPropagation();
            openLineCP(e.currentTarget);
          });
        }
        const pickLineColorBtn = group.querySelector('[data-action="pick-line-color"]');
        if (pickLineColorBtn) {
          pickLineColorBtn.addEventListener('click', e => {
            e.stopPropagation();
            openLineCP(e.currentTarget);
          });
        }
        const settingsBtn = group.querySelector('[data-action="toggle-line-settings"]');
        if (settingsBtn) {
          settingsBtn.addEventListener('click', () => {
            if (this.expandedLineSettings.has(lid)) this.expandedLineSettings.delete(lid);
            else this.expandedLineSettings.add(lid);
            this.renderLineTree();
          });
        }
        const spSl = group.querySelector('[data-action="line-speed"]');
        if (spSl) spSl.addEventListener('input', e => {
          line.speedKmh = Number(e.target.value);
          group.querySelector('.lp-speed').textContent = line.speedKmh + 'km/h';
        });
        const dwSl = group.querySelector('[data-action="line-dwell"]');
        if (dwSl) dwSl.addEventListener('input', e => {
          line.dwellSec = Number(e.target.value);
          group.querySelector('.lp-dwell').textContent = line.dwellSec + 's';
        });
        const tbSl = group.querySelector('[data-action="line-turnback"]');
        if (tbSl) tbSl.addEventListener('input', e => {
          line.turnbackSec = Number(e.target.value);
          group.querySelector('.lp-tb').textContent = line.turnbackSec + 's';
        });
        const addSubBtn = group.querySelector('[data-action="add-sub-route"]');
        if (addSubBtn) {
          addSubBtn.addEventListener('click', () => {
            this.startRouteDraft(lid);
          });
        }
        group.querySelector('[data-action="toggle-line-vis"]').addEventListener('click', () => {
          line.visible = !line.visible;
          this.renderLineTree();
        });
        const delLineBtn = group.querySelector('[data-action="delete-line"]');
        if (delLineBtn) delLineBtn.addEventListener('click', () => {
          this.pushHistory('删除线路');
          this.routes.removeLine(lid);
          if (this.routeDraft && this.routeDraft.lineId === lid) this.routeDraft = null;
          if (this.activeLineIdForDraft === lid) this.activeLineIdForDraft = this.routes.lines.keys().next().value || null;
          this.dispatcher.syncTrainsWithRoutes();
          this.renderSubbar();
          this.renderLineTree();
          this.showToast(`已删除「${line.name}」及其下属交路`);
        });
      });

      // Bind route actions
      wrap.querySelectorAll('.route-item').forEach(item => {
        const rid = item.dataset.routeId;
        const route = this.routes.routes.get(rid);
        if (!route) return;

        const openDetail = () => {
          this.inspectedRouteId = rid;
          this.selectedRouteId = rid;
          this.renderSubbar();
          this.renderLineTree();
        };
        const inspectBtn = item.querySelector('[data-action="inspect-route"]');
        if (inspectBtn) inspectBtn.addEventListener('click', openDetail);
        const rNameEl = item.querySelector('[data-action="rename-route"]');
        rNameEl.addEventListener('dblclick', e => {
          if (this.mode === 'simulate') return;
          e.stopPropagation();
          const inp = document.createElement('input');
          inp.className = 'input-sm';
          inp.value = route.name;
          inp.style.width = '100%';
          inp.style.padding = '2px 5px';
          rNameEl.replaceWith(inp);
          inp.focus();
          inp.select();
          const commit = () => {
            const val = inp.value.trim();
            if (val && val !== route.name) {
              this.pushHistory('重命名交路');
              route.name = val;
            }
            this.renderLineTree();
          };
          inp.addEventListener('blur', commit);
          inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') inp.blur(); if (ev.key === 'Escape') { inp.value = route.name; inp.blur(); } });
        });
        item.querySelector('[data-action="select-route"]').addEventListener('click', e => {
          if (!isSimMode && e.target.dataset.action === 'cycle-route-color') return;
          openDetail();
        });
        const routeColorEl = item.querySelector('[data-action="cycle-route-color"]');
        if (routeColorEl && !isSimMode) {
          routeColorEl.addEventListener('click', e => {
            e.stopPropagation();
            this.openColorPicker(e.currentTarget, `${route.name} 标识色`, route.color, c => {
              route.color = c;
              this.renderLineTree();
            });
          });
        }
        const editBtn = item.querySelector('[data-action="edit-route"]');
        if (editBtn) editBtn.addEventListener('click', () => {
          this.startEditRoute(rid);
        });
        item.querySelector('[data-action="toggle-route-vis"]').addEventListener('click', () => {
          route.visible = !route.visible;
          this.renderLineTree();
        });
        const delBtn = item.querySelector('[data-action="delete-route"]');
        if (delBtn) delBtn.addEventListener('click', () => {
          this.pushHistory('删除交路');
          this.routes.removeRoute(rid);
          if (this.selectedRouteId === rid) this.selectedRouteId = null;
          if (this.inspectedRouteId === rid) this.inspectedRouteId = null;
          this.dispatcher.syncTrainsWithRoutes();
          this.renderSubbar();
          this.renderLineTree();
        });
        item.querySelector('[data-action="dec-train"]').addEventListener('click', () => {
          if (route.trainCount > 1) {
            this.pushHistory('调整配车');
            route.trainCount--;
            const removedId = this.dispatcher.removeTrainFromRoute(route);
            if (removedId && this.selectedTrainId === removedId) this.selectedTrainId = null;
            this.renderLineTree();
            this.refreshDiagnostics();
          }
        });
        item.querySelector('[data-action="inc-train"]').addEventListener('click', () => {
          const added = this.dispatcher.addTrainToRoute(route, true);
          if (!added) {
            this.showToast(route.runnable ? '线路空间已满，不能再加这么多车（继续加车会导致列车重叠）' : '交路当前已停运，无法加车');
            return;
          }
          this.pushHistory('调整配车');
          route.trainCount++;
          this.renderLineTree();
          this.refreshDiagnostics();
        });
        item.querySelectorAll('[data-action="toggle-stop-key"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.stopKey;
            this.pushHistory('切换停站/通过');
            if (!route.skipStopKeys) route.skipStopKeys = new Set();
            if (route.skipStopKeys.has(k)) route.skipStopKeys.delete(k);
            else route.skipStopKeys.add(k);
            route.buildGeometry(this.graph);
            this.renderLineTree();
            this.refreshDiagnostics();
            this.showToast(`已切换为「${route.skipStopKeys.has(k) ? '贴站台不停通过' : '站台停靠'}」`);
          });
        });
        item.querySelectorAll('[data-action="insert-between"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const afterIdx = Number(btn.dataset.afterIdx);
            const fromId = route.nodeIds[afterIdx];
            const toId = route.nodeIds[(afterIdx + 1) % route.nodeIds.length];
            this.setMode('route');
            this.pendingRouteInsert = { routeId: rid, afterIndex: afterIdx, fromId, toId };
            this.focusNodeOnMap(fromId);
            this.renderSubbar();
            this.renderLineTree();
            this.showToast(`请点击画布上的节点，插入到 ${fromId} → ${toId} 之间`);
          });
        });
        item.querySelectorAll('[data-action="remove-loop-node"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const nIdx = Number(btn.dataset.nidx);
            this.pushHistory('删除交路环节点');
            const res = this.routes.removeNodeFromRoute(rid, nIdx);
            if (!res.ok) {
              this.undoStack.pop();
              this.updateHistoryButtons();
              this.showToast(res.reason);
              return;
            }
            this.dispatcher.syncTrainsWithRoutes();
            this.renderLineTree();
            this.refreshDiagnostics();
            this.showToast(`已从「${route.name}」移除节点并自动重连闭环`);
          });
        });
      });
    }

    updateLivePanelStats() {
      document.getElementById('simClock').textContent = formatTime(this.dispatcher.simTime);
      document.getElementById('statTrains').textContent = this.dispatcher.trains.size;

      let locked = 0;
      for (const e of this.graph.edges.values()) if (e.lockedBy) locked++;
      let waiting = 0;
      for (const t of this.dispatcher.trains.values()) if (t.state === 'WAITING') waiting++;
      document.getElementById('statBlocks').textContent = locked;
      document.getElementById('statWaiting').textContent = waiting;

      const insp = document.getElementById('trainInspector');
      if (this.selectedTrainId && this.dispatcher.trains.has(this.selectedTrainId)) {
        const t = this.dispatcher.trains.get(this.selectedTrainId);
        const r = this.routes.routes.get(t.routeId);
        const line = r ? this.routes.getLine(r.lineId) : null;
        const map = {
          RUNNING: { txt: '运行中', c: '#10b981' },
          DWELL: { txt: `停站 ${t.stateTimer.toFixed(1)}s`, c: '#0ea5e9' },
          TURNBACK: { txt: `折返换端 ${t.stateTimer.toFixed(1)}s`, c: '#f59e0b' },
          WAITING: { txt: `闭塞等待 · ${t.waitingForEdgeId || ''}`, c: '#f43f5e' }
        };
        const st = map[t.state] || map.RUNNING;
        insp.innerHTML = `
          <div style="display:flex;justify-content:space-between;color:var(--text-main);font-weight:600;margin-bottom:3px;">
            <span>${t.id} · ${line ? line.name + ' / ' : ''}${r ? r.name : ''}</span>
            <span>${t.length}m</span>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span><span class="status-dot" style="background:${st.c}"></span>${st.txt}</span>
            <span>${Math.round(t.speed * 0.85)} km/h · 占用 ${Array.from(t.occupiedEdges).join(', ')}</span>
          </div>
        `;
      } else {
        insp.textContent = '点击列车查看实时状态';
      }

      const nowMs = performance.now();
      if (nowMs - this.lastDiagCheck > 400) {
        this.lastDiagCheck = nowMs;
        this.refreshDiagnostics();
      }
    }

    deleteSelectedEntity() {
      if (!this.selectedEntity) return;
      const { type, id } = this.selectedEntity;
      if (type === 'platform') {
        this.pushHistory('删除站台');
        this.platforms.removePlatform(id);
        this.showToast('已删除选中站台');
      } else if (type === 'node') {
        this.pushHistory('删除节点');
        for (const e of this.graph.getIncidentEdges(id)) {
          for (const p of this.platforms.platforms.values()) {
            [-1, 1].forEach(sDir => {
              if (p.sides[String(sDir)].type === 'track' && p.sides[String(sDir)].refId === e.id) {
                p.sides[String(sDir)] = { type: null, refId: null };
              }
            });
          }
        }
        this.graph.removeNode(id);
        this.showToast(`已删除节点 ${id}`);
      } else if (type === 'edge') {
        this.pushHistory('删除轨道');
        for (const p of this.platforms.platforms.values()) {
          [-1, 1].forEach(sDir => {
            if (p.sides[String(sDir)].type === 'track' && p.sides[String(sDir)].refId === id) {
              p.sides[String(sDir)] = { type: null, refId: null };
            }
          });
        }
        this.graph.removeEdge(id);
        this.showToast(`已删除轨道 ${id}`);
      }
      this.selectedEntity = null;
      this.cleanupAndRenumberGraph();
      this.graph.syncAllCrossings('level');
      this.routes.rebuildAll();
      this.dispatcher.syncTrainsWithRoutes();
      this.renderSubbar();
      this.renderLineTree();
      this.refreshDiagnostics();
    }

    refreshDiagnostics() {
      const issues = this.dispatcher.diagnoseIssues();
      this.currentIssues = issues;
      const pill = document.getElementById('btnDiagAlerts');
      if (issues.length === 0) {
        pill.style.display = 'none';
        this.diagOpen = false;
        document.getElementById('diagPanel').classList.remove('open');
        this.seenIssueKeys.clear();
        return;
      }

      const hasError = issues.some(i => i.level === 'error');
      pill.style.display = 'inline-flex';
      pill.classList.toggle('error', hasError);
      pill.textContent = `${issues.length} 告警`;

      const nextKeys = new Set(issues.map(i => i.key));
      for (const issue of issues) {
        if (!this.seenIssueKeys.has(issue.key)) {
          this.showToast(`告警：${issue.title}`);
          break;
        }
      }
      this.seenIssueKeys = nextKeys;
      if (this.diagOpen) this.renderDiagPanel();
    }

    renderDiagPanel() {
      const panel = document.getElementById('diagPanel');
      if (!this.diagOpen || this.currentIssues.length === 0) {
        panel.classList.remove('open');
        return;
      }
      panel.classList.add('open');
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;">
          <span>运行诊断 (${this.currentIssues.length})</span>
          <button class="btn btn-xs" id="btnCloseDiag" style="border:none;background:transparent;">✕</button>
        </div>
        ${this.currentIssues.map((it, idx) => `
          <div class="diag-item ${it.level}">
            <div>
              <div style="font-weight:700;color:${it.level === 'error' ? 'var(--danger)' : '#f59e0b'}">${it.level === 'error' ? '🚨' : '⚠️'} ${it.title}</div>
              <div style="color:var(--text-muted);margin-top:2px;line-height:1.4;">${it.detail}</div>
            </div>
            <button class="btn btn-xs" data-locate-idx="${idx}">定位</button>
          </div>
        `).join('')}
      `;
      document.getElementById('btnCloseDiag').addEventListener('click', () => {
        this.diagOpen = false;
        panel.classList.remove('open');
      });
      panel.querySelectorAll('[data-locate-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          const it = this.currentIssues[Number(btn.dataset.locateIdx)];
          if (it) {
            this.cam.zoom = Math.max(this.cam.zoom, 0.9);
            this.cam.x = this.width / 2 - it.x * this.cam.zoom;
            this.cam.y = this.height / 2 - it.y * this.cam.zoom;
            this.updateZoomHUD();
          }
        });
      });
    }
